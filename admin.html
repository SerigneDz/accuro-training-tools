        // ============================================

        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // Calculate the actual calendar dates for a template given a start date
        // Skips weekends if includeWeekends is false
        function calculateScheduleDates(startDate, itemCount, includeWeekends) {
            const dates = [];
            let current = new Date(startDate + 'T00:00:00');
            
            // If start date falls on a weekend and weekends are excluded, move to next Monday
            if (!includeWeekends) {
                while (current.getDay() === 0 || current.getDay() === 6) {
                    current.setDate(current.getDate() + 1);
                }
            }
            
            for (let i = 0; i < itemCount; i++) {
                if (i > 0) {
                    current.setDate(current.getDate() + 1);
                    if (!includeWeekends) {
                        while (current.getDay() === 0 || current.getDay() === 6) {
                            current.setDate(current.getDate() + 1);
                        }
                    }
                }
                dates.push({
                    date: current.toISOString().split('T')[0],
                    dayOfWeek: DAYS_OF_WEEK[current.getDay()]
                });
            }
            
            return dates;
        }

        function formatDateDisplay(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Convert "HH:MM" (24hr) to "H:MM AM/PM" for display/CSV
        function formatTime12hr(timeStr) {
            if (!timeStr) return '';
            const [hourStr, minStr] = timeStr.split(':');
            let hour = parseInt(hourStr, 10);
            const period = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour}:${minStr} ${period}`;
        }

        // Sort tasks by their optional time field (tasks without a time keep relative order, appended last)
        function sortTasksByTime(tasks) {
            if (!tasks) return [];
            const withTime = tasks.filter(t => t.time);
            const withoutTime = tasks.filter(t => !t.time);
            withTime.sort((a, b) => a.time.localeCompare(b.time));
            return [...withTime, ...withoutTime];
        }

        const EDUCATION_STATUS = {
            not_started: { label: 'Not Started', color: 'bg-gray-100 text-gray-600', icon: '○' },
            in_progress: { label: 'In Progress', color: 'bg-yellow-100 text-yellow-700', icon: '⏳' },
            completed: { label: 'Completed', color: 'bg-green-100 text-green-700', icon: '✅' },

        // Parses a simple CSV (handles quoted fields) - matches the structure of the existing
        // education tracker spreadsheet: Course or Workshop Title; Completed; Month/Year Completed; 
        // Est. Time to Complete; Host; Website Link
        function parseCSV(text) {
            // Strip BOM if present
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            
            // Detect delimiter from the first non-empty line (support ; , and tab)
            const lines = text.split('\n');
            const firstNonEmpty = lines.find(l => l.trim() !== '') || '';
            let delimiter = ',';
            if (firstNonEmpty.includes('\t')) delimiter = '\t';
            else if (firstNonEmpty.includes(';')) delimiter = ';';
            else if (firstNonEmpty.includes(',')) delimiter = ',';
            
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];
                
                if (inQuotes) {
                    if (char === '"' && next === '"') { field += '"'; i++; }
                    else if (char === '"') { inQuotes = false; }
                    else { field += char; }
                } else {
                    if (char === '"') inQuotes = true;
                    else if (char === delimiter) { row.push(field); field = ''; }
                    else if (char === '\n' || char === '\r') {
                        if (char === '\r' && next === '\n') continue;
                        row.push(field); field = '';
                        if (row.some(c => c.trim() !== '')) rows.push(row);
                        row = [];
                    } else { field += char; }
                }
            }
            if (field !== '' || row.length > 0) {
                row.push(field);
                if (row.some(c => c.trim() !== '')) rows.push(row);
            }
            return rows;
        }
        
        // Map CSV header row to known field names (flexible matching)
        function mapEducationCSVHeaders(headerRow) {
            const map = {};
            headerRow.forEach((header, i) => {
                const h = header.trim().toLowerCase();
                if (h.includes('course') || h.includes('workshop') || h.includes('title')) map.title = i;
                else if (h.includes('completed') && !h.includes('month')) map.completedCheckbox = i;
                else if (h.includes('month') || h.includes('year')) map.completedDate = i;
                else if (h.includes('est') || h.includes('time to complete')) map.estTime = i;
                else if (h.includes('host')) map.host = i;
                else if (h.includes('website') || h.includes('link') || h.includes('url')) map.websiteLink = i;
            });
            return map;
        }
        
        // Determine effective status for a progress record, factoring in annual recurrence
        function getEducationStatus(course, progress) {
            if (!progress || progress.status === 'not_started' || !progress.status) {
                return 'not_started';
            }
            if (progress.status === 'in_progress') return 'in_progress';
            
            // status === 'completed'
            if (course.recurringAnnual && progress.completedDate) {
                const completed = new Date(progress.completedDate + '-01'); // YYYY-MM format
                const now = new Date();
                const oneYearLater = new Date(completed);
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                if (now > oneYearLater) return 'overdue';
            }
            return 'completed';
        }

        // Export a healthcare onboarding schedule to CSV (for Teams/Outlook/Google Calendar import)
        function exportScheduleToCSV(schedule) {
            const rows = [];
            rows.push(['Subject', 'Start Date', 'Start Time', 'End Date', 'End Time', 'Description', 'Categories']);
            
            schedule.items.forEach(item => {
                const sortedTasks = sortTasksByTime(item.tasks);
                const taskList = sortedTasks.map(t => t.time ? `${formatTime12hr(t.time)} - ${t.title}` : t.title).join('; ');
                const journeyInfo = (item.journeyIds && item.journeyIds.length > 0) 
                    ? `${item.journeyIds.length} linked journey(s)` 
                    : 'None';
                
                const description = [
                    `Tasks: ${taskList || 'None'}`,
                    `Linked Journeys: ${journeyInfo}`,
                    `Specialty: ${(schedule.specialties || []).join(', ')}`,
                    `Employee: ${schedule.employeeName}`,
                    item.description ? `Notes: ${item.description}` : ''
                ].filter(Boolean).join('\n');
                
                // Format date as M/D/YYYY for calendar compatibility
                const d = new Date(item.date + 'T00:00:00');
                const dateFormatted = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
                
                const startTime = formatTime12hr(item.startTime) || '9:00 AM';
                const endTime = formatTime12hr(item.endTime) || '5:00 PM';
                
                rows.push([
                    `${(schedule.specialties || []).join('/')} Onboarding: Day ${item.dayNumber} - ${item.title}`,
                    dateFormatted,
                    startTime,
                    dateFormatted,
                    endTime,
                    description,
                    'Onboarding'
                ]);
            });
            
            const csv = rows.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${schedule.employeeName.replace(/\s+/g, '_')}_onboarding_${schedule.startDate}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Firebase Storage Implementation
        class FirebaseStorageProvider extends StorageProvider {
            constructor(storage) {
                super();
                this.storage = storage;
            }
            
            async upload(file, path) {
                const { ref, uploadBytes } = window.firebaseModules;
                const storageRef = ref(this.storage, path);
                const snapshot = await uploadBytes(storageRef, file);
                return snapshot.ref.fullPath;
            }
            
            async getDownloadURL(path) {
                const { ref, getDownloadURL } = window.firebaseModules;
                const fileRef = ref(this.storage, path);
                return await getDownloadURL(fileRef);
            }
            
            async deleteFile(path) {
                const { ref, deleteObject } = window.firebaseModules;
                const fileRef = ref(this.storage, path);
                await deleteObject(fileRef);
            }
        }

        // Azure Blob Storage Implementation (for future migration)
        class AzureBlobStorageProvider extends StorageProvider {
            constructor(containerClient) {
                super();
                this.containerClient = containerClient;
            }
            
            async upload(file, path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                await blockBlobClient.uploadData(file);
                return blockBlobClient.url;
            }
            
            async getDownloadURL(path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                return blockBlobClient.url;
            }
            
            async deleteFile(path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                await blockBlobClient.delete();
            }
        }

        // Cloudflare R2 Storage Implementation (S3-compatible)
        class CloudflareR2Provider extends StorageProvider {
            constructor(config) {
                super();
                this.accountId = config.accountId;
                this.accessKeyId = config.accessKeyId;
                this.secretAccessKey = config.secretAccessKey;
                this.bucketName = config.bucketName;
                this.publicUrl = config.publicUrl; // e.g., https://pub-xxxxx.r2.dev
            }
            
            async upload(file, path) {
                try {
                    // R2 endpoint
                    const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                    
                    // Read file as ArrayBuffer
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Create AWS Signature V4
                    const date = new Date();
                    const dateString = date.toISOString().split('T')[0].replace(/-/g, '');
                    const region = 'auto'; // R2 uses 'auto' as region
                    
                    // Simple upload using presigned URL approach
                    // For production, you'd use AWS SDK, but this works for browser
                    const response = await fetch(endpoint, {
                        method: 'PUT',
                        body: arrayBuffer,
                        headers: {
                            'Content-Type': file.type,
                            'x-amz-acl': 'public-read'
                        },
                        // Note: This is a simplified version
                        // In production, use AWS SDK or proper signing
                    });
                    
                    if (!response.ok) {
                        // Fallback: Use presigned URL approach
                        return await this.uploadViaPresignedUrl(file, path);
                    }
                    
                    return path;
                } catch (error) {
                    console.error('R2 upload error:', error);
                    throw error;
                }
            }
            
            async uploadViaPresignedUrl(file, path) {
                // For browser upload, we'll use a simpler approach:
                // Convert to base64 and store in Firestore temporarily
                // Then use a Cloud Function to upload to R2
                // OR use direct XMLHttpRequest with proper CORS
                
                const formData = new FormData();
                formData.append('file', file);
                
                // This would typically call your backend endpoint
                // For now, we'll use a direct approach
                const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                
                const xhr = new XMLHttpRequest();
                return new Promise((resolve, reject) => {
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = (e.loaded / e.total) * 100;
                            console.log('Upload progress:', percentComplete);
                        }
                    });
                    
                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            resolve(path);
                        } else {
                            reject(new Error(`Upload failed: ${xhr.status}`));
                        }
                    });
                    
                    xhr.addEventListener('error', () => reject(new Error('Upload failed')));
                    
                    xhr.open('PUT', endpoint);
                    xhr.setRequestHeader('Content-Type', file.type);
                    xhr.send(file);
                });
            }
            
            async getDownloadURL(path) {
                // Return public URL
                return `${this.publicUrl}/${path}`;
            }
            
            async deleteFile(path) {
                const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                
                const response = await fetch(endpoint, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Delete failed');
                }
            }
        }

                        .map(d => ({ id: d.id, name: d.data().name, isActive: d.data().isActive }))
                        .filter(s => s.isActive !== false)
                        .sort((a, b) => a.name.localeCompare(b.name));
                    
                    // Journey specialties are stored as name strings (e.g. 'Nurse'), not IDs
                    const names = data.map(s => s.name);
                    const canonicalList = names.length > 0 ? names : [
                        'Nurse', 'MOA', 'Dietitian', 'Physician', 'Pharmacy', 'Lab Technician'
                    ];
                    setAvailableSpecialties(canonicalList);
                    
                    // Normalize existing stored specialty values:
                    // 1. Check explicit rename map first (handles semantic renames e.g. Pharmacist → Pharmacy)
                    // 2. Fall back to case-insensitive match (handles casing-only differences e.g. 'nurse' → 'Nurse')
                    // 3. Keep original if no match found (so nothing is silently lost)
                    const LEGACY_RENAME_MAP = {
                        'pharmacist': 'Pharmacy',
                        'dietician': 'Dietitian', // spelling correction between old and new
                    };
                    const storedSpecialties = formData.specialties || [];
                    if (storedSpecialties.length > 0) {
                        const normalized = storedSpecialties.map(stored => {
                            const lowerStored = (stored || '').toLowerCase();
                            if (LEGACY_RENAME_MAP[lowerStored]) return LEGACY_RENAME_MAP[lowerStored];
                            const match = canonicalList.find(c => c.toLowerCase() === lowerStored);
                            return match || stored;
                        });
                        if (normalized.some((v, i) => v !== storedSpecialties[i])) {
                            setFormData(prev => ({ ...prev, specialties: normalized }));
                        }
                    }
                } catch (error) {
                    console.error('Error loading specialties:', error);
                    setAvailableSpecialties([
                        'Nurse', 'MOA', 'Dietitian', 'Physician', 'Pharmacy', 'Lab Technician'
                    ]);
                }
            };
            
            const toggleSpecialty = (specialty) => {
                const currentSpecialties = formData.specialties || [];
                if (currentSpecialties.includes(specialty)) {
                    // Remove specialty

                        ...formData,
                        specialties: currentSpecialties.filter(s => s !== specialty)
                    });
                } else {
                    // Add specialty

                        ...formData,
                        specialties: [...currentSpecialties, specialty]
                    });

                            const reordered = [...steps];

                const stepsPromises = formData.stepIds.map(stepId => getDoc(doc(db, 'steps', stepId)));
                const stepsDocs = await Promise.all(stepsPromises);
                const stepsData = stepsDocs
                    .filter(doc => doc.exists())
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => a.order - b.order);
                
                setSteps(stepsData);
                setLoading(false);
            };
            
            const saveJourney = async (closeAfter = false) => {
    		if (saving) return; // Prevent double-save
    		setSaving(true);
    		
    		// Validation: At least one specialty must be selected
    		if (!formData.specialties || formData.specialties.length === 0) {
    		    showToast('Please select at least one specialty', 'error');
    		    setSaving(false);
    		    return;
    		}
    		
    		const { doc, setDoc, updateDoc, serverTimestamp } = window.firebaseModules;
    
    		try {
        		const journeyData = {
            		specialties: formData.specialties,  // Save as array
            		title: formData.title,
            		description: formData.description,
            		status: formData.status,
            		category: formData.category || 'other',  // Save category
            		stepIds: steps.map(s => s.id),
            		attachments: attachments,
            		lastModified: serverTimestamp()
        	};
        
        	if (!formData.id) {
            		// New journey
            		const newId = 'journey_' + Date.now();
            		journeyData.createdAt = serverTimestamp();
            		await setDoc(doc(db, 'journeys', newId), journeyData);
        	} else {
            		// Update existing journey
            		await updateDoc(doc(db, 'journeys', formData.id), journeyData);
        	}
        
        	// Update step orders
        	for (const step of steps) {
            		if (step.id) {  // Only update existing steps
                		await updateDoc(doc(db, 'steps', step.id), { order: step.order });
            		}
        	}
        
        	showToast('Journey saved successfully!');
        	setSaving(false); // Reset saving state
        	
        	if (closeAfter) {
        	    onClose();
        	}
        
   		} catch (error) {
        		console.error('Error saving journey:', error);
        		showToast('Error saving journey: ' + error.message, 'error');
        		setSaving(false);
    		}
		};
            
            const createNewStep = () => {
                setEditingStep({
                    id: null,
                    title: '',
                    phase: '',
                    icon: '📌',
                    color: 'from-blue-500 to-indigo-600',
                    outcome: '',
                    nextAction: '',
                    order: steps.length + 1,
                    taskIds: []
                });
            };
            
            const addStepToJourney = (step) => {
                // Check if step already exists (editing) or is new
                const existingIndex = steps.findIndex(s => s.id === step.id);
                
                if (existingIndex >= 0) {
                    // Update existing step
                    const updatedSteps = [...steps];
                    updatedSteps[existingIndex] = step;
                    setSteps(updatedSteps);
                } else {
                    // Add new step
                    setSteps([...steps, step]);
                }
                
                setEditingStep(null);
            };
            
            const deleteStep = async (stepId) => {
                if (!confirm('Delete this step?')) return;
                setSteps(steps.filter(s => s.id !== stepId));
            };
            
            const addAttachment = () => {
                if (!newAttachment.name.trim() || !newAttachment.url.trim()) {
                    showToast('Please enter both name and URL', 'error');
                    return;
                }
                
                // Basic URL validation
                try {
                    new URL(newAttachment.url);
                } catch (e) {
                    showToast('Please enter a valid URL (must start with http:// or https://)', 'error');
                    return;
                }
                
                setAttachments([...attachments, {
                    name: newAttachment.name.trim(),
                    url: newAttachment.url.trim(),
                    addedAt: new Date().toISOString()
                }]);
                
                showToast('Link added successfully!');
                setNewAttachment({ name: '', url: '' });
            };
            
            const deleteAttachment = (index) => {
                if (!confirm('Remove this link?')) return;
                const newAttachments = attachments.filter((_, i) => i !== index);
                setAttachments(newAttachments);
            };
            
            if (editingStep) {
                return <StepEditor step={editingStep} onSave={addStepToJourney} onClose={() => setEditingStep(null)} showToast={showToast} />;
            }
            
            if (loading) {
                return (
                    <div className="p-8 max-w-5xl mx-auto">
                        <div className="flex items-center justify-center min-h-[400px]">
                            <div className="text-center">
                                <div className="text-6xl mb-4">⏳</div>
                                <div className="text-xl font-semibold text-gray-600">Loading journey...</div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Screen Recording Functions
            const formatDuration = (seconds) => {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };
            
            const startScreenRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen", width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: { echoCancellation: true }
                    });
                    
                    let options = { mimeType: 'video/webm;codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm';
                    
                    const recorder = new MediaRecorder(stream, options);
                    const chunks = [];
                    
                    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        if (recordingIntervalRef.current) clearInterval(recordingIntervalRef.current);
                        setRecordedChunks(chunks);
                        setShowRecordingModal(true);
                        setIsRecording(false);
                        await uploadRecording(new Blob(chunks, { type: 'video/webm' }));
                    };
                    
                    stream.getVideoTracks()[0].onended = () => { if (recorder.state === 'recording') recorder.stop(); };
                    
                    recorder.start(1000);
                    setMediaRecorder(recorder);
                    setIsRecording(true);
                    setRecordingStartTime(Date.now());
                    showToast('🎥 Recording started!');
                    
                    recordingIntervalRef.current = setInterval(() => {
                        setRecordingDuration((Date.now() - recordingStartTime) / 1000);
                    }, 1000);
                } catch (err) {
                    showToast(err.name === 'NotAllowedError' ? 'Permission denied' : 'Error: ' + err.message, 'error');
                }
            };
            
            const stopScreenRecording = () => {
                if (mediaRecorder?.state === 'recording') {
                    mediaRecorder.stop();
                    showToast('⏹️ Stopping...');
                }
            };
            
            const uploadRecording = async (blob) => {
                try {
                    setUploadProgress(0);
                    const filename = `recordings/${formData.id || 'new'}_${Date.now()}.webm`;
                    const file = new File([blob], filename, { type: 'video/webm' });
                    
                    console.log('Starting upload...', {
                        filename,
                        fileSize: blob.size,
                        storageInitialized: !!storage
                    });
                    
                    showToast('📤 Uploading...');
                    
                    const int = setInterval(() => setUploadProgress(p => Math.min(p + 10, 90)), 200);
                    
                    try {
                        console.log('Calling storageProvider.upload...');
                        const path = await storageProvider.upload(file, filename);
                        console.log('Upload complete, path:', path);
                        
                        console.log('Getting download URL...');
                        const url = await storageProvider.getDownloadURL(path);
                        console.log('Download URL:', url);
                        
                        clearInterval(int);
                        setUploadProgress(100);
                        setUploadedVideoURL(url);
                        showToast('✅ Uploaded!');
                        return url;
                    } catch (uploadError) {
                        clearInterval(int);
                        console.error('Upload/URL error:', uploadError);
                        throw uploadError;
                    }
                } catch (err) {
                    console.error('Upload failed:', err);
                    console.error('Error details:', {
                        name: err.name,
                        message: err.message,
                        code: err.code,
                        stack: err.stack
                    });
                    showToast('Upload failed: ' + err.message, 'error');
                    setUploadProgress(0);
                }
            };
            
            return (

                                Cancel

                            <button

                                className={`px-4 py-2 rounded-lg font-semibold transition ${
                                    saving

                                        : 'bg-blue-500 text-white hover:bg-blue-600'

                            >

                                className={`px-4 py-2 rounded-lg font-semibold transition ${

                                }`}
                            >
                                {saving ? '⏳' : '✓'} Save & Close

                        </div>
                    </div>
                    
                    {/* Journey Details Form */}

                                <label className="block text-sm font-semibold text-gray-700 mb-2">Title</label>
                                <input
                                    type="text"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none"
                                    placeholder="e.g., Nurse Workflow - Patient Journey"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Description</label>
                                <textarea
                                    value={formData.description}

                                    rows="3"

                                />

                                    Category

                                </label>
                                <select
                                    value={formData.category || 'other'}
                                    onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                                    className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none bg-white"
                                >
                                    <option value="clinical_apps">📱 Clinical Apps - Demos & Workflows</option>
                                    <option value="processes">📋 Processes & Procedures</option>
                                    <option value="onboarding">🎓 Onboarding</option>
                                    <option value="other">📌 Other</option>
                                </select>

                            {/* Link Attachments Section */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">

                                    <span className="text-xs text-gray-500 font-normal ml-2">(Google Drive, SharePoint, etc.)</span>
                                </label>
                                
                                {/* Add Link Form */}
                                <div className="border-2 border-gray-300 rounded-lg p-4 bg-gray-50 mb-3">
                                    <div className="grid md:grid-cols-2 gap-3 mb-3">
                                        <input
                                            type="text"
                                            value={newAttachment.name}
                                            onChange={(e) => setNewAttachment({...newAttachment, name: e.target.value})}
                                            className="px-3 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            placeholder="Link name (e.g., 'Nurse Policy 2024')"
                                        />
                                        <input
                                            type="url"
                                            value={newAttachment.url}
                                            onChange={(e) => setNewAttachment({...newAttachment, url: e.target.value})}
                                            className="px-3 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none"
                                            placeholder="URL (e.g., https://drive.google.com/...)"
                                        />
                                    </div>
                                    <button
                                        type="button"
                                        onClick={addAttachment}
                                        className="w-full px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition flex items-center justify-center gap-2"
                                    >
                                        <Icons.Plus className="w-4 h-4" />
                                        Add Link
                                    </button>
                                </div>
                                
                                {/* Display added links */}
                                {attachments.length > 0 && (
                                    <div className="space-y-2">
                                        {attachments.map((link, index) => (
                                            <div key={index} className="flex items-center justify-between bg-blue-50 p-3 rounded-lg border border-blue-200">
                                                <div className="flex items-center gap-3 flex-1 min-w-0">
                                                    <div className="text-2xl">🔗</div>
                                                    <div className="flex-1 min-w-0">
                                                        <a
                                                            href={link.url}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="text-sm font-medium text-blue-600 hover:underline block truncate"
                                                        >
                                                            {link.name}
                                                        </a>
                                                        <div className="text-xs text-gray-500 truncate">
                                                            {link.url}
                                                        </div>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => deleteAttachment(index)}
                                                    className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition flex-shrink-0"
                                                    title="Remove link"
                                                >
                                                    <Icons.Trash className="w-4 h-4" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {attachments.length === 0 && (
                                    <div className="text-center py-4 text-gray-400 text-sm">
                                        No links added yet. Add links to policies, SOPs, or reference documents.
                                    </div>
                                )}
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                                        Assign to Specialties
                                        <span className="text-xs text-gray-500 font-normal ml-2">(Select one or more)</span>
                                    </label>
                                    <div className="border-2 border-gray-200 rounded-lg p-4 bg-gray-50 max-h-60 overflow-y-auto">
                                        {availableSpecialties.length === 0 ? (
                                            <div className="text-gray-400 text-sm">Loading specialties...</div>
                                        ) : (
                                            <div className="space-y-2">
                                                {availableSpecialties.map((specialty) => {
                                                    // Handle both string format (fallback) and object format {id, name}
                                                    const specialtyId = typeof specialty === 'string' ? specialty : specialty.id;
                                                    const specialtyName = typeof specialty === 'string' 
                                                        ? (specialty.charAt(0).toUpperCase() + specialty.slice(1))
                                                        : specialty.name;
                                                    
                                                    return (
                                                        <label
                                                            key={specialtyId}
                                                            className="flex items-center gap-3 p-2 hover:bg-blue-50 rounded-lg cursor-pointer transition"
                                                        >

                                    {formData.specialties?.length > 0 && (

                                <div>

                                <Icons.Plus className="w-4 h-4" />
                                Add Step
                            </button>
                        </div>
                        
                        <div ref={stepsListRef} className="space-y-3">
                            {steps.map((step, index) => (
                                <div

                                        {index + 1}

                                    <div className="flex-1">

                                    <div className="flex gap-2">

                        {steps.length === 0 && (

                    {/* Save Buttons */}

                            }`}
                        >
                            {saving ? '⏳ Saving...' : '💾 Save'}
                        </button>
                        <button
                            onClick={() => saveJourney(true)}
                            disabled={saving}
                            className={`flex-1 py-4 rounded-xl font-bold transition ${
                                saving 
                                    ? 'bg-gray-400 text-gray-200 cursor-not-allowed'
                                    : 'bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:from-green-600 hover:to-emerald-700'
                            }`}
                        >
                            {saving ? '⏳ Saving...' : '✓ Save & Close'}
                        </button>
                    </div>
                    
                    {/* Recording Modal */}
                    {showRecordingModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-8">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">
                                    🎥 Recording Complete ({formatDuration(recordingDuration)})
                                </h2>
                                
                                <div className="bg-gradient-to-r from-green-50 to-blue-50 rounded-xl p-6 mb-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-center">

                                                {recordedChunks.length > 0 ? Math.round(recordedChunks.reduce((s, c) => s + c.size, 0) / 1024 / 1024) : 0}MB
                                            </div>

                                    {uploadProgress > 0 && uploadProgress < 100 && (

                                {uploadProgress === 100 && uploadedVideoURL ? (

        // ============================================
        // STEP EDITOR (with drag-drop tasks)
        // ============================================
        function StepEditor({ step, onSave, onClose, showToast }) {
            const [formData, setFormData] = useState(step);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const tasksListRef = useRef(null);
            
            useEffect(() => {
                loadTasks();
            }, []);
            
            useEffect(() => {
                if (tasksListRef.current && tasks.length > 0) {
                    const sortable = Sortable.create(tasksListRef.current, {
                        animation: 150,
                        handle: '.drag-handle',
                        onEnd: (evt) => {
                            const reordered = [...tasks];
                            const [removed] = reordered.splice(evt.oldIndex, 1);
                            reordered.splice(evt.newIndex, 0, removed);
                            reordered.forEach((task, index) => {
                                task.order = index + 1;
                            });
                            setTasks(reordered);
                        }
                    });
                    return () => sortable.destroy();
                }
            }, [tasks]);
            
            const loadTasks = async () => {
                if (!formData.taskIds || formData.taskIds.length === 0) {
                    setLoading(false);
                    return;
                }
                
                const { doc, getDoc } = window.firebaseModules;
                const tasksPromises = formData.taskIds.map(taskId => getDoc(doc(db, 'tasks', taskId)));
                const tasksDocs = await Promise.all(tasksPromises);
                const tasksData = tasksDocs
                    .filter(doc => doc.exists())
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => a.order - b.order);
                
                setTasks(tasksData);
                setLoading(false);
            };
            
            const saveStep = async (closeAfter = false) => {
    		if (saving) return; // Prevent double-save
    		setSaving(true);
    		
    		const { doc, setDoc, updateDoc } = window.firebaseModules;
    
    		try {
        		// Save tasks first
        		for (const task of tasks) {
           		 const taskData = {
                	action: task.action,
                	accuroNavigation: task.accuroNavigation,
                	estimatedTime: task.estimatedTime,
                	// Handle both old single URL and new multiple URLs
                	screenshotUrls: task.screenshotUrls || (task.screenshotUrl ? [task.screenshotUrl] : []),
                	order: task.order
            	};
            
            	if (!task.id) {
                	// New task
                	const newTaskId = 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                	taskData.id = newTaskId;
                	await setDoc(doc(db, 'tasks', newTaskId), taskData);
                	task.id = newTaskId;
            	} else {
                	// Update existing task
                	await updateDoc(doc(db, 'tasks', task.id), taskData);
            	}
           }
        
        	// Save step
        	const stepData = {
            	title: formData.title,
            	phase: formData.phase,
            	icon: formData.icon,
            	color: formData.color,
            	outcome: formData.outcome,
            	nextAction: formData.nextAction,
            	order: formData.order,
            	taskIds: tasks.map(t => t.id)
          };
        
        if (!formData.id) {
            // New step
            const newStepId = 'step_' + Date.now();
            stepData.id = newStepId;
            await setDoc(doc(db, 'steps', newStepId), stepData);
            formData.id = newStepId;
        } else {
            // Update existing step
            await updateDoc(doc(db, 'steps', formData.id), stepData);
        }
        
        showToast('Step saved successfully!');
        setSaving(false); // Reset saving state
        
        if (closeAfter) {
            onSave({ ...formData, ...stepData, tasks: tasks });
        }
        
    	} catch (error) {
        	console.error('Error saving step:', error);
        	showToast('Error saving step: ' + error.message, 'error');
        	setSaving(false);
    	}
	};
            
            const addTask = () => {
                setTasks([...tasks, {
                    id: null,
                    tempId: 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9), // Temporary ID for drag-drop
                    action: '',
                    accuroNavigation: '',
                    estimatedTime: '',
                    order: tasks.length + 1
                }]);
            };
            
            const updateTask = (index, field, value) => {
                const updated = [...tasks];
                updated[index][field] = value;
                setTasks(updated);
            };
            
            const deleteTask = (index) => {
                setTasks(tasks.filter((_, i) => i !== index));
            };
            
            return (
                <div className="p-8 max-w-5xl mx-auto">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">

                            <button

                                    saving

                                        : 'bg-green-500 text-white hover:bg-green-600'
                                }`}
                            >
                                {saving ? '⏳' : '✓'} Save & Close
                            </button>
                        </div>
                    </div>
                    
                    {/* Step Details */}
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">Step Details</h2>
                        
                        <div className="grid gap-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Title</label>
                                <input
                                    type="text"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none"
                                    placeholder="e.g., Patient Check-In Process"
                                />
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Phase</label>
                                    <input
                                        type="text"
                                        value={formData.phase}
                                        onChange={(e) => setFormData({ ...formData, phase: e.target.value })}

                                        placeholder="e.g., Patient Arrival"

                                </div>
                                
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Icon (Emoji)</label>
                                    <input
                                        type="text"
                                        value={formData.icon}

                                        placeholder="e.g., 🏥"
                                        maxLength="2"

                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Color (Tailwind Gradient)</label>

                                    type="text"
                                    value={formData.color}

                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Expected Outcome</label>
                                    <input

                                <div>

                                        placeholder="What comes next"
                                    />
                                </div>

                    </div>
                    
                    {/* Tasks Section */}
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">Tasks ({tasks.length})</h2>

                        <div ref={tasksListRef} className="space-y-4">

                                    <div className="flex-1 space-y-3">

                                        {/* Media URLs (Screenshots & Videos) */}
                                        <div className="border-2 border-gray-300 rounded-lg p-3">

                                                return screenshots.map((url, urlIndex) => {
                                                    // Detect media type
                                                    const isVideo = url && (

        function UserManagement({ showToast }) {
            const [users, setUsers] = useState([]);
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editingUser, setEditingUser] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newUser, setNewUser] = useState({
                email: '',
                password: '',
                displayName: '',
                specialty: 'moa',
                role: 'student'
            });
            
            useEffect(() => {
                loadUsers(); // This will also load specialties
            }, []);
            
            const loadSpecialties = async () => {
                const { collection, getDocs } = window.firebaseModules;
                try {
                    const snapshot = await getDocs(collection(db, 'specialties'));
                    const data = snapshot.docs
                        .map(d => ({ id: d.id, name: d.data().name, isActive: d.data().isActive }))
                        .filter(s => s.isActive !== false)
                        .sort((a, b) => a.name.localeCompare(b.name));
                    
                    if (data.length > 0) {
                        setSpecialties(data);
                    } else {
                        // Fallback if specialties collection is empty
                        setSpecialties([
                            { id: 'nurse', name: 'Nurse' },
                            { id: 'moa', name: 'Medical Office Assistant' },
                            { id: 'dietician', name: 'Dietician' },
                            { id: 'physician', name: 'Physician' },
                            { id: 'pharmacist', name: 'Pharmacist' },
                            { id: 'lab_tech', name: 'Lab Technician' }
                        ]);
                    }
                } catch (error) {
                    console.error('Error loading specialties:', error);
                }
            };

                                            className="w-full px-4 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none"

        // ============================================

        // ============================================
        // ============================================
        // QUESTION BANK (Quiz Games question management)
        // ============================================
        const SAMPLE_SEED_QUESTIONS = [
            {
                question: "What are the TWO pieces of ID required for patient check-in?",
                options: ["Health card + Driver's license", "Health card + Birth certificate", "Passport + Health card", "Any two government IDs"],
                correctAnswer: 0,
                category: 'Patient Intake'
            },
            {
                question: "What is the first step when a patient arrives?",
                options: ["Take vital signs", "Verify identity", "Collect payment", "Update medical history"],
                correctAnswer: 1,
                category: 'Patient Intake'
            },
            {
                question: "Where do you find patient appointment history in Accuro?",
                options: ["Dashboard → History", "Patient Chart → Encounters", "Reports → Appointments", "Tools → Search"],
                correctAnswer: 1,
                category: 'EMR Navigation'
            },
            {
                question: "What should you do if a patient forgets their health card?",
                options: ["Refuse service", "Ask for alternate ID and make a note", "Bill them directly", "Call their doctor"],
                correctAnswer: 1,
                category: 'Patient Intake'
            },
            {
                question: "How do you book a follow-up appointment in Accuro?",
                options: ["File → New Appointment", "Right-click patient → Book", "Calendar → Add Appointment", "Schedule → New"],
                correctAnswer: 2,
                category: 'EMR Navigation'
            }
        ];
        
        function QuestionBank({ showToast }) {
            const [questions, setQuestions] = useState([]);
            const [journeys, setJourneys] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [showGenerateModal, setShowGenerateModal] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('all');
            
            useEffect(() => {
                loadAll();
            }, []);
            
            const loadAll = async () => {
                setLoading(true);
                await Promise.all([loadQuestions(), loadJourneys()]);
                setLoading(false);
            };
            
            const loadQuestions = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'quiz_questions'));
                    setQuestions(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch (err) {
                    console.error('Error loading questions:', err);
                    setQuestions([]);
                }
            };
            
            const loadJourneys = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'journeys'));
                    setJourneys(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch (err) {
                    console.error('Error loading journeys:', err);
                    setJourneys([]);
                }
            };
            
            const createNewQuestion = () => {
                setEditingQuestion({
                    id: null,
                    question: '',
                    options: ['', '', '', ''],
                    correctAnswer: 0,
                    category: '',
                    isActive: true
                });
            };
            
            const saveQuestion = async (data) => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = data.id || `question_${Date.now()}`;
                    const toSave = { ...data };
                    delete toSave.id;
                    toSave.updatedAt = serverTimestamp();
                    if (!data.id) toSave.createdAt = serverTimestamp();
                    await setDoc(doc(db, 'quiz_questions', id), toSave, { merge: true });
                    showToast(data.id ? '✅ Question updated!' : '✅ Question added!');
                    setEditingQuestion(null);
                    loadQuestions();
                } catch (err) {
                    console.error('Error saving question:', err);
                    showToast('Failed to save question: ' + err.message, 'error');
                }
            };
            
            const deleteQuestion = async (id) => {
                if (!confirm('Delete this question? This cannot be undone.')) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'quiz_questions', id));
                    showToast('🗑️ Question deleted');
                    loadQuestions();
                } catch (err) {
                    console.error('Error deleting question:', err);
                    showToast('Failed to delete question', 'error');
                }
            };
            
            const seedSampleQuestions = async () => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    for (const q of SAMPLE_SEED_QUESTIONS) {
                        const id = `question_seed_${q.question.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 40)}`;
                        await setDoc(doc(db, 'quiz_questions', id), {
                            ...q,
                            isActive: true,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    }
                    showToast(`✅ Seeded ${SAMPLE_SEED_QUESTIONS.length} sample questions!`);
                    loadQuestions();
                } catch (err) {
                    console.error('Error seeding questions:', err);
                    showToast('Failed to seed questions: ' + err.message, 'error');
                }
            };
            
            const categories = ['all', ...new Set(questions.map(q => q.category).filter(Boolean))];
            
            const filteredQuestions = questions.filter(q => {
                if (filterCategory !== 'all' && q.category !== filterCategory) return false;
                if (searchQuery.trim() && !q.question.toLowerCase().includes(searchQuery.trim().toLowerCase())) return false;
                return true;
            });
            
            if (loading) {
                return (
                    <div className="p-8 flex items-center justify-center min-h-screen">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading question bank...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div>
                    <div className="flex justify-between items-center mb-6 flex-wrap gap-3">
                        <div>
                            <h2 className="text-xl font-bold text-gray-800">📝 Question Bank</h2>
                            <p className="text-gray-500 text-sm mt-1">{questions.length} question{questions.length !== 1 ? 's' : ''} available for quiz games</p>
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={() => setShowGenerateModal(true)}
                                className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition text-sm font-medium"
                            >
                                <Icons.RefreshCw className="w-4 h-4" />
                                Generate from Journey
                            </button>
                            <button
                                onClick={createNewQuestion}
                                className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white rounded-lg hover:from-purple-600 hover:to-pink-700 transition text-sm font-semibold"
                            >
                                <Icons.Plus className="w-4 h-4" />
                                Add Question
                            </button>
                        </div>
                    </div>
                    
                    {questions.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                            <div className="text-5xl mb-4">📝</div>
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">No questions yet</h3>
                            <p className="text-gray-500 mb-4">Start with sample questions, generate from a journey, or write your own</p>
                            <div className="flex gap-3 justify-center">
                                <button
                                    onClick={seedSampleQuestions}
                                    className="px-5 py-2.5 bg-white border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium"
                                >
                                    Seed {SAMPLE_SEED_QUESTIONS.length} Sample Questions
                                </button>
                                <button
                                    onClick={createNewQuestion}
                                    className="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold"
                                >
                                    Add Question
                                </button>
                            </div>
                        </div>
                    ) : (
                        <>
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4 flex flex-wrap gap-3">
