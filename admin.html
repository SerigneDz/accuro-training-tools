        // ============================================
        // STAFF PROGRESS TAB (Manager View)
        // ============================================
        function StaffProgressTab({ courses, users, assignments, progress, specialtyOptions, showToast, onRefresh }) {
            const [searchStaff, setSearchStaff] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [visibleCount, setVisibleCount] = useState(20);
            
            // Build the effective "required course" list per user
            const getRequiredCoursesForUser = (user) => {
                // Support both the new specialties array and the legacy single specialty/position string
                const userSpecialties = (user.specialties && user.specialties.length > 0)
                    ? user.specialties
                    : [user.specialty || user.position].filter(Boolean);
                const userSpecialtiesLower = userSpecialties.map(s => s.toLowerCase());
                
                const byPosition = assignments.filter(a => 
                    a.assignType === 'position' && 
                    (a.specialties || []).some(s => userSpecialtiesLower.includes(s.toLowerCase()))
                );
                const byIndividual = assignments.filter(a => a.assignType === 'individual' && a.userId === user.id);
                const combined = [...byPosition, ...byIndividual];
                // Dedupe by courseId
                const seen = new Set();
                return combined.filter(a => {
                    if (seen.has(a.courseId)) return false;
                    seen.add(a.courseId);
                    return true;
                });
            };
            
            const getProgressRecord = (userId, courseId) => {
                return progress.find(p => p.userId === userId && p.courseId === courseId);
            };
            
            // Build summary stats
            const studentUsers = users.filter(u => u.role !== 'trainer');
            
            const allRows = [];
            studentUsers.forEach(user => {
                const required = getRequiredCoursesForUser(user);
                required.forEach(assignment => {
                    const course = courses.find(c => c.id === assignment.courseId);
                    if (!course) return;
                    const progressRecord = getProgressRecord(user.id, assignment.courseId);
                    const status = getEducationStatus(course, progressRecord);
                    allRows.push({ user, course, assignment, progressRecord, status });
                });
            });
            
            const filteredRows = allRows.filter(row => {
                if (searchStaff.trim()) {
                    const name = (row.user.displayName || row.user.email || '').toLowerCase();
                    if (!name.includes(searchStaff.trim().toLowerCase())) return false;
                }
                if (filterStatus !== 'all' && row.status !== filterStatus) return false;
                return true;
            });
            
            const visibleRows = filteredRows.slice(0, visibleCount);
            
            const summary = {
                total: allRows.length,
                completed: allRows.filter(r => r.status === 'completed').length,
                inProgress: allRows.filter(r => r.status === 'in_progress').length,
                overdue: allRows.filter(r => r.status === 'overdue').length,
                notStarted: allRows.filter(r => r.status === 'not_started').length
            };
            
            const updateProgressStatus = async (userId, userName, courseId, courseName, newStatus) => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = `${userId}_${courseId}`;
                    const data = {
                        userId, userName, courseId, courseName,
                        status: newStatus,
                        updatedAt: serverTimestamp()
                    };
                    if (newStatus === 'completed') {
                        const now = new Date();
                        data.completedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                    }
                    await setDoc(doc(db, 'education_progress', id), data, { merge: true });
                    showToast('✅ Progress updated!');
                    onRefresh();
                } catch (err) {
                    console.error('Error updating progress:', err);
                    showToast('Failed to update progress', 'error');
                }
            };
            
            if (allRows.length === 0) {
                return (
                    <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                        <div className="text-5xl mb-4">📊</div>
                        <h3 className="text-lg font-semibold text-gray-700 mb-2">No required courses assigned yet</h3>
                        <p className="text-gray-500">Go to "Required Courses" to assign courses to positions or staff members</p>
                    </div>
                );
            }
            
            return (
                <div>
                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-gray-800">{summary.total}</div>
                            <div className="text-sm text-gray-500">Total Required</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-green-600">{summary.completed}</div>
                            <div className="text-sm text-gray-500">Completed</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-yellow-600">{summary.inProgress}</div>
                            <div className="text-sm text-gray-500">In Progress</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-gray-400">{summary.notStarted}</div>
                            <div className="text-sm text-gray-500">Not Started</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-red-600">{summary.overdue}</div>
                            <div className="text-sm text-gray-500">Overdue</div>
                        </div>
                    </div>
                    
                    {/* Filters */}
                    <div className="flex gap-3 mb-4 flex-wrap">
                        <input
                            type="text"
                            value={searchStaff}
                            onChange={e => { setSearchStaff(e.target.value); setVisibleCount(20); }}
                            placeholder="Search staff by name..."
                            className="flex-1 min-w-[220px] px-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        />
                        
                        <div className="flex gap-2">
                            {['all', 'completed', 'in_progress', 'not_started', 'overdue'].map(s => (
                                <button
                                    key={s}
                                    onClick={() => { setFilterStatus(s); setVisibleCount(20); }}
                                    className={`px-3 py-2 rounded-lg text-sm font-medium transition ${
                                        filterStatus === s ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'
                                    }`}
                                >
                                    {s === 'all' ? 'All' : EDUCATION_STATUS[s].label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* Table */}
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Staff Member</th>
                                    <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Course</th>
                                    <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Completed</th>
                                    <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Status</th>
                                    <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {visibleRows.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="px-4 py-8 text-center text-sm text-gray-400">No matches found</td>
                                    </tr>
                                ) : (
                                    visibleRows.map((row, i) => {
                                    const statusInfo = EDUCATION_STATUS[row.status];
                                    return (
                                        <tr key={i} className="border-b border-gray-50 hover:bg-gray-50">
                                            <td className="px-4 py-3">
                                                <div className="font-medium text-gray-800">{row.user.displayName || row.user.email}</div>
                                                <div className="text-xs text-gray-400">{(row.user.specialties || []).join(', ') || row.user.specialty || row.user.position || ''}</div>
                                            </td>
                                            <td className="px-4 py-3 text-sm text-gray-600">
                                                <div className="flex items-center gap-1">
                                                    {row.assignment.recurringAnnual && <Icons.RefreshCw className="w-3 h-3 text-purple-500" />}
                                                    {row.course.title}
                                                </div>
                                            </td>
                                            <td className="px-4 py-3 text-sm text-gray-500">
                                                {row.progressRecord?.completedDate || '—'}
                                            </td>
                                            <td className="px-4 py-3">
                                                <span className={`text-xs px-2 py-1 rounded-full font-medium ${statusInfo.color}`}>
                                                    {statusInfo.icon} {statusInfo.label}
                                                </span>
                                            </td>
                                            <td className="px-4 py-3">
                                                <select
                                                    value={row.progressRecord?.status || 'not_started'}
                                                    onChange={e => updateProgressStatus(row.user.id, row.user.displayName || row.user.email, row.course.id, row.course.title, e.target.value)}
                                                    className="px-2 py-1 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                >
                                                    <option value="not_started">Not Started</option>
                                                    <option value="in_progress">In Progress</option>
                                                    <option value="completed">Completed</option>
                                                </select>
                                            </td>
                                        </tr>
                                    );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                    
                    {filteredRows.length > visibleCount && (
                        <div className="text-center mt-4">
                            <button
                                onClick={() => setVisibleCount(c => c + 20)}
                                className="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition text-sm font-medium"
                            >
                                Load more ({filteredRows.length - visibleCount} remaining)
                            </button>
                        </div>
                    )}
                    
                    <p className="text-xs text-gray-400 text-center mt-3">
                        Showing {visibleRows.length} of {filteredRows.length} record{filteredRows.length !== 1 ? 's' : ''}
                        {filteredRows.length !== allRows.length ? ` (filtered from ${allRows.length} total)` : ''}
                    </p>
                </div>
            );
        }
        
        // ============================================
        // CALENDAR TEMPLATES - HEALTHCARE ONBOARDING
        // ============================================
        function CalendarTemplates({ showToast }) {
            const [view, setView] = useState('templates'); // templates, schedules
            const [templates, setTemplates] = useState([]);
            const [schedules, setSchedules] = useState([]);
            const [journeys, setJourneys] = useState([]);
            const [specialtyOptions, setSpecialtyOptions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filterPosition, setFilterPosition] = useState('all');
            const [editingTemplate, setEditingTemplate] = useState(null); // null = no modal, object = editing/creating
            const [assigningTemplate, setAssigningTemplate] = useState(null); // template to assign
            const [viewingSchedule, setViewingSchedule] = useState(null);
            
            useEffect(() => {
                loadAll();
            }, []);
            
            const loadAll = async () => {
                setLoading(true);
                try {
                    await Promise.all([loadTemplates(), loadSchedules(), loadJourneys(), loadSpecialtyOptions()]);
                } catch (err) {
                    console.error('Error loading calendar templates data:', err);
                    showToast('Error loading data: ' + err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };
            
            const loadSpecialtyOptions = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'specialties'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const activeNames = data.filter(s => s.isActive !== false).map(s => s.name).sort();
                    setSpecialtyOptions(activeNames.length > 0 ? activeNames : HEALTHCARE_POSITIONS.map(p => p.value));
                } catch (err) {
                    console.error('Error loading specialties:', err);
                    setSpecialtyOptions(HEALTHCARE_POSITIONS.map(p => p.value));
                }
            };
            
            const loadTemplates = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'healthcare_templates'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setTemplates(data);
                } catch (err) {
                    console.error('Error loading templates:', err);
                    setTemplates([]);
                }
            };
            
            const loadSchedules = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'healthcare_schedules'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setSchedules(data);
                } catch (err) {
                    console.error('Error loading schedules:', err);
                    setSchedules([]);
                }
            };
            
            const loadJourneys = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'journeys'));
                    const allJourneys = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Filter for published journeys (case-insensitive)
                    const published = allJourneys.filter(j => 
                        j.status && j.status.toLowerCase() === 'published'
                    );
                    console.log(`Journeys: ${allJourneys.length} total, ${published.length} published`);
                    setJourneys(published);
                } catch (err) {
                    console.error('Error loading journeys:', err);
                    setJourneys([]);
                }
            };
            
            const createNewTemplate = () => {
                setEditingTemplate({
                    id: null,
                    name: '',
                    specialties: [],
                    durationDays: 5,
                    includeWeekends: false,
                    description: '',
                    items: [
                        { dayNumber: 1, title: '', description: '', startTime: '09:00', endTime: '17:00', journeyIds: [], tasks: [] }
                    ],
                    isActive: true
                });
            };
            
            const saveTemplate = async (templateData) => {
                const { collection, doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = templateData.id || `template_${Date.now()}`;
                    const dataToSave = {
                        ...templateData,
                        id: undefined,
                        durationDays: templateData.items.length,
                        updatedAt: serverTimestamp(),
                        ...(templateData.id ? {} : { createdAt: serverTimestamp() })
                    };
                    delete dataToSave.id;
                    
                    await setDoc(doc(db, 'healthcare_templates', id), dataToSave, { merge: true });
                    showToast(templateData.id ? '✅ Template updated!' : '✅ Template created!');
                    setEditingTemplate(null);
                    loadTemplates();
                } catch (err) {
                    console.error('Error saving template:', err);
                    showToast('Failed to save template', 'error');
                }
            };
            
            const deleteTemplate = async (templateId) => {
                if (!confirm('Delete this template? This cannot be undone.')) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'healthcare_templates', templateId));
                    showToast('🗑️ Template deleted');
                    loadTemplates();
                } catch (err) {
                    console.error('Error deleting template:', err);
                    showToast('Failed to delete template', 'error');
                }
            };
            
            const duplicateTemplate = async (template) => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const newId = `template_${Date.now()}`;
                    const { id, ...rest } = template;
                    await setDoc(doc(db, 'healthcare_templates', newId), {
                        ...rest,
                        name: `${template.name} (Copy)`,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });

                    console.error('Error duplicating template:', err);
                    showToast('Failed to duplicate template', 'error');
                }

                ? templates 
                : templates.filter(t => (t.specialties || []).includes(filterPosition));

                    <div className="p-8 flex items-center justify-center min-h-screen">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading calendar templates...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-800">📅 Calendar Templates</h1>
                            <p className="text-gray-500 mt-1">Onboarding schedule templates & assignments</p>
                        </div>
                        <button
                            onClick={createNewTemplate}
                            className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700 transition font-semibold"
                        >
                            <Icons.Plus className="w-5 h-5" />
                            Create New Template
                        </button>
                    </div>
                    
                    {/* Tab Switcher */}
                    <div className="flex gap-2 mb-6 border-b border-gray-200">
                        <button
                            onClick={() => setView('templates')}
                            className={`px-6 py-3 font-semibold transition border-b-2 ${
                                view === 'templates' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'
                            }`}
                        >
                            Templates ({templates.length})
                        </button>
                        <button
                            onClick={() => setView('schedules')}
                            className={`px-6 py-3 font-semibold transition border-b-2 ${
                                view === 'schedules' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'

        // ============================================

        function Analytics() {
            const [analytics, setAnalytics] = useState(null);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                loadAnalytics();
            }, []);
            
            const loadAnalytics = async () => {
                const { collection, getDocs, query, where } = window.firebaseModules;
                
                try {
                    // Load all progress records
                    const progressSnapshot = await getDocs(collection(db, 'userProgress'));
                    const allProgress = progressSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    console.log('Analytics - Total progress docs:', allProgress.length);
                    
                    // Load published journeys to get total steps
                    const journeysSnapshot = await getDocs(
                        query(collection(db, 'journeys'), where('status', '==', 'published'))
                    );
                    const publishedJourneys = journeysSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Calculate total steps across all published journeys
                    const totalSteps = publishedJourneys.reduce((sum, j) => sum + (j.stepIds?.length || 0), 0);
                    
                    // Calculate metrics
                    const totalUsers = new Set(allProgress.map(p => p.userId)).size;
                    
                    // Count completed journeys (100% completion)
                    const completedJourneys = allProgress.filter(p => {
                        const completed = p.completedStepIds?.length || 0;
                        const total = p.totalSteps || 0;
                        return total > 0 && completed >= total;
                    }).length;
                    
                    // Calculate average completion percentage across all users
                    let avgCompletionPercent = 0;
                    if (allProgress.length > 0) {
                        const totalPercentage = allProgress.reduce((sum, p) => {
                            const completed = p.completedStepIds?.length || 0;
                            const total = p.totalSteps || 0;
                            const percentage = total > 0 ? (completed / total * 100) : 0;
                            return sum + percentage;
                        }, 0);
                        avgCompletionPercent = totalPercentage / allProgress.length;
                    }
                    
                    console.log('Analytics calculated:', {
                        totalUsers,
                        completedJourneys,
                        avgCompletionPercent,
                        totalSteps,
                        publishedJourneys: publishedJourneys.length
                    });
                    
                    setAnalytics({
                        totalUsers,
                        completedJourneys,
                        avgCompletionPercent,
                        inProgressJourneys: allProgress.filter(p => {
                            const completed = p.completedStepIds?.length || 0;
                            const total = p.totalSteps || 0;
                            return total > 0 && completed < total;
                        }).length,
                        totalSteps,
                        publishedJourneys: publishedJourneys.length
                    });
                    setLoading(false);
                } catch (error) {
                    console.error('Error loading analytics:', error);
                    setLoading(false);
                }
            };
            
            if (loading) return <div className="p-8">Loading analytics...</div>;
            
            return (
                <div className="p-8">
                    <h1 className="text-3xl font-bold text-gray-800 mb-8">📈 Analytics Dashboard</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500">
                            <div className="text-sm text-gray-600 mb-1">Active Learners</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.totalUsers}</div>
                            <div className="text-xs text-gray-500 mt-2">Total users in system</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-indigo-500">
                            <div className="text-sm text-gray-600 mb-1">Published Journeys</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.publishedJourneys}</div>
                            <div className="text-xs text-gray-500 mt-2">Active training content</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500">
                            <div className="text-sm text-gray-600 mb-1">Completed Journeys</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.completedJourneys}</div>
                            <div className="text-xs text-green-600 mt-2">✓ 100% complete</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-yellow-500">
                            <div className="text-sm text-gray-600 mb-1">In Progress</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.inProgressJourneys}</div>
                            <div className="text-xs text-yellow-600 mt-2">Currently learning</div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-purple-500">
                            <div className="text-sm text-gray-600 mb-1">Avg. Completion</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.avgCompletionPercent.toFixed(1)}%</div>
                            <div className="text-xs text-gray-500 mt-2">Average progress across all users</div>
                            <div className="mt-3 text-xs">
                                {analytics.avgCompletionPercent < 25 && <span className="text-red-600">⚠️ Low engagement - review content</span>}
                                {analytics.avgCompletionPercent >= 25 && analytics.avgCompletionPercent < 50 && <span className="text-yellow-600">⚡ Fair - room for improvement</span>}
                                {analytics.avgCompletionPercent >= 50 && analytics.avgCompletionPercent < 75 && <span className="text-blue-600">👍 Good engagement</span>}
                                {analytics.avgCompletionPercent >= 75 && <span className="text-green-600">🎉 Excellent engagement!</span>}
                            </div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-teal-500">
                            <div className="text-sm text-gray-600 mb-1">Total Training Steps</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.totalSteps}</div>
                            <div className="text-xs text-gray-500 mt-2">Across {analytics.publishedJourneys} published {analytics.publishedJourneys === 1 ? 'journey' : 'journeys'}</div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">📊 More detailed analytics coming soon...</h2>
                        <p className="text-gray-600">Future features:</p>
                        <ul className="list-disc list-inside text-gray-600 mt-2 space-y-1">
                            <li>Journey-specific completion breakdown</li>
                            <li>Completion rates by specialty</li>
                            <li>Average time per journey</li>
                            <li>Step-level drop-off analysis</li>
                            <li>User engagement trends over time</li>
                            <li>Export reports to CSV/PDF</li>
                        </ul>
                    </div>
                </div>
            );
        }

        function AdminLogin() {
            const [email, setEmail] = useState(localStorage.getItem('accuro_admin_email') || '');
            const [password, setPassword] = useState('');
            const [error, setError] = useState(_accessDeniedReason || '');
            const [loading, setLoading] = useState(false);
            
            // Clear the module-level reason once we've read it so it doesn't persist after another login attempt
            useEffect(() => {
                if (_accessDeniedReason) _accessDeniedReason = null;
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                const { signInWithEmailAndPassword } = window.firebaseModules;
                
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // Save email to localStorage for next time
                    localStorage.setItem('accuro_admin_email', email);
                    // Auth state listener will handle the rest
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-600 p-4">

                                    type="email"

                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                    placeholder="trainer@example.com"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}

                                    placeholder="••••••••"
                                    required
                                    minLength="6"
                                />
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 p-3 rounded-xl text-sm">
                                    {error}
                                </div>
                            )}
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-xl font-bold hover:from-purple-700 hover:to-indigo-700 transition shadow-lg disabled:opacity-50"
                            >
                                {loading ? 'Signing in...' : 'Sign In as Trainer'}
                            </button>

			<div className="mt-4 text-center">
    			<button
        			type="button"
        			onClick={async () => {
            			if (!email) {
                			setError('Please enter your email address first');
                		return;
            			}
            			try {
                			const { sendPasswordResetEmail } = window.firebaseModules;
                			await sendPasswordResetEmail(auth, email);
                			alert(`Password reset email sent to ${email}. Check your inbox (and spam folder)!`);
            			} catch (err) {
                			console.error('Password reset error:', err);
                			console.error('Error code:', err.code);
                			console.error('Error message:', err.message);
                			
                			// Show user-friendly error
                			if (err.code === 'auth/user-not-found') {
                			    alert('No account found with this email address.');
                			} else if (err.code === 'auth/invalid-email') {
                			    alert('Invalid email address format.');
                			} else if (err.code === 'auth/too-many-requests') {
                			    alert('Too many reset attempts. Please try again later.');
                			} else {
                			    alert(`Error sending reset email: ${err.message}`);
                			}
                			setError(err.message);
            			}
        			}}
        			className="text-sm text-purple-600 hover:underline"
    			>
        		Forgot password?
    			</button>
			</div>

                        </form>

                        
                        <div className="mt-6 pt-6 border-t border-gray-200 text-center">
                            <p className="text-sm text-gray-600 mb-2">Are you a student?</p>
                            <a href="index.html" className="text-purple-600 hover:underline font-semibold text-sm">
                                Go to Student Portal →
                            </a>
                        </div>
                    </div>
                </div>
            );

        // ============================================
        // MAIN ADMIN APP
        // ============================================
        function AdminPanel() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [stats, setStats] = useState({});
            const [toast, setToast] = useState(null);
            const toastTimeoutRef = useRef(null);
            
            // Toast notification helper - replaces existing toast
            const showToast = (message, type = 'success') => {
                // Clear any existing timeout
                if (toastTimeoutRef.current) {
                    clearTimeout(toastTimeoutRef.current);
                }
                
                // Show new toast
                setToast({ message, type });
                
                // Auto-hide after 3 seconds
                toastTimeoutRef.current = setTimeout(() => {
                    setToast(null);
                }, 3000);
            };
            
            useEffect(() => {
                const { onAuthStateChanged } = window.firebaseModules;
                
                const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        
                        const { doc, getDoc } = window.firebaseModules;
                        const userDoc = await getDoc(doc(db, 'users', firebaseUser.uid));
                        
                        if (userDoc.exists()) {
                            const profile = userDoc.data();
                            setUserProfile(profile);
                            
                            if (profile.role !== 'trainer') {
                                _accessDeniedReason = 'This panel is for trainers only. Please use the student portal.';
                                const { signOut } = window.firebaseModules;
                                await signOut(auth);
                            } else {
                                loadStats();
                            }
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                    }
                    setLoading(false);
                });
                
                return () => unsubscribe();
            }, []);
            
            const loadStats = async () => {
                const { collection, getDocs, query, where } = window.firebaseModules;
                
                const usersSnapshot = await getDocs(collection(db, 'users'));
                const journeysSnapshot = await getDocs(query(collection(db, 'journeys'), where('status', '==', 'published')));
                const progressSnapshot = await getDocs(collection(db, 'userProgress'));
                
                // Count only steps that belong to published journeys
                let totalSteps = 0;
                journeysSnapshot.docs.forEach(doc => {
                    const journey = doc.data();
                    totalSteps += (journey.stepIds?.length || 0);
                });
                
                // Calculate true average completion percentage
                const avgCompletion = progressSnapshot.docs.length > 0 
                    ? progressSnapshot.docs.reduce((sum, doc) => {
                        const data = doc.data();
                        const completed = data.completedStepIds?.length || 0;
                        const total = data.totalSteps || 1;  // Steps in their journey
                        const percentage = (completed / total) * 100;
                        return sum + percentage;
                    }, 0) / progressSnapshot.docs.length
                    : 0;
                
                setStats({
                    totalUsers: usersSnapshot.size,
                    publishedJourneys: journeysSnapshot.size,
                    totalSteps: totalSteps,
                    avgCompletion: Math.round(avgCompletion)  // Round to whole number
                });
            };
            
            const handleSignOut = async () => {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Loading admin panel...</div>
                    </div>
                );
            }
            
            // Show login if not authenticated
            if (!user) {
                return <AdminLogin />;
            }
            
            // Show loading while profile is being fetched (prevents flash of "Access Denied")
            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Checking permissions...</div>
                    </div>
                );
            }
            
            // Show access denied if not a trainer
            if (userProfile.role !== 'trainer') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-red-500 to-pink-600">
                        <div className="bg-white p-8 rounded-2xl text-center">
                            <h2 className="text-2xl font-bold text-red-600 mb-4">Access Denied</h2>
                            <p className="text-gray-600 mb-4">This panel is for trainers only.</p>
                            <button
                                onClick={handleSignOut}
                                className="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-gray-100">

                    <div className="fixed left-0 top-0 bottom-0 w-64 bg-gradient-to-b from-indigo-600 to-purple-700 text-white p-6">

                                onClick={() => setCurrentView('quizgames')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'quizgames' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <span className="w-5 h-5">🎮</span>
                                Quiz Games
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('calendartemplates')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'calendartemplates' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Calendar className="w-5 h-5" />
                                Calendar Templates
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('continuingeducation')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'continuingeducation' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.BookOpen className="w-5 h-5" />
                                Continuing Education
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('analytics')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'analytics' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Analytics className="w-5 h-5" />
                                Analytics
                            </button>
                        </nav>
                        
                        <div className="absolute bottom-6 left-6 right-6">
                            <button
                                onClick={handleSignOut}
                                className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg transition"
                            >
                                <Icons.LogOut className="w-5 h-5" />
                                Sign Out
                            </button>
                        </div>
                    </div>
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 right-4 z-50 animate-slide-in">
                            <div 
                                onClick={() => setToast(null)}
                                className={`px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 cursor-pointer hover:opacity-90 transition ${
                                    toast.type === 'success' ? 'bg-green-500' : 
                                    toast.type === 'error' ? 'bg-red-500' : 'bg-blue-500'
                                } text-white`}
                            >
                                <span className="text-2xl">
                                    {toast.type === 'success' ? '✓' : toast.type === 'error' ? '✕' : 'ℹ'}
                                </span>
                                <span className="font-semibold flex-1">{toast.message}</span>
                                <span className="text-sm opacity-70 hover:opacity-100">✕</span>
                            </div>
                        </div>
                    )}
                    
                    {/* Main Content */}
                    <div className="ml-64">
                        {currentView === 'dashboard' && <Dashboard stats={stats} setCurrentView={setCurrentView} />}
                        {currentView === 'journeys' && <JourneyManagement showToast={showToast} />}
                        {currentView === 'users' && <UserManagement showToast={showToast} />}
                        {currentView === 'specialties' && <SpecialtiesManagement showToast={showToast} />}
                        {currentView === 'quizgames' && <QuizGames showToast={showToast} />}
                        {currentView === 'calendartemplates' && <CalendarTemplates showToast={showToast} />}
                        {currentView === 'continuingeducation' && <ContinuingEducation showToast={showToast} />}
                        {currentView === 'analytics' && <Analytics />}
                    </div>
                </div>
            );
        }
        
        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
