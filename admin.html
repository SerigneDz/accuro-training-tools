        // ============================================
        // GENERATE QUESTIONS FROM JOURNEY (draft + review, not fully automatic)
        // ============================================
        function GenerateFromJourneyModal({ journeys, onClose, onSaved, showToast }) {
            const [selectedJourneyId, setSelectedJourneyId] = useState('');
            const [loadingSteps, setLoadingSteps] = useState(false);
            const [draftQuestions, setDraftQuestions] = useState([]);
            const [saving, setSaving] = useState(false);
            
            const generateDrafts = async () => {
                if (!selectedJourneyId) return;
                setLoadingSteps(true);
                try {
                    const { doc, getDoc } = window.firebaseModules;
                    const journey = journeys.find(j => j.id === selectedJourneyId);
                    
                    if (!journey || !journey.stepIds || journey.stepIds.length === 0) {
                        showToast('This journey has no steps to generate questions from', 'error');
                        setDraftQuestions([]);
                        return;
                    }
                    
                    // Steps live in a top-level 'steps' collection, referenced by ID from the journey's stepIds array
                    const stepsPromises = journey.stepIds.map(stepId => getDoc(doc(db, 'steps', stepId)));
                    const stepsDocs = await Promise.all(stepsPromises);
                    const steps = stepsDocs
                        .filter(d => d.exists())
                        .map(d => ({ id: d.id, ...d.data() }))
                        .sort((a, b) => (a.order || 0) - (b.order || 0));
                    
                    // Fetch tasks for every step (each step references its tasks via taskIds)
                    const allTaskIds = steps.flatMap(s => s.taskIds || []);
                    const taskPromises = allTaskIds.map(taskId => getDoc(doc(db, 'tasks', taskId)));
                    const taskDocs = await Promise.all(taskPromises);
                    const tasksById = {};
                    taskDocs.filter(d => d.exists()).forEach(d => { tasksById[d.id] = { id: d.id, ...d.data() }; });
                    
                    // Pool of all real task actions across the journey, used as plausible wrong-answer distractors
                    const allActions = Object.values(tasksById).map(t => t.action).filter(Boolean);
                    
                    const drafts = [];
                    steps.forEach(step => {
                        const stepTasks = (step.taskIds || []).map(id => tasksById[id]).filter(Boolean);
                        
                        if (stepTasks.length > 0) {
                            // One question per task: correct answer = the real action, distractors = other real actions from this journey
                            stepTasks.forEach(task => {
                                if (!task.action) return;
                                const distractorPool = allActions.filter(a => a !== task.action);
                                const shuffledDistractors = [...distractorPool].sort(() => Math.random() - 0.5).slice(0, 3);
                                // Pad with generic distractors if the journey doesn't have enough other real actions yet
                                while (shuffledDistractors.length < 3) {
                                    shuffledDistractors.push(['Skip this step', 'Ask a colleague to do it', 'Note it for later'][shuffledDistractors.length]);
                                }
                                const options = [task.action, ...shuffledDistractors];
                                const correctIndex = 0; // will be re-shuffled below
                                
                                // Shuffle option order so the correct answer isn't always first
                                const indices = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
                                const shuffledOptions = indices.map(i => options[i]);
                                const newCorrectAnswer = indices.indexOf(correctIndex);
                                
                                drafts.push({
                                    question: `During "${step.title}", what should you do${task.accuroNavigation ? ` (${task.accuroNavigation})` : ''}?`,
                                    options: shuffledOptions,
                                    correctAnswer: newCorrectAnswer,
                                    category: journey?.title || '',
                                    sourceJourneyId: selectedJourneyId,
                                    _stepReference: step.title
                                });
                            });
                        } else if (step.outcome) {
                            // Fallback for steps with no tasks: use the step's outcome as the basis
                            drafts.push({
                                question: `What is the expected outcome of "${step.title}"?`,
                                options: [step.outcome, 'The task is skipped', 'Escalate to a manager', 'None of the above'],
                                correctAnswer: 0,
                                category: journey?.title || '',
                                sourceJourneyId: selectedJourneyId,
                                _stepReference: step.title
                            });
                        }
                    });
                    
                    setDraftQuestions(drafts.slice(0, 15));
                    
                    if (drafts.length === 0) {
                        showToast('This journey\'s steps have no task actions or outcomes to draft questions from', 'error');
                    }
                } catch (err) {
                    console.error('Error generating drafts:', err);
                    showToast('Failed to load journey steps: ' + err.message, 'error');
                } finally {
                    setLoadingSteps(false);
                }
            };
            
            const updateDraft = (index, field, value) => {
                setDraftQuestions(prev => prev.map((d, i) => i === index ? { ...d, [field]: value } : d));
            };
            
            const updateDraftOption = (index, optIndex, value) => {
                setDraftQuestions(prev => prev.map((d, i) => {
                    if (i !== index) return d;
                    return { ...d, options: d.options.map((o, oi) => oi === optIndex ? value : o) };
                }));
            };
            
            const removeDraft = (index) => {
                setDraftQuestions(prev => prev.filter((_, i) => i !== index));
            };
            
            const saveAllDrafts = async () => {
                if (draftQuestions.length === 0) return;
                setSaving(true);
                try {
                    const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                    for (const [i, draft] of draftQuestions.entries()) {
                        const { _stepReference, ...toSave } = draft;
                        const id = `question_journey_${selectedJourneyId}_${Date.now()}_${i}`;
                        await setDoc(doc(db, 'quiz_questions', id), {
                            ...toSave,
                            isActive: true,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        });
                    }
                    showToast(`✅ Added ${draftQuestions.length} question${draftQuestions.length !== 1 ? 's' : ''} to the bank!`);
                    onSaved();
                } catch (err) {
                    console.error('Error saving drafts:', err);
                    showToast('Failed to save questions: ' + err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center z-10">
                            <h2 className="text-xl font-bold text-gray-800">🪄 Generate Questions from Journey</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                        </div>
                        
                        <div className="p-6 space-y-4">
                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-sm text-amber-700">
                                This drafts one question per task in the journey, using the real task action as the correct answer 
                                and other real actions from this journey as wrong answers (with generic fallbacks if there aren't enough). 
                                Review and edit the wording and answer choices below before saving — these are a starting point, not final quiz-ready questions.
                            </div>
                            
                            <div className="flex gap-2">
                                <select
                                    value={selectedJourneyId}
                                    onChange={e => { setSelectedJourneyId(e.target.value); setDraftQuestions([]); }}
                                    className="flex-1 px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                >
                                    <option value="">Select a journey...</option>
                                    {journeys.map(j => (
                                        <option key={j.id} value={j.id}>{j.title || 'Untitled Journey'}</option>
                                    ))}
                                </select>
                                <button
                                    onClick={generateDrafts}
                                    disabled={!selectedJourneyId || loadingSteps}
                                    className="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold disabled:opacity-50 flex-shrink-0"
                                >
                                    {loadingSteps ? 'Loading...' : 'Generate'}
                                </button>
                            </div>
                            
                            {draftQuestions.length > 0 && (
                                <div className="space-y-3">
                                    <h3 className="font-bold text-gray-800">{draftQuestions.length} Draft Question{draftQuestions.length !== 1 ? 's' : ''} (review before saving)</h3>
                                    {draftQuestions.map((draft, i) => (
                                        <div key={i} className="border border-gray-200 rounded-lg p-3 bg-gray-50">
                                            <div className="flex justify-between items-start mb-2">
                                                <input
                                                    type="text"
                                                    value={draft.question}
                                                    onChange={e => updateDraft(i, 'question', e.target.value)}
                                                    className="flex-1 px-3 py-1.5 border border-gray-200 rounded-lg text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none mr-2"
                                                />
                                                <button onClick={() => removeDraft(i)} className="text-red-400 hover:text-red-600 text-sm flex-shrink-0">✕</button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {draft.options.map((opt, oi) => (
                                                    <div key={oi} className="flex items-center gap-1.5">
                                                        <input
                                                            type="radio"
                                                            checked={draft.correctAnswer === oi}
                                                            onChange={() => updateDraft(i, 'correctAnswer', oi)}
                                                            className="w-3.5 h-3.5"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={opt}
                                                            onChange={e => updateDraftOption(i, oi, e.target.value)}
                                                            className="flex-1 px-2 py-1 border border-gray-200 rounded text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <div className="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex justify-end gap-3">
                            <button onClick={onClose} className="px-6 py-2 border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition">
                                Cancel
                            </button>
                            <button
                                onClick={saveAllDrafts}
                                disabled={saving || draftQuestions.length === 0}
                                className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold disabled:opacity-50"
                            >
                                {saving ? 'Saving...' : `Save All ${draftQuestions.length} Question${draftQuestions.length !== 1 ? 's' : ''} to Bank`}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function GameManagementModal({ game, users, showToast, onClose, onUpdated }) {

                name: game.name,

            const [teams, setTeams] = useState(JSON.parse(JSON.stringify(game.teams || [])));
            const [saving, setSaving] = useState(false);
            
            const usersById = {};
            users.forEach(u => { usersById[u.id] = u; });
            
            const getUserLabel = (userId) => {
                const u = usersById[userId];
                return u ? (u.displayName || u.email) : '(unknown user)';
            };
            
            const allAssignedIds = new Set(teams.flatMap(t => t.playerIds));
            const studentUsers = users.filter(u => u.role !== 'trainer');
            const unassignedStudents = studentUsers.filter(u => !allAssignedIds.has(u.id));
            
            const saveSettings = async () => {
                if (!formData.name.trim()) {
                    alert('Please enter a game name');
                    return;
                }
                setSaving(true);
                try {
                    const { doc, updateDoc } = window.firebaseModules;
                    await updateDoc(doc(db, 'quizGames', game.id), {
                        name: formData.name.trim(),
                        rounds: Number(formData.rounds),
                        questionsPerRound: Number(formData.questionsPerRound)
                    });
                    showToast('✅ Game settings updated!');
                    onUpdated();
                } catch (err) {
                    console.error('Error updating game settings:', err);
                    showToast('Failed to update settings: ' + err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };
            
            const moveStudentToTeam = (studentId, targetTeamId) => {
                setTeams(prev => prev.map(team => {
                    // Remove from any team first
                    const withoutStudent = team.playerIds.filter(id => id !== studentId);
                    if (team.id === targetTeamId) {
                        return { ...team, playerIds: [...withoutStudent, studentId] };
                    }
                    return { ...team, playerIds: withoutStudent };
                }));
            };
            
            const removeStudentFromGame = (studentId) => {
                setTeams(prev => prev.map(team => ({
                    ...team,
                    playerIds: team.playerIds.filter(id => id !== studentId)
                })));
            };
            
            const reshuffleAllTeams = () => {
                if (!confirm('Re-shuffle all teams? This randomly redistributes all currently-assigned students (and adds any unassigned students) across teams, keeping the same number of teams. Scores stay with the team, not the player.')) return;
                
                const allStudentIds = [...allAssignedIds, ...unassignedStudents.map(u => u.id)];
                const shuffled = [...allStudentIds].sort(() => Math.random() - 0.5);
                const teamSize = Math.ceil(shuffled.length / teams.length);
                
                setTeams(prev => prev.map((team, i) => ({
                    ...team,
                    playerIds: shuffled.slice(i * teamSize, (i + 1) * teamSize)
                })));
            };
            
            const addNewTeam = () => {
                const usedColors = new Set(teams.map(t => t.id));
                const nextColor = TEAM_COLORS.find(c => !usedColors.has(c.id));
                if (!nextColor) {
                    showToast('Maximum number of teams reached', 'error');
                    return;
                }
                setTeams(prev => [...prev, { ...nextColor, playerIds: [], totalPoints: 0, roundScores: [] }]);
            };
            
            const removeTeam = (teamId) => {
                const team = teams.find(t => t.id === teamId);
                if (!team) return;
                if (team.playerIds.length > 0) {
                    showToast(`Move all players out of "${team.name}" before removing it`, 'error');
                    return;

                    showToast('A game needs at least one team', 'error');
                    return;

                setTeams(prev => prev.filter(t => t.id !== teamId));
            };
            
            const saveTeams = async () => {
                setSaving(true);

                    const { doc, updateDoc } = window.firebaseModules;
                    await updateDoc(doc(db, 'quizGames', game.id), { teams: teams });

                    showToast('Failed to save teams: ' + err.message, 'error');

                }

                                    tab === 'teams' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500'
                                }`}
                            >

                        {tab === 'settings' && (

                    const querySnapshot = await getDocs(q);
                    const gamesData = querySnapshot.docs.map(doc => ({

                if (!newGame.name.trim()) {

                    const q = query(usersRef, where('role', '==', 'student'));
                    const usersSnap = await getDocs(q);
                    const students = usersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (students.length < 2) {
                        showToast('Need at least 2 students to create a game', 'error');
                        return;
                    }
                    
                    // Pull active questions from the Question Bank
                    const questionsSnap = await getDocs(collection(db, 'quiz_questions'));
                    const allQuestions = questionsSnap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(qz => qz.isActive !== false);
                    
                    const neededCount = newGame.rounds * newGame.questionsPerRound;
                    if (allQuestions.length === 0) {
                        showToast('No questions in the Question Bank yet - add some first', 'error');
                        return;
                    }
                    if (allQuestions.length < newGame.questionsPerRound) {
                        showToast(`Question Bank only has ${allQuestions.length} question(s), but each round needs ${newGame.questionsPerRound}. Add more questions or lower questions/round.`, 'error');
                        return;
                    }
                    
                    // Shuffle and snapshot enough question IDs for all rounds (reuse/cycle if bank is smaller than total needed)
                    const shuffledQuestions = [...allQuestions].sort(() => Math.random() - 0.5);
                    const questionIds = [];
                    for (let i = 0; i < neededCount; i++) {
                        questionIds.push(shuffledQuestions[i % shuffledQuestions.length].id);
                    }
                    
                    // Auto-assign teams (simple random assignment for MVP)
                    const teamCount = Math.ceil(students.length / newGame.teamSize);
                    const shuffled = [...students].sort(() => Math.random() - 0.5);
                    const teams = [];

                        teams.push({

                            totalPoints: 0,
                            roundScores: []
                        });

        // REUSABLE MULTI-SELECT DROPDOWN (search + checkbox toggle + chips)
        // ============================================
        function MultiSelectDropdown({ options, selectedValues, onChange, placeholder, label }) {
            const [isOpen, setIsOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const containerRef = useRef(null);
            
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);
            
            const filteredOptions = options.filter(opt => 
                opt.toLowerCase().includes(searchQuery.toLowerCase())
            );
            
            const allSelected = options.length > 0 && selectedValues.length === options.length;
            
            const toggleValue = (value) => {
                const updated = selectedValues.includes(value)
                    ? selectedValues.filter(v => v !== value)
                    : [...selectedValues, value];
                onChange(updated);
            };
            
            const removeValue = (value, e) => {
                e.stopPropagation();
                onChange(selectedValues.filter(v => v !== value));
            };
            
            const toggleSelectAll = () => {
                onChange(allSelected ? [] : [...options]);
            };
            
            return (
                <div className="relative" ref={containerRef}>
                    {label && <label className="block text-sm font-semibold text-gray-700 mb-1">{label}</label>}
                    <button
                        type="button"
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full min-h-[42px] px-3 py-2 border border-gray-200 rounded-lg text-sm text-left bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none flex items-center justify-between gap-2"
                    >
                        <div className="flex flex-wrap gap-1.5 flex-1">
                            {selectedValues.length === 0 ? (
                                <span className="text-gray-400">{placeholder || 'Select...'}</span>
                            ) : allSelected ? (
                                <span className="inline-flex items-center gap-1 bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-xs font-medium">
                                    All Specialties ({options.length})
                                    <span onClick={(e) => { e.stopPropagation(); onChange([]); }} className="hover:text-indigo-900 cursor-pointer">✕</span>
                                </span>
                            ) : (
                                selectedValues.map(val => (
                                    <span key={val} className="inline-flex items-center gap-1 bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-xs font-medium">
                                        {val}
                                        <span onClick={(e) => removeValue(val, e)} className="hover:text-indigo-900 cursor-pointer">✕</span>
                                    </span>
                                ))
                            )}
                        </div>
                        <span className="text-gray-400 flex-shrink-0">{isOpen ? '▲' : '▼'}</span>
                    </button>
                    
                    {isOpen && (
                        <div className="absolute z-20 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-72 overflow-hidden flex flex-col">
                            <div className="p-2 border-b border-gray-100">
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="Search..."
                                    autoFocus
                                    className="w-full px-2 py-1.5 border border-gray-200 rounded text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                />
                            </div>
                            <button
                                type="button"
                                onClick={toggleSelectAll}

            const [saving, setSaving] = useState(false);
            
            const updateField = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };
            
            const addDay = () => {
                setFormData(prev => ({
                    ...prev,
                    items: [
                        ...prev.items,
                        { dayNumber: prev.items.length + 1, title: '', description: '', startTime: '09:00', endTime: '17:00', journeyIds: [], tasks: [] }
                    ]
                }));
            };
            
            const removeDay = (index) => {
                if (formData.items.length <= 1) return;
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.filter((_, i) => i !== index).map((item, i) => ({ ...item, dayNumber: i + 1 }))
                }));
            };
            
            const updateDayField = (index, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === index ? { ...item, [field]: value } : item)
                }));
            };
            
            const toggleJourney = (dayIndex, journeyId) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => {
                        if (i !== dayIndex) return item;
                        const current = item.journeyIds || [];
                        const updated = current.includes(journeyId)
                            ? current.filter(id => id !== journeyId)
                            : [...current, journeyId];
                        return { ...item, journeyIds: updated };
                    })
                }));
            };
            
            const addTask = (dayIndex) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => {
                        if (i !== dayIndex) return item;
                        return { ...item, tasks: [...(item.tasks || []), { id: `task_${Date.now()}`, title: '', duration: '', time: '' }] };
                    })
                }));
            };
            
            const updateTask = (dayIndex, taskIndex, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => {
                        if (i !== dayIndex) return item;
                        const tasks = item.tasks.map((t, ti) => ti === taskIndex ? { ...t, [field]: value } : t);
                        return { ...item, tasks };

                }));

            const removeTask = (dayIndex, taskIndex) => {

                                                            value={item.startTime || '09:00'}

                                                {/* Journey Linking (Optional) */}
                                                <div>
                                                    <label className="block text-xs font-semibold text-gray-600 mb-1">

                                                        <button

                                <button

        function AssignScheduleModal({ template, showToast, onClose, onAssigned }) {
            const [users, setUsers] = useState([]);
            const [loadingUsers, setLoadingUsers] = useState(true);
            const [assignMode, setAssignMode] = useState('existing'); // existing | new
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedUser, setSelectedUser] = useState(null);
            
            // New hire fields (when user not in system)
            const [employeeName, setEmployeeName] = useState('');
            const [employeeEmail, setEmployeeEmail] = useState('');
            const [department, setDepartment] = useState('');
            const [sendInvite, setSendInvite] = useState(true);
            
            const [startDate, setStartDate] = useState(() => {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                return tomorrow.toISOString().split('T')[0];
            });
            const [notes, setNotes] = useState('');
            const [saving, setSaving] = useState(false);
            
            // Load existing users
            useEffect(() => {
                loadUsers();
            }, []);
            
            const loadUsers = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'users'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setUsers(data);
                } catch (err) {
                    console.error('Error loading users:', err);
                } finally {
                    setLoadingUsers(false);
                }
            };
            
            // Filter users by search
            const filteredUsers = users.filter(u => {
                if (!searchQuery.trim()) return true;
                const q = searchQuery.toLowerCase();
                return (u.displayName || '').toLowerCase().includes(q) 
                    || (u.email || '').toLowerCase().includes(q);
            });
            
            const selectUser = (user) => {
                setSelectedUser(user);
                setEmployeeName(user.displayName || '');
                setEmployeeEmail(user.email || '');
                setSearchQuery('');
            };
            
            const clearSelection = () => {
                setSelectedUser(null);
                setEmployeeName('');
                setEmployeeEmail('');
            };
            
            // Calculate preview dates
            const previewDates = calculateScheduleDates(startDate, template.items.length, template.includeWeekends);
            const endDate = previewDates[previewDates.length - 1]?.date;
            
            // Get display name/email based on mode
            const finalName = assignMode === 'existing' ? (selectedUser?.displayName || '') : employeeName;
            const finalEmail = assignMode === 'existing' ? (selectedUser?.email || '') : employeeEmail;
            
            const handleAssign = async () => {
                if (assignMode === 'existing' && !selectedUser) {
                    alert('Please select an existing user');
                    return;
                }
                if (assignMode === 'new' && !employeeName.trim()) {
                    alert('Please enter the employee name');
                    return;
                }
                
                setSaving(true);
                try {
                    const { collection, doc, setDoc, serverTimestamp, getAuth } = window.firebaseModules;
                    const auth = getAuth();
                    
                    const scheduleId = `schedule_${Date.now()}`;
                    const items = template.items.map((item, i) => ({
                        dayNumber: item.dayNumber,
                        date: previewDates[i].date,
                        dayOfWeek: previewDates[i].dayOfWeek,
                        title: item.title,
                        description: item.description || '',
                        startTime: item.startTime || '09:00',
                        endTime: item.endTime || '17:00',
                        journeyIds: item.journeyIds || [],
                        tasks: sortTasksByTime(item.tasks || []).map(t => ({ ...t, status: 'pending' })),
                        scheduleItemStatus: 'pending'
                    }));
                    
                    const scheduleData = {
                        employeeName: finalName.trim(),
                        employeeEmail: finalEmail.trim(),
                        employeeId: selectedUser?.id || null,
                        department: department.trim(),
                        specialties: template.specialties || [],
                        templateId: template.id,
                        templateName: template.name,
                        startDate: startDate,
                        endDate: endDate,
                        includeWeekends: template.includeWeekends,
                        items: items,
                        status: 'active',
                        overallProgress: 0,
                        notes: notes.trim(),
                        isNewHire: assignMode === 'new',
                        inviteSent: assignMode === 'new' && sendInvite,
                        assignedBy: auth.currentUser?.uid || null,
                        assignedByName: auth.currentUser?.displayName || auth.currentUser?.email || 'Admin',
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    };
                    
                    await setDoc(doc(db, 'healthcare_schedules', scheduleId), scheduleData);
                    
                    if (assignMode === 'new' && sendInvite && employeeEmail.trim()) {
                        // TODO: Send invite email (future: Teams integration)
                        showToast(`✅ Schedule assigned to ${finalName}! Email invite pending (Teams integration coming soon)`);
                    } else {
                        showToast(`✅ Onboarding schedule assigned to ${finalName}!`);
                    }
                    
                    onAssigned();
                } catch (err) {
                    console.error('Error assigning schedule:', err);
                    showToast('Failed to assign schedule: ' + err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center z-10">

                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                        </div>
                        
                        <div className="p-6 space-y-5">
                            {/* Template Info */}
                            <div className="bg-indigo-50 rounded-lg p-4">
                                <p className="text-sm text-indigo-700">
                                    <span className="font-semibold">Template:</span> {template.name} ({(template.specialties || []).join(', ')}, {template.items.length} days, {template.includeWeekends ? 'all days' : 'Mon-Fri'})
                                </p>
                            </div>
                            
                            {/* Assign Mode Toggle */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Assign To</label>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => { setAssignMode('existing'); clearSelection(); }}
                                        className={`flex-1 px-4 py-3 rounded-lg text-sm font-medium transition border-2 ${
                                            assignMode === 'existing' 
                                                ? 'border-indigo-600 bg-indigo-50 text-indigo-700' 
                                                : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
                                        }`}
                                    >
                                        <div className="text-lg mb-1">👤</div>
                                        Existing User
                                        <div className="text-xs opacity-70 mt-0.5">Already in the system</div>
                                    </button>
                                    <button
                                        onClick={() => { setAssignMode('new'); clearSelection(); }}
                                        className={`flex-1 px-4 py-3 rounded-lg text-sm font-medium transition border-2 ${
                                            assignMode === 'new' 
                                                ? 'border-indigo-600 bg-indigo-50 text-indigo-700' 
                                                : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'
                                        }`}
                                    >
                                        <div className="text-lg mb-1">✉️</div>
                                        New Hire
                                        <div className="text-xs opacity-70 mt-0.5">Not yet in the system</div>
                                    </button>
                                </div>
                            </div>
                            
                            {/* Existing User Search */}
                            {assignMode === 'existing' && (
                                <div>
                                    {selectedUser ? (
                                        <div className="flex items-center justify-between bg-green-50 border border-green-200 rounded-lg p-4">
                                            <div>
                                                <div className="font-semibold text-green-800">{selectedUser.displayName}</div>
                                                <div className="text-sm text-green-600">{selectedUser.email}</div>
                                                <div className="text-xs text-green-500 mt-1">
                                                    {selectedUser.role === 'trainer' ? '👨‍🏫 Trainer' : '👨‍🎓 Student'}
                                                </div>
                                            </div>
                                            <button
                                                onClick={clearSelection}
                                                className="px-3 py-1.5 bg-white text-gray-600 rounded-lg border border-gray-200 hover:bg-gray-50 text-sm"
                                            >
                                                Change
                                            </button>
                                        </div>
                                    ) : (
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1">Search Users</label>
                                            <input
                                                type="text"
                                                value={searchQuery}
                                                onChange={e => setSearchQuery(e.target.value)}
                                                placeholder="Type a name or email..."
                                                className="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                            />
                                            
                                            {loadingUsers ? (
                                                <p className="text-sm text-gray-400 mt-2">Loading users...</p>
                                            ) : (
                                                <div className="mt-2 border border-gray-200 rounded-lg max-h-48 overflow-y-auto">
                                                    {filteredUsers.length === 0 ? (
                                                        <div className="p-4 text-center text-sm text-gray-400">
                                                            {searchQuery ? 'No users match your search' : 'No users found'}
                                                            <button
                                                                onClick={() => setAssignMode('new')}
                                                                className="block mx-auto mt-2 text-indigo-600 hover:text-indigo-800 font-medium"
                                                            >
                                                                → Add as New Hire instead

                                                        </div>

                                                        filteredUsers.map(user => (
                                                            <button
                                                                key={user.id}
                                                                onClick={() => selectUser(user)}
                                                                className="w-full flex items-center justify-between px-4 py-3 hover:bg-indigo-50 border-b border-gray-50 last:border-b-0 transition text-left"
                                                            >
                                                                <div>
                                                                    <div className="font-medium text-gray-800">{user.displayName || 'Unnamed'}</div>
                                                                    <div className="text-xs text-gray-400">{user.email}</div>
                                                                </div>
                                                                <span className={`text-xs px-2 py-0.5 rounded-full ${
                                                                    user.role === 'trainer' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'
                                                                }`}>
                                                                    {user.role === 'trainer' ? 'Trainer' : 'Student'}
                                                                </span>
                                                            </button>
                                                        ))
                                                    )}
                                                </div>
                                            )}
                                        </div>

        // ============================================
        // SCHEDULES LIST (Analytics view for assigned onboardings)
        // ============================================
        function SchedulesList({ schedules, templates, onViewSchedule, onRefresh, showToast }) {
            const [filterStatus, setFilterStatus] = useState('all');
            
            const unassignSchedule = async (schedule) => {
                if (!confirm(`Unassign "${schedule.templateName}" from ${schedule.employeeName}? This will permanently delete their progress on this schedule.`)) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'healthcare_schedules', schedule.id));
                    showToast('🗑️ Schedule unassigned');
                    onRefresh();
                } catch (err) {
                    console.error('Error unassigning schedule:', err);
                    showToast('Failed to unassign schedule: ' + err.message, 'error');
                }
            };
            
            const calculateProgress = (schedule) => {
                let totalTasks = 0;
                let completedTasks = 0;
                let daysWithNoTasks = 0;
                let daysWithNoTasksCompleted = 0;
                
                schedule.items.forEach(item => {
                    const tasks = item.tasks || [];
                    if (tasks.length === 0) {
                        // Days with no tasks fall back to whole-day completion status
                        daysWithNoTasks++;
                        if (item.scheduleItemStatus === 'completed') daysWithNoTasksCompleted++;
                    } else {
                        totalTasks += tasks.length;
                        completedTasks += tasks.filter(t => t.status === 'completed').length;
                    }
                });
                
                // Combine task-based progress with day-based progress for task-less days
                const combinedTotal = totalTasks + daysWithNoTasks;
                const combinedCompleted = completedTasks + daysWithNoTasksCompleted;
                
                return combinedTotal > 0 ? Math.round((combinedCompleted / combinedTotal) * 100) : 0;
            };
            
            const getStatus = (schedule) => {
                const progress = calculateProgress(schedule);
                const today = new Date().toISOString().split('T')[0];
                const isOverdue = schedule.endDate < today && progress < 100;
                
                if (progress === 100) return { label: 'Completed', color: 'bg-gray-100 text-gray-600', icon: '✅' };
                if (isOverdue) return { label: 'At Risk', color: 'bg-red-100 text-red-700', icon: '⚠️' };
                
                // Check if on track: compare expected progress vs actual
                const startD = new Date(schedule.startDate + 'T00:00:00');
                const todayD = new Date();
                const endD = new Date(schedule.endDate + 'T00:00:00');
                const totalDuration = Math.max(1, (endD - startD) / (1000 * 60 * 60 * 24));
                const elapsed = Math.max(0, (todayD - startD) / (1000 * 60 * 60 * 24));
                const expectedProgress = Math.min(100, Math.round((elapsed / totalDuration) * 100));
                
                if (progress >= expectedProgress) return { label: 'On Track', color: 'bg-green-100 text-green-700', icon: '✅' };
                return { label: 'Behind', color: 'bg-yellow-100 text-yellow-700', icon: '⏳' };
            };
            
            const filteredSchedules = filterStatus === 'all' 
                ? schedules 
                : schedules.filter(s => {
                    const status = getStatus(s);
                    if (filterStatus === 'completed') return status.label === 'Completed';
                    if (filterStatus === 'atrisk') return status.label === 'At Risk';
                    if (filterStatus === 'ontrack') return status.label === 'On Track' || status.label === 'Behind';
                    return true;
                });
            
            const summary = {
                total: schedules.length,
                onTrack: schedules.filter(s => ['On Track', 'Completed'].includes(getStatus(s).label)).length,
                atRisk: schedules.filter(s => getStatus(s).label === 'At Risk').length,
                avgCompletion: schedules.length > 0 
                    ? Math.round(schedules.reduce((sum, s) => sum + calculateProgress(s), 0) / schedules.length) 
                    : 0
            };
            
            return (
                <div>
                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-gray-800">{summary.total}</div>
                            <div className="text-sm text-gray-500">Active Onboardings</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-green-600">{summary.onTrack}</div>
                            <div className="text-sm text-gray-500">On Track</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-red-600">{summary.atRisk}</div>
                            <div className="text-sm text-gray-500">At Risk</div>
                        </div>
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                            <div className="text-2xl font-bold text-indigo-600">{summary.avgCompletion}%</div>
                            <div className="text-sm text-gray-500">Avg Completion</div>
                        </div>
                    </div>
                    
                    {/* Filter */}
                    <div className="flex gap-2 mb-4">
                        {['all', 'ontrack', 'atrisk', 'completed'].map(f => (
                            <button
                                key={f}
                                onClick={() => setFilterStatus(f)}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${
                                    filterStatus === f ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'
                                }`}
                            >
                                {f === 'all' ? 'All' : f === 'ontrack' ? 'On Track' : f === 'atrisk' ? 'At Risk' : 'Completed'}
                            </button>
                        ))}
                    </div>
                    
                    {/* Table */}
                    {filteredSchedules.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                            <div className="text-5xl mb-4">🎓</div>
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">No onboarding schedules yet</h3>
                            <p className="text-gray-500">Assign a template to a new hire to get started</p>
                        </div>
                    ) : (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <table className="w-full">
                                <thead className="bg-gray-50 border-b border-gray-100">

                                        <th className="text-left px-4 py-3 text-sm font-semibold text-gray-600">Employee</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredSchedules.map(schedule => {
                                        const progress = calculateProgress(schedule);

                                        return (
                                            <tr key={schedule.id} className="border-b border-gray-50 hover:bg-gray-50">

                                                </td>

                                                <td className="px-4 py-3">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-24 bg-gray-100 rounded-full h-2">
                                                            <div className="bg-indigo-600 h-2 rounded-full" style={{ width: `${progress}%` }}></div>
                                                        </div>
                                                        <span className="text-sm text-gray-600">{progress}%</span>
                                                    </div>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className={`text-xs px-2 py-1 rounded-full font-medium ${status.color}`}>
                                                        {status.icon} {status.label}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <div className="flex gap-2">
                                                        <button
                                                            onClick={() => onViewSchedule(schedule)}

                                                        <button

                                                            title="Unassign"
                                                        >
                                                            <Icons.Trash className="w-4 h-4" /> Unassign
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}

                            </table>

        }
