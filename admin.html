        // ============================================
        // CSV IMPORT MODAL (Education Tracker)
        // ============================================
        function CSVImportModal({ onClose, onImported, showToast }) {
            const [fileName, setFileName] = useState('');
            const [parsedRows, setParsedRows] = useState([]); // [{ title, host, websiteLink, estTimeToComplete, category }]
            const [importing, setImporting] = useState(false);
            const [error, setError] = useState('');
            
            // Convert any cell value to a trimmed string (handles booleans/numbers from xlsx)
            const cellToString = (val) => {
                if (val === null || val === undefined) return '';
                return String(val).trim();
            };
            
            const processRows = (rows) => {
                if (rows.length < 2) {
                    setError('File appears to be empty or has no data rows');
                    return;
                }
                const headers = rows[0].map(h => cellToString(h));
                const map = mapEducationCSVHeaders(headers);
                console.log('Detected headers:', headers);
                console.log('Header map:', map);
                
                if (map.title === undefined) {
                    setError(`Could not find a "Course or Workshop Title" column. Detected headers: ${headers.map(h => `"${h}"`).join(', ')}`);
                    return;
                }
                
                let currentCategory = '';
                const courses = [];
                
                rows.slice(1).forEach(row => {
                    const title = cellToString(row[map.title]);
                    if (!title) return;
                    
                    // Detect "category divider" rows: title present but every other mapped
                    // column is empty (e.g. "Orientation - First 3 days")
                    const otherFields = ['host', 'websiteLink', 'estTime', 'completedDate', 'completedCheckbox']
                        .map(key => map[key] !== undefined ? cellToString(row[map[key]]) : '')
                        .filter(v => v !== '');
                    
                    if (otherFields.length === 0) {
                        currentCategory = title;
                        return; // don't add as a course
                    }
                    
                    courses.push({
                        title,
                        host: map.host !== undefined ? cellToString(row[map.host]) : '',
                        websiteLink: map.websiteLink !== undefined ? cellToString(row[map.websiteLink]) : '',
                        estTimeToComplete: map.estTime !== undefined ? cellToString(row[map.estTime]) : '',
                        category: currentCategory
                    });
                });
                
                if (courses.length === 0) {
                    setError('No course rows found (only category headers detected). Please check your file.');
                    return;
                }
                
                setParsedRows(courses);
            };
            
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name);
                setError('');
                setParsedRows([]);
                
                const isExcel = /\.(xlsx|xls)$/i.test(file.name);
                
                if (isExcel) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                            console.log('Parsed XLSX rows:', rows.slice(0, 5));
                            processRows(rows);
                        } catch (err) {
                            console.error(err);
                            setError('Failed to parse Excel file: ' + err.message);
                        }
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const text = evt.target.result;
                            const rows = parseCSV(text);
                            console.log('Parsed CSV rows:', rows.slice(0, 5));
                            processRows(rows);
                        } catch (err) {
                            setError('Failed to parse CSV: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };
            
            const handleImport = async () => {
                if (parsedRows.length === 0) return;
                setImporting(true);
                try {
                    const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                    
                    let imported = 0;
                    for (const course of parsedRows) {
                        const id = `course_${course.title.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 50)}_${Date.now()}_${imported}`;
                        
                        await setDoc(doc(db, 'education_courses', id), {
                            title: course.title,
                            host: course.host,
                            websiteLink: course.websiteLink,
                            estTimeToComplete: course.estTimeToComplete,
                            category: course.category,
                            recurringAnnual: false,
                            isActive: true,
                            createdAt: serverTimestamp(),
                            updatedAt: serverTimestamp()
                        });
                        imported++;
                    }
                    
                    showToast(`✅ Imported ${imported} course${imported !== 1 ? 's' : ''} into the catalog!`);
                    onImported();
                } catch (err) {
                    console.error('Error importing file:', err);
                    showToast('Failed to import: ' + err.message, 'error');
                } finally {
                    setImporting(false);
                }
            };
            
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center z-10">
                            <h2 className="text-xl font-bold text-gray-800">📤 Import Education Tracker</h2>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                        </div>
                        
                        <div className="p-6 space-y-4">
                            <div className="bg-indigo-50 rounded-lg p-4 text-sm text-indigo-700">
                                <p className="font-semibold mb-1">Supports .xlsx and .csv files. Expected columns (flexible matching):</p>
                                <p>Course/Workshop Title, Completed, Month/Year Completed, Est. Time to Complete, Host, Website Link</p>
                                <p className="mt-2 text-indigo-600">Rows that look like section headers (e.g. "Orientation - First 3 days") are detected automatically and used as a category label rather than imported as courses.</p>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Select file (.xlsx or .csv)</label>
                                <input
                                    type="file"
                                    accept=".csv,.xlsx,.xls"
                                    onChange={handleFileChange}
                                    className="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                />
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 border border-red-100 rounded-lg p-3 text-sm text-red-700">
                                    {error}
                                </div>
                            )}
                            
                            {parsedRows.length > 0 && (
                                <div>
                                    <h3 className="font-bold text-gray-800 mb-2">
                                        Preview ({parsedRows.length} course{parsedRows.length !== 1 ? 's' : ''} found)
                                    </h3>
                                    <div className="border border-gray-200 rounded-lg max-h-64 overflow-y-auto">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-50 sticky top-0">
                                                <tr>
                                                    <th className="text-left px-3 py-2 font-semibold text-gray-600">Title</th>
                                                    <th className="text-left px-3 py-2 font-semibold text-gray-600">Category</th>
                                                    <th className="text-left px-3 py-2 font-semibold text-gray-600">Host</th>
                                                    <th className="text-left px-3 py-2 font-semibold text-gray-600">Est. Time</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {parsedRows.slice(0, 50).map((course, i) => (
                                                    <tr key={i} className="border-t border-gray-100">
                                                        <td className="px-3 py-2 text-gray-800">{course.title}</td>
                                                        <td className="px-3 py-2 text-gray-500">{course.category || '—'}</td>
                                                        <td className="px-3 py-2 text-gray-500">{course.host || '—'}</td>
                                                        <td className="px-3 py-2 text-gray-500">{course.estTimeToComplete || '—'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    {parsedRows.length > 50 && (
                                        <p className="text-xs text-gray-400 mt-1">Showing first 50 of {parsedRows.length} rows</p>
                                    )}
                                </div>
                            )}
                        </div>
                        
                        <div className="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex justify-end gap-3">
                            <button
                                onClick={onClose}
                                className="px-6 py-2 border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition"
                            >
                                Cancel
                            </button>
                            <button
                                onClick={handleImport}
                                disabled={importing || parsedRows.length === 0}
                                className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold disabled:opacity-50"
                            >
                                {importing ? 'Importing...' : `Import ${parsedRows.length} Course${parsedRows.length !== 1 ? 's' : ''}`}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        // ============================================
        // SPECIALTIES MANAGEMENT (admin-managed role/specialty list)
        // ============================================
        const DEFAULT_SPECIALTIES = [
            'MOA', 'Nurse', 'LPN', 'FrontDesk', 'Admin', 'Manager',
            'BHC', 'Social Work', 'CHN', 'Dietitian', 'ES', 'Health Informatics',
            'Medical Home', 'CDM Nurse', 'RIC LPN', 'SCH', 'Pharmacy', 'Specialist Nav'
        ];
        
        function SpecialtiesManagement({ showToast }) {
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newSpecialtyName, setNewSpecialtyName] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editingName, setEditingName] = useState('');
            const [migrating, setMigrating] = useState(false);
            const [migrationLog, setMigrationLog] = useState([]);
            const [showMigration, setShowMigration] = useState(false);
            
            useEffect(() => {
                loadSpecialties();
            }, []);
            
            const loadSpecialties = async () => {
                setLoading(true);
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'specialties'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                    setSpecialties(data);
                } catch (err) {
                    console.error('Error loading specialties:', err);
                    setSpecialties([]);
                } finally {
                    setLoading(false);
                }
            };
            
            const seedDefaults = async () => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    for (const name of DEFAULT_SPECIALTIES) {
                        const id = `specialty_${name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}`;
                        await setDoc(doc(db, 'specialties', id), {
                            name,
                            isActive: true,
                            createdAt: serverTimestamp()
                        }, { merge: true });
                    }
                    showToast(`✅ Seeded ${DEFAULT_SPECIALTIES.length} default specialties!`);
                    loadSpecialties();
                } catch (err) {
                    console.error('Error seeding specialties:', err);
                    showToast('Failed to seed specialties: ' + err.message, 'error');
                }
            };
            
            const addSpecialty = async () => {
                const name = newSpecialtyName.trim();
                if (!name) return;
                if (specialties.some(s => s.name.toLowerCase() === name.toLowerCase())) {
                    showToast('That specialty already exists', 'error');
                    return;
                }
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = `specialty_${name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_${Date.now()}`;
                    await setDoc(doc(db, 'specialties', id), {
                        name,
                        isActive: true,
                        createdAt: serverTimestamp()
                    });
                    setNewSpecialtyName('');
                    showToast(`✅ Added "${name}"`);
                    loadSpecialties();
                } catch (err) {
                    console.error('Error adding specialty:', err);
                    showToast('Failed to add specialty: ' + err.message, 'error');
                }
            };
            
            const saveEdit = async (id) => {
                const name = editingName.trim();
                if (!name) return;
                const { doc, updateDoc } = window.firebaseModules;
                try {
                    await updateDoc(doc(db, 'specialties', id), { name });
                    setEditingId(null);
                    showToast('✅ Specialty updated');
                    loadSpecialties();
                } catch (err) {
                    console.error('Error updating specialty:', err);
                    showToast('Failed to update specialty: ' + err.message, 'error');
                }
            };
            
            const toggleActive = async (specialty) => {
                const { doc, updateDoc } = window.firebaseModules;
                try {
                    await updateDoc(doc(db, 'specialties', specialty.id), { isActive: !specialty.isActive });
                    loadSpecialties();
                } catch (err) {
                    console.error('Error toggling specialty:', err);
                    showToast('Failed to update specialty', 'error');
                }
            };
            
            const deleteSpecialty = async (id) => {
                if (!confirm('Delete this specialty? Existing assignments referencing it will keep the old name as plain text but it will no longer appear in selection lists.')) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'specialties', id));
                    showToast('🗑️ Specialty deleted');
                    loadSpecialties();
                } catch (err) {
                    console.error('Error deleting specialty:', err);
                    showToast('Failed to delete specialty', 'error');
                }
            };
            
            // ============================================
            // ONE-TIME MIGRATION: single specialty/position string -> specialties array
            // Idempotent - safe to run multiple times, skips already-migrated docs
            // ============================================
            const runMigration = async () => {
                if (!confirm('Run migration? This will add a new "specialties" array field to Users, Calendar Templates, Schedules, and Continuing Education assignments based on their existing single value. Existing fields are kept (not deleted) for safety.')) return;
                
                setMigrating(true);
                const log = [];
                const { collection, getDocs, doc, updateDoc } = window.firebaseModules;
                
                // Helper: find the canonical specialty name (case-insensitive match against our list),
                // falling back to the raw stored value if no match found (so nothing gets silently dropped)
                const resolveSpecialtyName = (rawValue) => {
                    if (!rawValue) return null;
                    const match = specialties.find(s => s.name.toLowerCase() === rawValue.toLowerCase());
                    return match ? match.name : rawValue;
                };
                
                try {
                    // 1. Users: specialty (string) -> specialties (array)
                    const usersSnap = await getDocs(collection(db, 'users'));
                    let usersMigrated = 0;
                    for (const userDoc of usersSnap.docs) {
                        const data = userDoc.data();
                        if (data.specialties && Array.isArray(data.specialties)) continue; // already migrated
                        if (!data.specialty) continue; // nothing to migrate
                        const resolved = resolveSpecialtyName(data.specialty);
                        await updateDoc(doc(db, 'users', userDoc.id), { specialties: [resolved] });
                        usersMigrated++;
                    }
                    log.push(`✅ Users: migrated ${usersMigrated} of ${usersSnap.size}`);
                    
                    // 2. Calendar Templates: position (string) -> specialties (array)
                    const templatesSnap = await getDocs(collection(db, 'healthcare_templates'));
                    let templatesMigrated = 0;
                    for (const tDoc of templatesSnap.docs) {
                        const data = tDoc.data();
                        if (data.specialties && Array.isArray(data.specialties)) continue;
                        if (!data.position) continue;
                        const resolved = resolveSpecialtyName(data.position);
                        await updateDoc(doc(db, 'healthcare_templates', tDoc.id), { specialties: [resolved] });
                        templatesMigrated++;
                    }
                    log.push(`✅ Calendar Templates: migrated ${templatesMigrated} of ${templatesSnap.size}`);
                    
                    // 3. Healthcare Schedules: position (string) -> specialties (array)
                    const schedulesSnap = await getDocs(collection(db, 'healthcare_schedules'));
                    let schedulesMigrated = 0;
                    for (const sDoc of schedulesSnap.docs) {
                        const data = sDoc.data();
                        if (data.specialties && Array.isArray(data.specialties)) continue;
                        if (!data.position) continue;
                        const resolved = resolveSpecialtyName(data.position);
                        await updateDoc(doc(db, 'healthcare_schedules', sDoc.id), { specialties: [resolved] });
                        schedulesMigrated++;
                    }
                    log.push(`✅ Schedules: migrated ${schedulesMigrated} of ${schedulesSnap.size}`);
                    
                    // 4. Education Assignments: position (string, assignType='position') -> specialties (array)
                    const assignSnap = await getDocs(collection(db, 'education_assignments'));
                    let assignMigrated = 0;
                    for (const aDoc of assignSnap.docs) {
                        const data = aDoc.data();
                        if (data.specialties && Array.isArray(data.specialties)) continue;
                        if (data.assignType !== 'position' || !data.position) continue;
                        const resolved = resolveSpecialtyName(data.position);
                        await updateDoc(doc(db, 'education_assignments', aDoc.id), { specialties: [resolved] });
                        assignMigrated++;
                    }
                    log.push(`✅ Continuing Education Assignments: migrated ${assignMigrated} of ${assignSnap.size}`);
                    
                    log.push('🎉 Migration complete!');
                    showToast('✅ Migration complete!');
                } catch (err) {
                    console.error('Migration error:', err);
                    log.push(`❌ Error: ${err.message}`);
                    showToast('Migration encountered an error - see log', 'error');
                } finally {
                    setMigrationLog(log);
                    setMigrating(false);
                }
            };
            
            if (loading) {
                return (
                    <div className="p-8 flex items-center justify-center min-h-screen">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading specialties...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="p-8 max-w-3xl">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-800">🏷️ Specialties</h1>
                            <p className="text-gray-500 mt-1">Manage the list of roles/specialties used across Users, Calendar Templates, and Continuing Education</p>
                        </div>
                        <button
                            onClick={() => setShowMigration(!showMigration)}
                            className="px-4 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg hover:bg-amber-100 transition text-sm font-medium"
                        >
                            ⚙️ Migration Tool
                        </button>
                    </div>
                    
                    {showMigration && (
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 mb-6">
                            <h3 className="font-bold text-amber-800 mb-2">One-Time Data Migration</h3>
                            <p className="text-sm text-amber-700 mb-3">
                                Converts existing single specialty/position values (Users, Calendar Templates, Schedules, Continuing Education) 
                                into the new multi-select "specialties" array format. Safe to run multiple times — already-migrated 
                                records are skipped automatically. Old fields are preserved, nothing is deleted.
                            </p>
                            <p className="text-sm text-amber-700 mb-3 font-medium">
                                Run this only after seeding/reviewing your specialty list below, so names match correctly.
                            </p>
                            <button
                                onClick={runMigration}
                                disabled={migrating}
                                className="px-5 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition font-semibold disabled:opacity-50"
                            >
                                {migrating ? 'Running migration...' : 'Run Migration Now'}
                            </button>
                            
                            {migrationLog.length > 0 && (
                                <div className="mt-4 bg-white rounded-lg p-3 text-sm font-mono space-y-1">
                                    {migrationLog.map((line, i) => <div key={i}>{line}</div>)}
                                </div>
                            )}
                        </div>
                    )}
                    
                    {specialties.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                            <div className="text-5xl mb-4">🏷️</div>
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">No specialties defined yet</h3>
                            <p className="text-gray-500 mb-4">Start with the default healthcare specialty list, or add your own</p>
                            <button
                                onClick={seedDefaults}
                                className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold"
                            >
                                Seed Default Specialties ({DEFAULT_SPECIALTIES.length})
                            </button>
                        </div>
                    ) : (
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="divide-y divide-gray-50">
                                {specialties.map(specialty => (
                                    <div key={specialty.id} className="flex items-center justify-between px-5 py-3">
                                        {editingId === specialty.id ? (
                                            <input
                                                type="text"
                                                value={editingName}
                                                onChange={e => setEditingName(e.target.value)}
                                                onKeyDown={e => e.key === 'Enter' && saveEdit(specialty.id)}
                                                autoFocus
                                                className="flex-1 px-3 py-1.5 border border-indigo-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none mr-3"
                                            />
                                        ) : (
                                            <span className={`text-sm font-medium ${specialty.isActive ? 'text-gray-800' : 'text-gray-400 line-through'}`}>
                                                {specialty.name}
                                            </span>
                                        )}
                                        <div className="flex gap-2">
                                            {editingId === specialty.id ? (
                                                <button onClick={() => saveEdit(specialty.id)} className="text-green-600 hover:text-green-800 text-sm font-medium">
                                                    Save
                                                </button>
                                            ) : (
                                                <>
                                                    <button
                                                        onClick={() => toggleActive(specialty)}
                                                        className="text-xs px-2 py-1 rounded-full font-medium transition"
                                                        style={{

        // ============================================
        // CONTINUING EDUCATION - MAIN COMPONENT
        // ============================================
        function ContinuingEducation({ showToast }) {
            const [view, setView] = useState('library'); // library, assignments, progress
            const [courses, setCourses] = useState([]);
            const [users, setUsers] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [progress, setProgress] = useState([]);
            const [specialtyOptions, setSpecialtyOptions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editingCourse, setEditingCourse] = useState(null);
            const [showImportModal, setShowImportModal] = useState(false);
            const [showAssignModal, setShowAssignModal] = useState(false);
            
            useEffect(() => {
                loadAll();
            }, []);
            
            const loadAll = async () => {
                setLoading(true);
                await Promise.all([loadCourses(), loadUsers(), loadAssignments(), loadProgress(), loadSpecialtyOptions()]);
                setLoading(false);
            };
            
            const loadSpecialtyOptions = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'specialties'));
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const activeNames = data.filter(s => s.isActive !== false).map(s => s.name).sort();
                    setSpecialtyOptions(activeNames.length > 0 ? activeNames : HEALTHCARE_POSITIONS.map(p => p.value));
                } catch (err) {
                    console.error('Error loading specialties:', err);
                    setSpecialtyOptions(HEALTHCARE_POSITIONS.map(p => p.value));
                }
            };
            
            const loadCourses = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'education_courses'));
                    setCourses(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (err) {
                    console.error('Error loading courses:', err);
                    setCourses([]);
                }
            };
            
            const loadUsers = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'users'));
                    setUsers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (err) {
                    console.error('Error loading users:', err);
                    setUsers([]);
                }
            };
            
            const loadAssignments = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'education_assignments'));
                    setAssignments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (err) {
                    console.error('Error loading assignments:', err);
                    setAssignments([]);
                }
            };
            
            const loadProgress = async () => {
                try {
                    const { collection, getDocs } = window.firebaseModules;
                    const snapshot = await getDocs(collection(db, 'education_progress'));
                    setProgress(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (err) {
                    console.error('Error loading progress:', err);
                    setProgress([]);
                }
            };
            
            const saveCourse = async (courseData) => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = courseData.id || `course_${Date.now()}`;
                    const dataToSave = { ...courseData };
                    delete dataToSave.id;
                    dataToSave.updatedAt = serverTimestamp();
                    if (!courseData.id) dataToSave.createdAt = serverTimestamp();
                    
                    await setDoc(doc(db, 'education_courses', id), dataToSave, { merge: true });
                    showToast(courseData.id ? '✅ Course updated!' : '✅ Course added!');
                    setEditingCourse(null);
                    loadCourses();
                } catch (err) {
                    console.error('Error saving course:', err);
                    showToast('Failed to save course: ' + err.message, 'error');
                }
            };
            
            const deleteCourse = async (courseId) => {
                if (!confirm('Delete this course from the catalog? This cannot be undone.')) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'education_courses', courseId));
                    showToast('🗑️ Course deleted');
                    loadCourses();
                } catch (err) {
                    console.error('Error deleting course:', err);
                    showToast('Failed to delete course', 'error');
                }
            };
            
            const createNewCourse = () => {
                setEditingCourse({
                    id: null,
                    title: '',
                    host: '',
                    websiteLink: '',
                    estTimeToComplete: '',
                    category: '',
                    recurringAnnual: false,
                    isActive: true
                });
            };
            
            if (loading) {
                return (
                    <div className="p-8 flex items-center justify-center min-h-screen">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading continuing education...</p>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-800">📚 Continuing Education</h1>
                            <p className="text-gray-500 mt-1">Course catalog, assignments & staff progress tracking</p>
                        </div>
                        <div className="flex gap-2">
                            {view === 'library' && (
                                <>
                                    <button
                                        onClick={() => setShowImportModal(true)}
                                        className="flex items-center gap-2 px-4 py-3 bg-white border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 transition font-medium"
                                    >
                                        <Icons.Upload className="w-5 h-5" />
                                        Import CSV
                                    </button>
                                    <button
                                        onClick={createNewCourse}
                                        className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700 transition font-semibold"
                                    >
                                        <Icons.Plus className="w-5 h-5" />
                                        Add Course
                                    </button>
                                </>
                            )}
                            {view === 'progress' && (
                                <button
                                    onClick={() => setShowAssignModal(true)}
                                    className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-lg hover:from-green-600 hover:to-emerald-700 transition font-semibold"
                                >
                                    <Icons.Plus className="w-5 h-5" />
                                    Assign Courses
                                </button>
                            )}
                        </div>
                    </div>
                    
                    {/* Tab Switcher */}
                    <div className="flex gap-2 mb-6 border-b border-gray-200">
                        <button
                            onClick={() => setView('library')}
                            className={`px-6 py-3 font-semibold transition border-b-2 ${
                                view === 'library' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'
                            }`}
                        >
                            Course Library ({courses.length})
                        </button>
                        <button
                            onClick={() => setView('assignments')}
                            className={`px-6 py-3 font-semibold transition border-b-2 ${
                                view === 'assignments' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'
                            }`}
                        >
                            Required Courses ({assignments.length})
                        </button>
                        <button
                            onClick={() => setView('progress')}
                            className={`px-6 py-3 font-semibold transition border-b-2 ${
                                view === 'progress' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'
                            }`}
                        >
                            Staff Progress
                        </button>
                    </div>
                    
                    {view === 'library' && (
                        <CourseLibraryTab 
                            courses={courses} 
                            onEdit={setEditingCourse}
                            onDelete={deleteCourse}
                            onCreateNew={createNewCourse}
                        />
                    )}
                    
                    {view === 'assignments' && (
                        <RequiredCoursesTab
                            courses={courses}
                            assignments={assignments}
                            users={users}
                            specialtyOptions={specialtyOptions}
                            showToast={showToast}
                            onRefresh={loadAssignments}
                        />
                    )}
                    
                    {view === 'progress' && (
                        <StaffProgressTab
                            courses={courses}
                            users={users}
                            assignments={assignments}
                            progress={progress}
                            specialtyOptions={specialtyOptions}
                            showToast={showToast}
                            onRefresh={loadProgress}
                        />
                    )}
                    
                    {editingCourse && (
                        <CourseEditorModal
                            course={editingCourse}
                            onSave={saveCourse}
                            onClose={() => setEditingCourse(null)}
                        />
                    )}
                    
                    {showImportModal && (
                        <CSVImportModal
                            onClose={() => setShowImportModal(false)}
                            onImported={() => { setShowImportModal(false); loadCourses(); }}
                            showToast={showToast}
                        />
                    )}
                    
                    {showAssignModal && (
                        <AssignCoursesModal
                            courses={courses}
                            users={users}
                            specialtyOptions={specialtyOptions}
                            onClose={() => setShowAssignModal(false)}
                            onAssigned={() => { setShowAssignModal(false); loadAssignments(); }}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }
        
        // ============================================
        // COURSE LIBRARY TAB
        // ============================================

                return (

        // ============================================
        // REQUIRED COURSES TAB (Position & Individual Assignments)
        // ============================================
        function RequiredCoursesTab({ courses, assignments, users, specialtyOptions, showToast, onRefresh }) {
            const [showModal, setShowModal] = useState(false);
            const [searchTarget, setSearchTarget] = useState(''); // searches specialty name or person name
            const [searchCourse, setSearchCourse] = useState('');
            const [filterType, setFilterType] = useState('all'); // all | specialty | individual
            const [visibleCount, setVisibleCount] = useState(20);
            
            // Remove just one specialty from a position-assignment (deletes the whole doc only if it was the last one)
            const removeSpecialtyFromAssignment = async (assignment, specialtyName) => {
                if (!confirm(`Remove "${specialtyName}" from this required course?`)) return;
                const { doc, deleteDoc, updateDoc } = window.firebaseModules;
                try {
                    const remaining = (assignment.specialties || []).filter(s => s !== specialtyName);
                    if (remaining.length === 0) {
                        await deleteDoc(doc(db, 'education_assignments', assignment.id));
                    } else {
                        await updateDoc(doc(db, 'education_assignments', assignment.id), { specialties: remaining });
                    }
                    showToast('🗑️ Removed');
                    onRefresh();
                } catch (err) {
                    console.error('Error removing specialty from assignment:', err);
                    showToast('Failed to remove: ' + err.message, 'error');
                }
            };
            
            const removeIndividualAssignment = async (assignmentId) => {
                if (!confirm('Remove this required course assignment?')) return;
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'education_assignments', assignmentId));
                    showToast('🗑️ Assignment removed');
                    onRefresh();
                } catch (err) {
                    console.error('Error removing assignment:', err);
                    showToast('Failed to remove assignment', 'error');
                }
            };
            
            // Flatten assignments into one row per (specialty or person) + course pair
            const rows = [];
            assignments.forEach(a => {
                if (a.assignType === 'position') {
                    (a.specialties || []).forEach(specialtyName => {
                        rows.push({
                            key: `${a.id}_${specialtyName}`,
                            type: 'specialty',
                            targetName: specialtyName,
                            courseName: a.courseName,
                            recurringAnnual: a.recurringAnnual,
                            onRemove: () => removeSpecialtyFromAssignment(a, specialtyName)
                        });
                    });
                } else {
                    rows.push({
                        key: a.id,
                        type: 'individual',
                        targetName: a.userName,
                        courseName: a.courseName,
                        recurringAnnual: a.recurringAnnual,
                        onRemove: () => removeIndividualAssignment(a.id)
                    });
                }
            });
            
            const filteredRows = rows.filter(row => {
                if (filterType !== 'all' && row.type !== filterType) return false;
                if (searchTarget.trim() && !row.targetName.toLowerCase().includes(searchTarget.trim().toLowerCase())) return false;
                if (searchCourse.trim() && !row.courseName.toLowerCase().includes(searchCourse.trim().toLowerCase())) return false;
                return true;
            });
            
            const visibleRows = filteredRows.slice(0, visibleCount);
            
            return (
                <div className="space-y-4">
                    <div className="flex justify-end">
                        <button
                            onClick={() => setShowModal(true)}
                            className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-lg hover:from-indigo-600 hover:to-purple-700 transition font-semibold"
                        >
                            <Icons.Plus className="w-5 h-5" />
                            Make Course Required
                        </button>
                    </div>
                    
                    {assignments.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                            <div className="text-5xl mb-4">📋</div>
                            <h3 className="text-lg font-semibold text-gray-700 mb-2">No required courses set</h3>
                            <p className="text-gray-500 mb-4">Mark courses as required for specific specialties or individuals</p>
                            <button
                                onClick={() => setShowModal(true)}
                                className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-semibold"
                            >
                                Make Course Required
                            </button>
                        </div>
                    ) : (
                        <>
                            {/* Filters */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-wrap gap-3 items-center">
                                <input
                                    type="text"
                                    value={searchTarget}
                                    onChange={e => { setSearchTarget(e.target.value); setVisibleCount(20); }}
                                    placeholder="Search specialty or person name..."
                                    className="flex-1 min-w-[200px] px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                />
                                <input
                                    type="text"
                                    value={searchCourse}
                                    onChange={e => { setSearchCourse(e.target.value); setVisibleCount(20); }}
                                    placeholder="Search course name..."
                                    className="flex-1 min-w-[200px] px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                />
                                <div className="flex gap-2">
                                    {['all', 'specialty', 'individual'].map(t => (
                                        <button
                                            key={t}
                                            onClick={() => { setFilterType(t); setVisibleCount(20); }}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${
                                                filterType === t ? 'bg-indigo-600 text-white' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'
                                            }`}
                                        >
                                            {t === 'all' ? 'All' : t === 'specialty' ? 'By Specialty' : 'By Individual'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Unified Table */}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <table className="w-full">
                                    <thead className="bg-gray-50 border-b border-gray-100">
                                        <tr>
                                            <th className="text-left px-4 py-2 text-sm font-semibold text-gray-600">Type</th>
                                            <th className="text-left px-4 py-2 text-sm font-semibold text-gray-600">Specialty / Person</th>
                                            <th className="text-left px-4 py-2 text-sm font-semibold text-gray-600">Course</th>
                                            <th className="text-left px-4 py-2 text-sm font-semibold text-gray-600"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {visibleRows.length === 0 ? (
                                            <tr>
                                                <td colSpan="4" className="px-4 py-8 text-center text-sm text-gray-400">No matches found</td>
                                            </tr>
                                        ) : (
                                            visibleRows.map(row => (
                                                <tr key={row.key} className="border-b border-gray-50 last:border-b-0 hover:bg-gray-50">
                                                    <td className="px-4 py-2.5">
                                                        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
                                                            row.type === 'specialty' ? 'bg-indigo-100 text-indigo-700' : 'bg-purple-100 text-purple-700'
                                                        }`}>
                                                            {row.type === 'specialty' ? '👥 Specialty' : '👤 Individual'}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-2.5 text-sm text-gray-800 font-medium">{row.targetName}</td>
                                                    <td className="px-4 py-2.5 text-sm text-gray-600 flex items-center gap-1">
                                                        {row.recurringAnnual && <Icons.RefreshCw className="w-3 h-3 text-purple-500" title="Annual" />}
                                                        {row.courseName}
                                                    </td>
                                                    <td className="px-4 py-2.5 text-right">
                                                        <button onClick={row.onRemove} className="text-red-400 hover:text-red-600 text-xs font-medium">
                                                            ✕ Remove
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            
                            {filteredRows.length > visibleCount && (
                                <div className="text-center">
                                    <button
                                        onClick={() => setVisibleCount(c => c + 20)}
                                        className="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition text-sm font-medium"
                                    >
                                        Load more ({filteredRows.length - visibleCount} remaining)
                                    </button>
                                </div>
                            )}
                            
                            <p className="text-xs text-gray-400 text-center">
                                Showing {visibleRows.length} of {filteredRows.length} requirement{filteredRows.length !== 1 ? 's' : ''}
                                {filteredRows.length !== rows.length ? ` (filtered from ${rows.length} total)` : ''}
                            </p>
                        </>
                    )}
                    
                    {showModal && (
                        <AssignCoursesModal
                            courses={courses}
                            users={users}
                            specialtyOptions={specialtyOptions}
                            onClose={() => setShowModal(false)}
                            onAssigned={() => { setShowModal(false); onRefresh(); }}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }
        
        // ============================================
        // ASSIGN COURSES MODAL
        // ============================================
        function AssignCoursesModal({ courses, users, specialtyOptions, onClose, onAssigned, showToast }) {
            const [assignType, setAssignType] = useState('position'); // position | individual
            const [selectedCourseIds, setSelectedCourseIds] = useState([]);
            const [selectedSpecialties, setSelectedSpecialties] = useState([]);
            const [selectedUserId, setSelectedUserId] = useState('');
            const [saving, setSaving] = useState(false);
            
            const toggleCourse = (courseId) => {
                setSelectedCourseIds(prev => 
                    prev.includes(courseId) ? prev.filter(id => id !== courseId) : [...prev, courseId]
                );
            };

                    return;

                if (assignType === 'position' && selectedSpecialties.length === 0) {
                    alert('Please select at least one specialty');

                    const selectedUser = users.find(u => u.id === selectedUserId);
                    
                    for (const courseId of selectedCourseIds) {

                                            assignType === 'position'

                                                : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'

                                    >

                                        Specialties
