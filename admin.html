        // ============================================
        // QUIZ GAMES (MVP)
        // ============================================
        function QuizGames({ showToast }) {
            const [games, setGames] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newGame, setNewGame] = useState({
                name: '',
                duration: 'week',
                teamSize: 4,
                questionsPerRound: 10,
                rounds: 5
            });
            
            useEffect(() => {
                loadGames();
            }, []);
            
            const loadGames = async () => {
                const { collection, getDocs, query, orderBy } = window.firebaseModules;
                try {
                    const q = query(collection(db, 'quizGames'), orderBy('createdAt', 'desc'));
                    const querySnapshot = await getDocs(q);
                    const gamesData = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setGames(gamesData);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading games:', err);
                    setLoading(false);
                }
            };
            
            const createGame = async () => {
                if (!newGame.name.trim()) {
                    showToast('Please enter a game name', 'error');
                    return;
                }
                
                const { collection, addDoc, getDocs, query, where, serverTimestamp } = window.firebaseModules;
                
                try {
                    // Get all students
                    const usersRef = collection(db, 'users');
                    const q = query(usersRef, where('role', '==', 'student'));
                    const usersSnap = await getDocs(q);
                    const students = usersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (students.length < 2) {
                        showToast('Need at least 2 students to create a game', 'error');
                        return;
                    }
                    
                    // Auto-assign teams (simple random assignment for MVP)
                    const teamCount = Math.ceil(students.length / newGame.teamSize);
                    const shuffled = [...students].sort(() => Math.random() - 0.5);
                    const teams = [];
                    
                    const teamColors = [
                        { id: 'team_blue', name: 'Team Blue', color: '#3B82F6' },
                        { id: 'team_red', name: 'Team Red', color: '#EF4444' },
                        { id: 'team_green', name: 'Team Green', color: '#10B981' },
                        { id: 'team_yellow', name: 'Team Yellow', color: '#F59E0B' },
                        { id: 'team_purple', name: 'Team Purple', color: '#8B5CF6' }
                    ];
                    
                    for (let i = 0; i < teamCount && i < teamColors.length; i++) {
                        const teamPlayers = shuffled.slice(i * newGame.teamSize, (i + 1) * newGame.teamSize);
                        teams.push({
                            ...teamColors[i],
                            playerIds: teamPlayers.map(p => p.id),
                            totalPoints: 0,
                            roundScores: []
                        });
                    }
                    
                    // Create game
                    const endDate = new Date();
                    if (newGame.duration === 'week') {
                        endDate.setDate(endDate.getDate() + 7);
                    } else {
                        endDate.setMonth(endDate.getMonth() + 1);
                    }
                    
                    await addDoc(collection(db, 'quizGames'), {
                        name: newGame.name,
                        status: 'active',
                        startDate: serverTimestamp(),
                        endDate: endDate,
                        gameMode: 'async',
                        rounds: newGame.rounds,
                        questionsPerRound: newGame.questionsPerRound,
                        timePerQuestion: 20,
                        teams: teams,
                        createdAt: serverTimestamp()
                    });
                    
                    showToast('🎮 Quiz game created successfully!');
                    setShowCreateModal(false);
                    setNewGame({
                        name: '',
                        duration: 'week',
                        teamSize: 4,
                        questionsPerRound: 10,
                        rounds: 5
                    });
                    loadGames();
                } catch (err) {
                    console.error('Error creating game:', err);
                    showToast('Error creating game: ' + err.message, 'error');
                }
            };
            
            const deleteGame = async (gameId) => {
                if (!confirm('Are you sure you want to delete this game?')) return;
                
                const { doc, deleteDoc } = window.firebaseModules;
                try {
                    await deleteDoc(doc(db, 'quizGames', gameId));
                    showToast('Game deleted');
                    loadGames();
                } catch (err) {
                    showToast('Error deleting game: ' + err.message, 'error');
                }
            };
            
            if (loading) {
                return <div className="p-8">Loading...</div>;
            }
            
            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">🎮 Quiz Games</h1>
                        <button
                            onClick={() => setShowCreateModal(true)}
                            className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-semibold rounded-lg transition shadow-lg"
                        >
                            <span className="text-xl">+</span>
                            Create New Game
                        </button>
                    </div>
                    
                    {games.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-lg p-12 text-center">
                            <div className="text-6xl mb-4">🎮</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">No Quiz Games Yet</h2>
                            <p className="text-gray-600 mb-6">Create your first team-based quiz battle to engage your staff!</p>
                            <button
                                onClick={() => setShowCreateModal(true)}
                                className="px-8 py-3 bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-pink-700 transition"
                            >
                                Create First Game
                            </button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {games.map(game => (
                                <div key={game.id} className="bg-white rounded-xl shadow-lg overflow-hidden">
                                    <div className="bg-gradient-to-r from-purple-500 to-pink-600 p-4">
                                        <h3 className="text-xl font-bold text-white">{game.name}</h3>
                                        <p className="text-white text-opacity-90 text-sm">
                                            {game.teams?.length || 0} teams • {game.rounds} rounds
                                        </p>
                                    </div>
                                    <div className="p-4">
                                        <div className="mb-4">
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                game.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                                            }`}>
                                                {game.status === 'active' ? '🔥 Active' : '✓ Completed'}
                                            </span>
                                        </div>
                                        
                                        <div className="space-y-2 mb-4">
                                            {game.teams?.slice(0, 3).map((team, i) => (
                                                <div key={team.id} className="flex items-center justify-between text-sm">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-3 h-3 rounded-full" style={{ backgroundColor: team.color }}></div>
                                                        <span className="font-medium">{team.name}</span>
                                                    </div>
                                                    <span className="text-gray-600">{team.totalPoints} pts</span>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <button
                                            onClick={() => deleteGame(game.id)}
                                            className="w-full px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition text-sm font-semibold"
                                        >
                                            Delete Game
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    {/* Create Game Modal */}
                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
                                <h2 className="text-2xl font-bold text-gray-800 mb-6">🎮 Create Quiz Game</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Game Name <span className="text-red-500">*</span>
                                        </label>
                                        <input

        // SCHEDULES LIST (Analytics view for assigned onboardings)
        // ============================================
        function SchedulesList({ schedules, templates, onViewSchedule, onRefresh, showToast }) {
            const [filterStatus, setFilterStatus] = useState('all');
            
            const calculateProgress = (schedule) => {
                const total = schedule.items.length;
                const completed = schedule.items.filter(item => item.scheduleItemStatus === 'completed').length;
                return total > 0 ? Math.round((completed / total) * 100) : 0;
            };
            
            const getStatus = (schedule) => {
                const progress = calculateProgress(schedule);
                const today = new Date().toISOString().split('T')[0];
                const isOverdue = schedule.endDate < today && progress < 100;
                
                if (progress === 100) return { label: 'Completed', color: 'bg-gray-100 text-gray-600', icon: '✅' };
                if (isOverdue) return { label: 'At Risk', color: 'bg-red-100 text-red-700', icon: '⚠️' };
                
                // Check if on track: compare expected progress vs actual
                const startD = new Date(schedule.startDate + 'T00:00:00');
                const todayD = new Date();
                const endD = new Date(schedule.endDate + 'T00:00:00');
                const totalDuration = Math.max(1, (endD - startD) / (1000 * 60 * 60 * 24));
                const elapsed = Math.max(0, (todayD - startD) / (1000 * 60 * 60 * 24));
                const expectedProgress = Math.min(100, Math.round((elapsed / totalDuration) * 100));
                
                if (progress >= expectedProgress) return { label: 'On Track', color: 'bg-green-100 text-green-700', icon: '✅' };
                return { label: 'Behind', color: 'bg-yellow-100 text-yellow-700', icon: '⏳' };
            };
            
            const filteredSchedules = filterStatus === 'all' 
                ? schedules 
                : schedules.filter(s => {
                    const status = getStatus(s);
                    if (filterStatus === 'completed') return status.label === 'Completed';
                    if (filterStatus === 'atrisk') return status.label === 'At Risk';
                    if (filterStatus === 'ontrack') return status.label === 'On Track' || status.label === 'Behind';
                    return true;
                });
            
            const summary = {
                total: schedules.length,
                onTrack: schedules.filter(s => ['On Track', 'Completed'].includes(getStatus(s).label)).length,
                atRisk: schedules.filter(s => getStatus(s).label === 'At Risk').length,
                avgCompletion: schedules.length > 0 
                    ? Math.round(schedules.reduce((sum, s) => sum + calculateProgress(s), 0) / schedules.length) 
                    : 0
            };
            
            return (
                <div>
                    {/* Summary Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">

                            <div className="text-2xl font-bold text-indigo-600">{summary.avgCompletion}%</div>
                            <div className="text-sm text-gray-500">Avg Completion</div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-4">

                            </button>
                        ))}
                    </div>
                    
                    {/* Table */}
                    {filteredSchedules.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-sm p-12 text-center">

                    // Load published journeys to get total steps
                    const journeysSnapshot = await getDocs(
                        query(collection(db, 'journeys'), where('status', '==', 'published'))
                    );
                    const publishedJourneys = journeysSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Calculate total steps across all published journeys
                    const totalSteps = publishedJourneys.reduce((sum, j) => sum + (j.stepIds?.length || 0), 0);
                    
                    // Calculate metrics
                    const totalUsers = new Set(allProgress.map(p => p.userId)).size;
                    
                    // Count completed journeys (100% completion)
                    const completedJourneys = allProgress.filter(p => {
                        const completed = p.completedStepIds?.length || 0;
                        const total = p.totalSteps || 0;
                        return total > 0 && completed >= total;
                    }).length;
                    
                    // Calculate average completion percentage across all users
                    let avgCompletionPercent = 0;
                    if (allProgress.length > 0) {
                        const totalPercentage = allProgress.reduce((sum, p) => {
                            const completed = p.completedStepIds?.length || 0;
                            const total = p.totalSteps || 0;
                            const percentage = total > 0 ? (completed / total * 100) : 0;
                            return sum + percentage;
                        }, 0);
                        avgCompletionPercent = totalPercentage / allProgress.length;
                    }
                    
                    console.log('Analytics calculated:', {
                        totalUsers,
                        completedJourneys,
                        avgCompletionPercent,
                        totalSteps,
                        publishedJourneys: publishedJourneys.length
                    });
                    
                    setAnalytics({
                        totalUsers,
                        completedJourneys,
                        avgCompletionPercent,
                        inProgressJourneys: allProgress.filter(p => {
                            const completed = p.completedStepIds?.length || 0;
                            const total = p.totalSteps || 0;
                            return total > 0 && completed < total;
                        }).length,
                        totalSteps,
                        publishedJourneys: publishedJourneys.length
                    });
                    setLoading(false);
                } catch (error) {
                    console.error('Error loading analytics:', error);
                    setLoading(false);
                }
            };
            
            if (loading) return <div className="p-8">Loading analytics...</div>;
            
            return (
                <div className="p-8">
                    <h1 className="text-3xl font-bold text-gray-800 mb-8">📈 Analytics Dashboard</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-blue-500">
                            <div className="text-sm text-gray-600 mb-1">Active Learners</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.totalUsers}</div>
                            <div className="text-xs text-gray-500 mt-2">Total users in system</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-indigo-500">
                            <div className="text-sm text-gray-600 mb-1">Published Journeys</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.publishedJourneys}</div>
                            <div className="text-xs text-gray-500 mt-2">Active training content</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-500">
                            <div className="text-sm text-gray-600 mb-1">Completed Journeys</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.completedJourneys}</div>
                            <div className="text-xs text-green-600 mt-2">✓ 100% complete</div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-yellow-500">
                            <div className="text-sm text-gray-600 mb-1">In Progress</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.inProgressJourneys}</div>
                            <div className="text-xs text-yellow-600 mt-2">Currently learning</div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-purple-500">
                            <div className="text-sm text-gray-600 mb-1">Avg. Completion</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.avgCompletionPercent.toFixed(1)}%</div>
                            <div className="text-xs text-gray-500 mt-2">Average progress across all users</div>
                            <div className="mt-3 text-xs">
                                {analytics.avgCompletionPercent < 25 && <span className="text-red-600">⚠️ Low engagement - review content</span>}
                                {analytics.avgCompletionPercent >= 25 && analytics.avgCompletionPercent < 50 && <span className="text-yellow-600">⚡ Fair - room for improvement</span>}
                                {analytics.avgCompletionPercent >= 50 && analytics.avgCompletionPercent < 75 && <span className="text-blue-600">👍 Good engagement</span>}
                                {analytics.avgCompletionPercent >= 75 && <span className="text-green-600">🎉 Excellent engagement!</span>}
                            </div>
                        </div>
                        
                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-teal-500">
                            <div className="text-sm text-gray-600 mb-1">Total Training Steps</div>
                            <div className="text-3xl font-bold text-gray-800">{analytics.totalSteps}</div>
                            <div className="text-xs text-gray-500 mt-2">Across {analytics.publishedJourneys} published {analytics.publishedJourneys === 1 ? 'journey' : 'journeys'}</div>
                        </div>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">📊 More detailed analytics coming soon...</h2>
                        <p className="text-gray-600">Future features:</p>
                        <ul className="list-disc list-inside text-gray-600 mt-2 space-y-1">
                            <li>Journey-specific completion breakdown</li>
                            <li>Completion rates by specialty</li>
                            <li>Average time per journey</li>
                            <li>Step-level drop-off analysis</li>
                            <li>User engagement trends over time</li>
                            <li>Export reports to CSV/PDF</li>
                        </ul>
                    </div>
                </div>
            );
        }
        
        // ============================================
        // ADMIN LOGIN COMPONENT
        // ============================================
        function AdminLogin() {
            // Load saved email from localStorage
            const [email, setEmail] = useState(localStorage.getItem('accuro_admin_email') || '');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                const { signInWithEmailAndPassword } = window.firebaseModules;
                
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // Save email to localStorage for next time
                    localStorage.setItem('accuro_admin_email', email);
                    // Auth state listener will handle the rest
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-600 via-indigo-600 to-blue-600 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="text-5xl mb-3">👨‍🏫</div>
                            <h1 className="text-3xl font-black text-gray-800 mb-2">
                                Accuro Training
                            </h1>
                            <p className="text-gray-600">
                                Admin Portal
                            </p>
                        </div>
                        
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    Email Address
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                    placeholder="trainer@example.com"
                                    required
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    Password
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                    placeholder="••••••••"
                                    required
                                    minLength="6"
                                />
                            </div>
                            
                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 p-3 rounded-xl text-sm">
                                    {error}
                                </div>
                            )}
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-3 rounded-xl font-bold hover:from-purple-700 hover:to-indigo-700 transition shadow-lg disabled:opacity-50"
                            >
                                {loading ? 'Signing in...' : 'Sign In as Trainer'}
                            </button>

			<div className="mt-4 text-center">
    			<button
        			type="button"
        			onClick={async () => {
            			if (!email) {
                			setError('Please enter your email address first');
                		return;
            			}
            			try {
                			const { sendPasswordResetEmail } = window.firebaseModules;
                			await sendPasswordResetEmail(auth, email);
                			alert(`Password reset email sent to ${email}. Check your inbox (and spam folder)!`);
            			} catch (err) {
                			console.error('Password reset error:', err);
                			console.error('Error code:', err.code);
                			console.error('Error message:', err.message);
                			
                			// Show user-friendly error
                			if (err.code === 'auth/user-not-found') {
                			    alert('No account found with this email address.');
                			} else if (err.code === 'auth/invalid-email') {
                			    alert('Invalid email address format.');
                			} else if (err.code === 'auth/too-many-requests') {
                			    alert('Too many reset attempts. Please try again later.');
                			} else {
                			    alert(`Error sending reset email: ${err.message}`);
                			}
                			setError(err.message);
            			}
        			}}
        			className="text-sm text-purple-600 hover:underline"
    			>
        		Forgot password?
    			</button>
			</div>

                        </form>

                        
                        <div className="mt-6 pt-6 border-t border-gray-200 text-center">
                            <p className="text-sm text-gray-600 mb-2">Are you a student?</p>
                            <a href="index.html" className="text-purple-600 hover:underline font-semibold text-sm">
                                Go to Student Portal →
                            </a>
                        </div>
                    </div>
                </div>
            );
        }
        
        // ============================================
        // MAIN ADMIN APP
        // ============================================
        function AdminPanel() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [stats, setStats] = useState({});
            const [toast, setToast] = useState(null);
            const toastTimeoutRef = useRef(null);
            
            // Toast notification helper - replaces existing toast
            const showToast = (message, type = 'success') => {
                // Clear any existing timeout
                if (toastTimeoutRef.current) {
                    clearTimeout(toastTimeoutRef.current);
                }
                
                // Show new toast
                setToast({ message, type });
                
                // Auto-hide after 3 seconds
                toastTimeoutRef.current = setTimeout(() => {
                    setToast(null);
                }, 3000);
            };
            
            useEffect(() => {
                const { onAuthStateChanged } = window.firebaseModules;
                
                const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        
                        const { doc, getDoc } = window.firebaseModules;
                        const userDoc = await getDoc(doc(db, 'users', firebaseUser.uid));
                        
                        if (userDoc.exists()) {
                            const profile = userDoc.data();
                            setUserProfile(profile);
                            
                            if (profile.role !== 'trainer') {
                                alert('Access denied. This panel is for trainers only.');
                                const { signOut } = window.firebaseModules;
                                await signOut(auth);
                            } else {
                                loadStats();
                            }
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                    }
                    setLoading(false);
                });
                
                return () => unsubscribe();
            }, []);
            
            const loadStats = async () => {
                const { collection, getDocs, query, where } = window.firebaseModules;
                
                const usersSnapshot = await getDocs(collection(db, 'users'));
                const journeysSnapshot = await getDocs(query(collection(db, 'journeys'), where('status', '==', 'published')));
                const progressSnapshot = await getDocs(collection(db, 'userProgress'));
                
                // Count only steps that belong to published journeys
                let totalSteps = 0;
                journeysSnapshot.docs.forEach(doc => {
                    const journey = doc.data();
                    totalSteps += (journey.stepIds?.length || 0);
                });
                
                // Calculate true average completion percentage
                const avgCompletion = progressSnapshot.docs.length > 0 
                    ? progressSnapshot.docs.reduce((sum, doc) => {
                        const data = doc.data();
                        const completed = data.completedStepIds?.length || 0;
                        const total = data.totalSteps || 1;  // Steps in their journey
                        const percentage = (completed / total) * 100;
                        return sum + percentage;
                    }, 0) / progressSnapshot.docs.length
                    : 0;
                
                setStats({
                    totalUsers: usersSnapshot.size,
                    publishedJourneys: journeysSnapshot.size,
                    totalSteps: totalSteps,
                    avgCompletion: Math.round(avgCompletion)  // Round to whole number
                });
            };
            
            const handleSignOut = async () => {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Loading admin panel...</div>
                    </div>
                );
            }
            
            // Show login if not authenticated
            if (!user) {
                return <AdminLogin />;
            }
            
            // Show loading while profile is being fetched (prevents flash of "Access Denied")
            if (!userProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Checking permissions...</div>
                    </div>
                );
            }
            
            // Show access denied if not a trainer
            if (userProfile.role !== 'trainer') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-red-500 to-pink-600">
                        <div className="bg-white p-8 rounded-2xl text-center">
                            <h2 className="text-2xl font-bold text-red-600 mb-4">Access Denied</h2>
                            <p className="text-gray-600 mb-4">This panel is for trainers only.</p>
                            <button
                                onClick={handleSignOut}
                                className="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Sidebar */}
                    <div className="fixed left-0 top-0 bottom-0 w-64 bg-gradient-to-b from-indigo-600 to-purple-700 text-white p-6">
                        <div className="mb-8">
                            <h1 className="text-2xl font-black mb-2">🏥 Accuro Admin</h1>
                            <p className="text-sm text-indigo-200">{userProfile.displayName}</p>
                        </div>
                        
                        <nav className="space-y-2">
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'dashboard' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Home className="w-5 h-5" />
                                Dashboard
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('journeys')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'journeys' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Journey className="w-5 h-5" />
                                Journeys
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('users')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'users' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Users className="w-5 h-5" />
                                Users
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('quizgames')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'quizgames' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <span className="w-5 h-5">🎮</span>
                                Quiz Games
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('calendartemplates')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'calendartemplates' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Calendar className="w-5 h-5" />
                                Calendar Templates
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('analytics')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'analytics' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Analytics className="w-5 h-5" />
                                Analytics
                            </button>
                            
                            <button
                                onClick={() => setCurrentView('settings')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${
                                    currentView === 'settings' ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'
                                }`}
                            >
                                <Icons.Settings className="w-5 h-5" />
                                Settings
                            </button>
                        </nav>
                        
                        <div className="absolute bottom-6 left-6 right-6">
                            <button
                                onClick={handleSignOut}
                                className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg transition"
                            >
                                <Icons.LogOut className="w-5 h-5" />
                                Sign Out
                            </button>
                        </div>
                    </div>
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 right-4 z-50 animate-slide-in">
                            <div 
                                onClick={() => setToast(null)}
                                className={`px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 cursor-pointer hover:opacity-90 transition ${
                                    toast.type === 'success' ? 'bg-green-500' : 
                                    toast.type === 'error' ? 'bg-red-500' : 'bg-blue-500'
                                } text-white`}
                            >
                                <span className="text-2xl">
                                    {toast.type === 'success' ? '✓' : toast.type === 'error' ? '✕' : 'ℹ'}
                                </span>
                                <span className="font-semibold flex-1">{toast.message}</span>
                                <span className="text-sm opacity-70 hover:opacity-100">✕</span>
                            </div>
                        </div>
                    )}
                    
                    {/* Main Content */}
                    <div className="ml-64">
                        {currentView === 'dashboard' && <Dashboard stats={stats} setCurrentView={setCurrentView} />}
                        {currentView === 'journeys' && <JourneyManagement showToast={showToast} />}
                        {currentView === 'users' && <UserManagement showToast={showToast} />}
                        {currentView === 'quizgames' && <QuizGames showToast={showToast} />}
                        {currentView === 'calendartemplates' && <CalendarTemplates showToast={showToast} />}
                        {currentView === 'analytics' && <Analytics />}
                        {currentView === 'settings' && <SpecialtyManagement showToast={showToast} />}
                    </div>
                </div>
            );
        }
        
        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
