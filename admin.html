        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // Calculate the actual calendar dates for a template given a start date
        // Skips weekends if includeWeekends is false
        function calculateScheduleDates(startDate, itemCount, includeWeekends) {
            const dates = [];
            let current = new Date(startDate + 'T00:00:00');
            
            // If start date falls on a weekend and weekends are excluded, move to next Monday
            if (!includeWeekends) {
                while (current.getDay() === 0 || current.getDay() === 6) {
                    current.setDate(current.getDate() + 1);
                }
            }
            
            for (let i = 0; i < itemCount; i++) {
                if (i > 0) {
                    current.setDate(current.getDate() + 1);
                    if (!includeWeekends) {
                        while (current.getDay() === 0 || current.getDay() === 6) {
                            current.setDate(current.getDate() + 1);
                        }
                    }
                }
                dates.push({
                    date: current.toISOString().split('T')[0],
                    dayOfWeek: DAYS_OF_WEEK[current.getDay()]
                });
            }
            
            return dates;
        }

        // Export a healthcare onboarding schedule to CSV (for Teams/Outlook/Google Calendar import)
        function exportScheduleToCSV(schedule) {
            const rows = [];
            rows.push(['Subject', 'Start Date', 'Start Time', 'End Date', 'End Time', 'Description', 'Categories']);
            
            schedule.items.forEach(item => {
                const taskList = (item.tasks || []).map(t => t.title).join('; ');
                const journeyInfo = (item.journeyIds && item.journeyIds.length > 0) 
                    ? `${item.journeyIds.length} linked journey(s)` 
                    : 'None';
                
                const description = [
                    `Tasks: ${taskList || 'None'}`,
                    `Linked Journeys: ${journeyInfo}`,
                    `Position: ${schedule.position}`,
                    `Employee: ${schedule.employeeName}`,
                    item.description ? `Notes: ${item.description}` : ''
                ].filter(Boolean).join('\n');
                
                // Format date as M/D/YYYY for calendar compatibility
                const d = new Date(item.date + 'T00:00:00');
                const dateFormatted = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
                
                rows.push([
                    `${schedule.position} Onboarding: Day ${item.dayNumber} - ${item.title}`,
                    dateFormatted,
                    '9:00 AM',
                    dateFormatted,
                    '5:00 PM',
                    description,
                    'Onboarding'
                ]);
            });
            
            const csv = rows.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${schedule.employeeName.replace(/\s+/g, '_')}_onboarding_${schedule.startDate}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Firebase Storage Implementation
        class FirebaseStorageProvider extends StorageProvider {
            constructor(storage) {
                super();
                this.storage = storage;
            }
            
            async upload(file, path) {
                const { ref, uploadBytes } = window.firebaseModules;
                const storageRef = ref(this.storage, path);
                const snapshot = await uploadBytes(storageRef, file);
                return snapshot.ref.fullPath;
            }
            
            async getDownloadURL(path) {
                const { ref, getDownloadURL } = window.firebaseModules;
                const fileRef = ref(this.storage, path);
                return await getDownloadURL(fileRef);
            }
            
            async deleteFile(path) {
                const { ref, deleteObject } = window.firebaseModules;
                const fileRef = ref(this.storage, path);
                await deleteObject(fileRef);
            }
        }

        // Azure Blob Storage Implementation (for future migration)
        class AzureBlobStorageProvider extends StorageProvider {
            constructor(containerClient) {
                super();
                this.containerClient = containerClient;
            }
            
            async upload(file, path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                await blockBlobClient.uploadData(file);
                return blockBlobClient.url;
            }
            
            async getDownloadURL(path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                return blockBlobClient.url;
            }
            
            async deleteFile(path) {
                const blockBlobClient = this.containerClient.getBlockBlobClient(path);
                await blockBlobClient.delete();
            }
        }

        // Cloudflare R2 Storage Implementation (S3-compatible)
        class CloudflareR2Provider extends StorageProvider {
            constructor(config) {
                super();
                this.accountId = config.accountId;
                this.accessKeyId = config.accessKeyId;
                this.secretAccessKey = config.secretAccessKey;
                this.bucketName = config.bucketName;
                this.publicUrl = config.publicUrl; // e.g., https://pub-xxxxx.r2.dev
            }
            
            async upload(file, path) {
                try {
                    // R2 endpoint
                    const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                    
                    // Read file as ArrayBuffer
                    const arrayBuffer = await file.arrayBuffer();
                    
                    // Create AWS Signature V4
                    const date = new Date();
                    const dateString = date.toISOString().split('T')[0].replace(/-/g, '');
                    const region = 'auto'; // R2 uses 'auto' as region
                    
                    // Simple upload using presigned URL approach
                    // For production, you'd use AWS SDK, but this works for browser
                    const response = await fetch(endpoint, {
                        method: 'PUT',
                        body: arrayBuffer,
                        headers: {
                            'Content-Type': file.type,
                            'x-amz-acl': 'public-read'
                        },
                        // Note: This is a simplified version
                        // In production, use AWS SDK or proper signing
                    });
                    
                    if (!response.ok) {
                        // Fallback: Use presigned URL approach
                        return await this.uploadViaPresignedUrl(file, path);
                    }
                    
                    return path;
                } catch (error) {
                    console.error('R2 upload error:', error);
                    throw error;
                }
            }
            
            async uploadViaPresignedUrl(file, path) {
                // For browser upload, we'll use a simpler approach:
                // Convert to base64 and store in Firestore temporarily
                // Then use a Cloud Function to upload to R2
                // OR use direct XMLHttpRequest with proper CORS
                
                const formData = new FormData();
                formData.append('file', file);
                
                // This would typically call your backend endpoint
                // For now, we'll use a direct approach
                const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                
                const xhr = new XMLHttpRequest();
                return new Promise((resolve, reject) => {
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = (e.loaded / e.total) * 100;
                            console.log('Upload progress:', percentComplete);
                        }
                    });
                    
                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            resolve(path);
                        } else {
                            reject(new Error(`Upload failed: ${xhr.status}`));
                        }
                    });
                    
                    xhr.addEventListener('error', () => reject(new Error('Upload failed')));
                    
                    xhr.open('PUT', endpoint);
                    xhr.setRequestHeader('Content-Type', file.type);
                    xhr.send(file);
                });
            }
            
            async getDownloadURL(path) {
                // Return public URL
                return `${this.publicUrl}/${path}`;
            }
            
            async deleteFile(path) {
                const endpoint = `https://${this.accountId}.r2.cloudflarestorage.com/${this.bucketName}/${path}`;
                
                const response = await fetch(endpoint, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    throw new Error('Delete failed');
                }
            }
        }

            accountId: 'YOUR_ACCOUNT_ID', // Replace with your Account ID
            accessKeyId: 'YOUR_ACCESS_KEY_ID', // Replace with your Access Key
            secretAccessKey: 'YOUR_SECRET_ACCESS_KEY', // Replace with your Secret Key
            bucketName: 'accuro-recordings',
            publicUrl: 'https://pub-xxxxx.r2.dev' // Replace with your public URL
        };
        
        const storageProvider = USE_CLOUDFLARE_R2
            ? new CloudflareR2Provider(cloudflareR2Config)
            : (USE_AZURE 
                ? new AzureBlobStorageProvider(window.azureContainerClient)
                : new FirebaseStorageProvider(storage));
        
        // ============================================
        // JOURNEY MANAGEMENT
        // ============================================
        function JourneyManagement({ showToast }) {
            const [journeys, setJourneys] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editingJourney, setEditingJourney] = useState(null);
            const [selectedCategory, setSelectedCategory] = useState('all');
            
            // Define categories
            const categories = [
                { id: 'all', label: 'All Journeys', icon: '📦' },
                { id: 'clinical_apps', label: 'Clinical Apps', icon: '📱' },
                { id: 'processes', label: 'Processes & Procedures', icon: '📋' },
                { id: 'onboarding', label: 'Onboarding', icon: '🎓' },
                { id: 'other', label: 'Other', icon: '📌' }
            ];
            
            useEffect(() => {
                loadJourneys();
            }, []);
            
            const loadJourneys = async () => {
                const { collection, getDocs } = window.firebaseModules;
                const querySnapshot = await getDocs(collection(db, 'journeys'));
                const journeyData = querySnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                setJourneys(journeyData);
                setLoading(false);
            };
            
            const createNewJourney = () => {
                setEditingJourney({
                    id: null,
                    specialty: 'nurse',
                    title: '',
                    description: '',
                    status: 'draft',
                    category: 'other',  // Default category
                    stepIds: []
                });
            };
            
            // Filter journeys by category
            const filteredJourneys = selectedCategory === 'all' 
                ? journeys 
                : journeys.filter(j => (j.category || 'other') === selectedCategory);
            
            const deleteJourney = async (journeyId) => {
                if (!confirm('Are you sure? This will delete the journey and all its data.')) return;
                
                const { doc, deleteDoc } = window.firebaseModules;
                await deleteDoc(doc(db, 'journeys', journeyId));
                loadJourneys();
            };
            
            const cloneJourney = async (sourceJourney) => {
                if (!confirm(`Clone "${sourceJourney.title}"?\n\nThis will create a duplicate journey with all steps and tasks.`)) return;
                
                const { doc, getDoc, setDoc, collection, getDocs } = window.firebaseModules;
                
                try {
                    showToast('Cloning journey... Please wait.');
                    
                    // Load all steps from source journey
                    const stepsPromises = (sourceJourney.stepIds || []).map(stepId => 
                        getDoc(doc(db, 'steps', stepId))
                    );
                    const stepsDocs = await Promise.all(stepsPromises);
                    
                    // Clone steps and their tasks
                    const newStepIds = [];
                    let cloneCounter = 0;
                    
                    for (const stepDoc of stepsDocs) {
                        if (!stepDoc.exists()) continue;
                        
                        const stepData = stepDoc.data();
                        // More unique ID with counter
                        const newStepId = 'step_clone_' + Date.now() + '_' + cloneCounter + '_' + Math.random().toString(36).substr(2, 9);
                        cloneCounter++;
                        
                        // Clone tasks for this step
                        const newTaskIds = [];
                        let taskCounter = 0;
                        
                        if (stepData.taskIds && stepData.taskIds.length > 0) {
                            const tasksPromises = stepData.taskIds.map(taskId => 
                                getDoc(doc(db, 'tasks', taskId))
                            );
                            const tasksDocs = await Promise.all(tasksPromises);
                            
                            for (const taskDoc of tasksDocs) {
                                if (!taskDoc.exists()) continue;
                                
                                const taskData = taskDoc.data();
                                // More unique ID with counter
                                const newTaskId = 'task_clone_' + Date.now() + '_' + taskCounter + '_' + Math.random().toString(36).substr(2, 9);
                                taskCounter++;
                                
                                // Deep copy task data to ensure no references
                                await setDoc(doc(db, 'tasks', newTaskId), {
                                    action: taskData.action || '',
                                    accuroNavigation: taskData.accuroNavigation || '',
                                    estimatedTime: taskData.estimatedTime || '',
                                    order: taskData.order || 0,
                                    screenshotUrls: taskData.screenshotUrls || (taskData.screenshotUrl ? [taskData.screenshotUrl] : [])
                                });
                                
                                newTaskIds.push(newTaskId);
                                
                                // Small delay to ensure unique timestamps
                                await new Promise(resolve => setTimeout(resolve, 15));
                            }
                        }
                        
                        // Deep copy step data to ensure no references
                        await setDoc(doc(db, 'steps', newStepId), {
                            name: stepData.name || '',
                            description: stepData.description || '',
                            order: stepData.order || 0,
                            taskIds: newTaskIds
                        });
                        
                        newStepIds.push(newStepId);
                        
                        // Small delay to ensure unique timestamps
                        await new Promise(resolve => setTimeout(resolve, 15));
                    }
                    
                    // Create cloned journey
                    const newJourneyId = 'journey_clone_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    const { serverTimestamp } = window.firebaseModules;
                    
                    await setDoc(doc(db, 'journeys', newJourneyId), {
                        title: sourceJourney.title + ' (Copy)',
                        description: sourceJourney.description,
                        specialties: sourceJourney.specialties || (sourceJourney.specialty ? [sourceJourney.specialty] : []),  // Handle both old and new format
                        category: sourceJourney.category || 'other',  // Clone category
                        status: 'draft',  // Clone as draft
                        stepIds: newStepIds,
                        attachments: sourceJourney.attachments || [],
                        createdAt: serverTimestamp(),
                        lastModified: serverTimestamp()
                    });
                    
                    showToast('Journey cloned successfully! (Saved as Draft)');
                    loadJourneys();
                    
                } catch (error) {
                    console.error('Error cloning journey:', error);
                    showToast('Error cloning journey: ' + error.message, 'error');
                }
            };
            
            if (loading) return <div className="p-8">Loading...</div>;
            
            if (editingJourney) {
                return <JourneyEditor journey={editingJourney} onClose={() => { setEditingJourney(null); loadJourneys(); }} showToast={showToast} />;
            }
            
            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">🗺️ Journey Management</h1>
                        <div className="flex gap-3">
                            <button
                                onClick={() => {
                                    createNewJourney();
                                    // Wait for journey editor to open, then trigger recording
                                    setTimeout(() => {
                                        const recordBtn = document.querySelector('[data-action="start-recording"]');
                                        if (recordBtn) {
                                            recordBtn.click();
                                        }
                                    }, 500);
                                }}
                                className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-red-500 to-pink-600 text-white rounded-lg hover:from-red-600 hover:to-pink-700 transition font-semibold"
                            >
                                <span className="text-xl">🎥</span>
                                Record & Create Journey
                            </button>
                            <button
                                onClick={createNewJourney}
                                data-action="create-journey"
                                className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-lg hover:from-blue-600 hover:to-indigo-700 transition font-semibold"
                            >
                                <Icons.Plus className="w-5 h-5" />
                                Create New Journey
                            </button>
                        </div>
                    </div>
                    
                    {/* Category Tabs */}
                    <div className="bg-white rounded-xl shadow-lg p-2 mb-6 flex flex-wrap gap-2">
                        {categories.map(cat => (
                            <button
                                key={cat.id}
                                onClick={() => setSelectedCategory(cat.id)}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg font-semibold transition ${
                                    selectedCategory === cat.id
                                        ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-md'
                                        : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                <span className="text-lg">{cat.icon}</span>
                                <span>{cat.label}</span>
                                <span className={`text-xs px-2 py-0.5 rounded-full ${
                                    selectedCategory === cat.id
                                        ? 'bg-white/20 text-white'
                                        : 'bg-gray-200 text-gray-600'
                                }`}>
                                    {cat.id === 'all' 
                                        ? journeys.length 
                                        : journeys.filter(j => (j.category || 'other') === cat.id).length
                                    }
                                </span>
                            </button>
                        ))}
                    </div>
                    
                    {/* Journey Cards */}
                    {filteredJourneys.length === 0 ? (
                        <div className="bg-white rounded-xl shadow-lg p-12 text-center">
                            <div className="text-6xl mb-4">📭</div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">
                                No journeys in this category
                            </h3>
                            <p className="text-gray-600 mb-4">
                                {selectedCategory === 'all' 
                                    ? 'Create your first journey to get started!'
                                    : `Create a journey and set its category to "${categories.find(c => c.id === selectedCategory)?.label}"`
                                }
                            </p>
                            <button
                                onClick={createNewJourney}
                                className="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
                            >
                                Create Journey
                            </button>
                        </div>
                    ) : (
                    <div className="grid gap-6">
                        {filteredJourneys.map(journey => (
                            <div key={journey.id} className="bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition">
                                <div className="flex justify-between items-start">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-3 mb-2">
                                            <h3 className="text-2xl font-bold text-gray-800">{journey.title}</h3>
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                journey.status === 'published' 
                                                    ? 'bg-green-100 text-green-700' 
                                                    : 'bg-yellow-100 text-yellow-700'
                                            }`}>
                                                {journey.status === 'published' ? '✓ Published' : '📝 Draft'}
                                            </span>
                                            {journey.category && journey.category !== 'other' && (
                                                <span className="px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">
                                                    {categories.find(c => c.id === journey.category)?.icon} {categories.find(c => c.id === journey.category)?.label}
                                                </span>
                                            )}
                                        </div>
                                        <p className="text-gray-600 mb-3">{journey.description}</p>
                                        <div className="flex gap-4 text-sm text-gray-500">
                                            <span>
                                                👥 {journey.specialties?.length > 0 ? (
                                                    <>
                                                        <strong>
                                                            {journey.specialties.map(s => {
                                                                const displayNames = {
                                                                    'nurse': 'Nurse',
                                                                    'moa': 'MOA',
                                                                    'dietician': 'Dietician',
                                                                    'physician': 'Physician',
                                                                    'pharmacist': 'Pharmacist',
                                                                    'lab_tech': 'Lab Tech'
                                                                };
                                                                // Handle string safely
                                                                return displayNames[s] || (typeof s === 'string' ? s.charAt(0).toUpperCase() + s.slice(1) : s);
                                                            }).join(', ')}
                                                        </strong>
                                                    </>
                                                ) : (
                                                    // Backward compatibility: show old 'specialty' field
                                                    <strong>{journey.specialty || 'Not assigned'}</strong>
                                                )}
                                            </span>
                                            <span>📚 Steps: <strong>{journey.stepIds?.length || 0}</strong></span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setEditingJourney(journey)}
                                            className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                            title="Edit"
                                        >
                                            <Icons.Edit className="w-5 h-5" />
                                        </button>
                                        <button
                                            onClick={() => cloneJourney(journey)}
                                            className="p-2 text-green-600 hover:bg-green-50 rounded-lg transition"
                                            title="Clone"
                                        >
                                            <Icons.Copy className="w-5 h-5" />
                                        </button>
                                        <button
                                            onClick={() => deleteJourney(journey.id)}
                                            className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"
                                            title="Delete"
                                        >
                                            <Icons.Trash className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    )}
                </div>
            );
        }
        
        // ============================================
        // JOURNEY EDITOR (with drag-drop steps)
        // ============================================
        function JourneyEditor({ journey, onClose, showToast }) {
            // Handle backward compatibility: convert old 'specialty' to new 'specialties' array
            const initialFormData = {
                ...journey,
                specialties: journey.specialties || (journey.specialty ? [journey.specialty] : []),
                category: journey.category || 'other'  // Default to 'other' if not set
            };
            
            const [formData, setFormData] = useState(initialFormData);
            const [steps, setSteps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [attachments, setAttachments] = useState(journey.attachments || []);
            const [newAttachment, setNewAttachment] = useState({ name: '', url: '' });
            const [editingStep, setEditingStep] = useState(null);
            const [availableSpecialties, setAvailableSpecialties] = useState([]);
            const stepsListRef = useRef(null);
            
            // Screen Recording State
            const [isRecording, setIsRecording] = useState(false);
            const [mediaRecorder, setMediaRecorder] = useState(null);
            const [recordedChunks, setRecordedChunks] = useState([]);
            const [recordingStartTime, setRecordingStartTime] = useState(null);
            const [recordingDuration, setRecordingDuration] = useState(0);
            const [showRecordingModal, setShowRecordingModal] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadedVideoURL, setUploadedVideoURL] = useState('');
            const recordingIntervalRef = useRef(null);
            
            useEffect(() => {
                loadSpecialties();
                loadSteps();
            }, []);
            
            const loadSpecialties = async () => {
                const { doc, getDoc } = window.firebaseModules;
                try {
                    const specialtiesDoc = await getDoc(doc(db, 'settings', 'specialties'));
                    if (specialtiesDoc.exists()) {
                        const data = specialtiesDoc.data();
                        setAvailableSpecialties(data.list || []);
                    } else {
                        // Fallback to default specialties if settings not found
                        setAvailableSpecialties([
                            'nurse',
                            'moa',
                            'dietician',
                            'physician',
                            'pharmacist',
                            'lab_tech'
                        ]);
                    }
                } catch (error) {
                    console.error('Error loading specialties:', error);
                    // Fallback to defaults
                    setAvailableSpecialties([
                        'nurse',
                        'moa',
                        'dietician',
                        'physician',
                        'pharmacist',
                        'lab_tech'
                    ]);
                }
            };
            
            const toggleSpecialty = (specialty) => {
                const currentSpecialties = formData.specialties || [];
                if (currentSpecialties.includes(specialty)) {
                    // Remove specialty
                    setFormData({
                        ...formData,
                        specialties: currentSpecialties.filter(s => s !== specialty)
                    });
                } else {
                    // Add specialty
                    setFormData({
                        ...formData,
                        specialties: [...currentSpecialties, specialty]
                    });
                }
            };
            
            useEffect(() => {
                if (stepsListRef.current && steps.length > 0) {
                    const sortable = Sortable.create(stepsListRef.current, {
                        animation: 150,
                        handle: '.drag-handle',
                        onEnd: (evt) => {
                            const reordered = [...steps];
                            const [removed] = reordered.splice(evt.oldIndex, 1);
                            reordered.splice(evt.newIndex, 0, removed);
                            reordered.forEach((step, index) => {
                                step.order = index + 1;
                            });
                            setSteps(reordered);
                        }
                    });
                    return () => sortable.destroy();
                }
            }, [steps]);
            
            const loadSteps = async () => {
                if (!formData.stepIds || formData.stepIds.length === 0) {
                    setLoading(false);
                    return;
                }
                
                const { doc, getDoc } = window.firebaseModules;
                const stepsPromises = formData.stepIds.map(stepId => getDoc(doc(db, 'steps', stepId)));
                const stepsDocs = await Promise.all(stepsPromises);
                const stepsData = stepsDocs
                    .filter(doc => doc.exists())
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => a.order - b.order);
                
                setSteps(stepsData);
                setLoading(false);
            };
            
            const saveJourney = async (closeAfter = false) => {
    		if (saving) return; // Prevent double-save
    		setSaving(true);
    		
    		// Validation: At least one specialty must be selected
    		if (!formData.specialties || formData.specialties.length === 0) {
    		    showToast('Please select at least one specialty', 'error');
    		    setSaving(false);
    		    return;
    		}
    		
    		const { doc, setDoc, updateDoc, serverTimestamp } = window.firebaseModules;
    
    		try {
        		const journeyData = {
            		specialties: formData.specialties,  // Save as array
            		title: formData.title,
            		description: formData.description,
            		status: formData.status,
            		category: formData.category || 'other',  // Save category
            		stepIds: steps.map(s => s.id),
            		attachments: attachments,
            		lastModified: serverTimestamp()
        	};
        
        	if (!formData.id) {
            		// New journey
            		const newId = 'journey_' + Date.now();
            		journeyData.createdAt = serverTimestamp();
            		await setDoc(doc(db, 'journeys', newId), journeyData);
        	} else {
            		// Update existing journey
            		await updateDoc(doc(db, 'journeys', formData.id), journeyData);
        	}
        
        	// Update step orders
        	for (const step of steps) {
            		if (step.id) {  // Only update existing steps
                		await updateDoc(doc(db, 'steps', step.id), { order: step.order });
            		}
        	}
        
        	showToast('Journey saved successfully!');
        	setSaving(false); // Reset saving state
        	
        	if (closeAfter) {
        	    onClose();
        	}
        
   		} catch (error) {
        		console.error('Error saving journey:', error);
        		showToast('Error saving journey: ' + error.message, 'error');
        		setSaving(false);
    		}
		};
            
            const createNewStep = () => {
                setEditingStep({
                    id: null,
                    title: '',
                    phase: '',
                    icon: '📌',
                    color: 'from-blue-500 to-indigo-600',
                    outcome: '',
                    nextAction: '',
                    order: steps.length + 1,
                    taskIds: []
                });
            };
            
            const addStepToJourney = (step) => {
                // Check if step already exists (editing) or is new
                const existingIndex = steps.findIndex(s => s.id === step.id);
                
                if (existingIndex >= 0) {
                    // Update existing step
                    const updatedSteps = [...steps];
                    updatedSteps[existingIndex] = step;
                    setSteps(updatedSteps);
                } else {
                    // Add new step
                    setSteps([...steps, step]);
                }
                
                setEditingStep(null);
            };
            
            const deleteStep = async (stepId) => {
                if (!confirm('Delete this step?')) return;
                setSteps(steps.filter(s => s.id !== stepId));
            };
            
            const addAttachment = () => {
                if (!newAttachment.name.trim() || !newAttachment.url.trim()) {
                    showToast('Please enter both name and URL', 'error');
                    return;
                }
                
                // Basic URL validation
                try {
                    new URL(newAttachment.url);
                } catch (e) {
                    showToast('Please enter a valid URL (must start with http:// or https://)', 'error');
                    return;
                }
                
                setAttachments([...attachments, {
                    name: newAttachment.name.trim(),
                    url: newAttachment.url.trim(),
                    addedAt: new Date().toISOString()
                }]);
                
                showToast('Link added successfully!');
                setNewAttachment({ name: '', url: '' });
            };
            
            const deleteAttachment = (index) => {
                if (!confirm('Remove this link?')) return;
                const newAttachments = attachments.filter((_, i) => i !== index);
                setAttachments(newAttachments);
            };
            
            if (editingStep) {
                return <StepEditor step={editingStep} onSave={addStepToJourney} onClose={() => setEditingStep(null)} showToast={showToast} />;
            }
            
            if (loading) {
                return (
                    <div className="p-8 max-w-5xl mx-auto">
                        <div className="flex items-center justify-center min-h-[400px]">
                            <div className="text-center">
                                <div className="text-6xl mb-4">⏳</div>
                                <div className="text-xl font-semibold text-gray-600">Loading journey...</div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Screen Recording Functions
            const formatDuration = (seconds) => {
                if (!seconds || isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };
            
            const startScreenRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen", width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: { echoCancellation: true }
                    });
                    
                    let options = { mimeType: 'video/webm;codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) options.mimeType = 'video/webm';
                    
                    const recorder = new MediaRecorder(stream, options);
                    const chunks = [];
                    
                    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        if (recordingIntervalRef.current) clearInterval(recordingIntervalRef.current);
                        setRecordedChunks(chunks);
                        setShowRecordingModal(true);
                        setIsRecording(false);
                        await uploadRecording(new Blob(chunks, { type: 'video/webm' }));
                    };
                    
                    stream.getVideoTracks()[0].onended = () => { if (recorder.state === 'recording') recorder.stop(); };
                    
                    recorder.start(1000);
                    setMediaRecorder(recorder);
                    setIsRecording(true);
                    setRecordingStartTime(Date.now());
                    showToast('🎥 Recording started!');
                    
                    recordingIntervalRef.current = setInterval(() => {
                        setRecordingDuration((Date.now() - recordingStartTime) / 1000);
                    }, 1000);
                } catch (err) {
                    showToast(err.name === 'NotAllowedError' ? 'Permission denied' : 'Error: ' + err.message, 'error');
                }
            };
            
            const stopScreenRecording = () => {
                if (mediaRecorder?.state === 'recording') {
                    mediaRecorder.stop();
                    showToast('⏹️ Stopping...');
                }
            };
            
            const uploadRecording = async (blob) => {
                try {
                    setUploadProgress(0);
                    const filename = `recordings/${formData.id || 'new'}_${Date.now()}.webm`;
                    const file = new File([blob], filename, { type: 'video/webm' });
                    
                    console.log('Starting upload...', {
                        filename,
                        fileSize: blob.size,
                        storageInitialized: !!storage
                    });
                    
                    showToast('📤 Uploading...');
                    
                    const int = setInterval(() => setUploadProgress(p => Math.min(p + 10, 90)), 200);
                    
                    try {
                        console.log('Calling storageProvider.upload...');
                        const path = await storageProvider.upload(file, filename);
                        console.log('Upload complete, path:', path);
                        
                        console.log('Getting download URL...');
                        const url = await storageProvider.getDownloadURL(path);
                        console.log('Download URL:', url);
                        
                        clearInterval(int);
                        setUploadProgress(100);
                        setUploadedVideoURL(url);
                        showToast('✅ Uploaded!');
                        return url;
                    } catch (uploadError) {
                        clearInterval(int);
                        console.error('Upload/URL error:', uploadError);
                        throw uploadError;
                    }
                } catch (err) {
                    console.error('Upload failed:', err);
                    console.error('Error details:', {
                        name: err.name,
                        message: err.message,

        // ============================================
        // STEP EDITOR (with drag-drop tasks)
        // ============================================
        function StepEditor({ step, onSave, onClose, showToast }) {
            const [formData, setFormData] = useState(step);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const tasksListRef = useRef(null);
            
            useEffect(() => {
                loadTasks();
            }, []);
            
            useEffect(() => {
                if (tasksListRef.current && tasks.length > 0) {
                    const sortable = Sortable.create(tasksListRef.current, {
                        animation: 150,
                        handle: '.drag-handle',
                        onEnd: (evt) => {
                            const reordered = [...tasks];
                            const [removed] = reordered.splice(evt.oldIndex, 1);
                            reordered.splice(evt.newIndex, 0, removed);
                            reordered.forEach((task, index) => {
                                task.order = index + 1;
                            });
                            setTasks(reordered);
                        }
                    });
                    return () => sortable.destroy();
                }
            }, [tasks]);
            
            const loadTasks = async () => {
                if (!formData.taskIds || formData.taskIds.length === 0) {
                    setLoading(false);
                    return;
                }
                
                const { doc, getDoc } = window.firebaseModules;
                const tasksPromises = formData.taskIds.map(taskId => getDoc(doc(db, 'tasks', taskId)));
                const tasksDocs = await Promise.all(tasksPromises);
                const tasksData = tasksDocs
                    .filter(doc => doc.exists())
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => a.order - b.order);
                
                setTasks(tasksData);
                setLoading(false);
            };
            
            const saveStep = async (closeAfter = false) => {
    		if (saving) return; // Prevent double-save
    		setSaving(true);
    		
    		const { doc, setDoc, updateDoc } = window.firebaseModules;
    
    		try {
        		// Save tasks first
        		for (const task of tasks) {
           		 const taskData = {
                	action: task.action,
                	accuroNavigation: task.accuroNavigation,
                	estimatedTime: task.estimatedTime,
                	// Handle both old single URL and new multiple URLs
                	screenshotUrls: task.screenshotUrls || (task.screenshotUrl ? [task.screenshotUrl] : []),
                	order: task.order
            	};
            
            	if (!task.id) {
                	// New task
                	const newTaskId = 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                	taskData.id = newTaskId;
                	await setDoc(doc(db, 'tasks', newTaskId), taskData);
                	task.id = newTaskId;
            	} else {
                	// Update existing task
                	await updateDoc(doc(db, 'tasks', task.id), taskData);
            	}
           }
        
        	// Save step
        	const stepData = {
            	title: formData.title,
            	phase: formData.phase,
            	icon: formData.icon,
            	color: formData.color,
            	outcome: formData.outcome,
            	nextAction: formData.nextAction,
            	order: formData.order,
            	taskIds: tasks.map(t => t.id)
          };
        
        if (!formData.id) {
            // New step
            const newStepId = 'step_' + Date.now();
            stepData.id = newStepId;
            await setDoc(doc(db, 'steps', newStepId), stepData);
            formData.id = newStepId;
        } else {
            // Update existing step

        // ============================================
        // USER MANAGEMENT
        // ============================================
        function UserManagement({ showToast }) {
            const [users, setUsers] = useState([]);
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editingUser, setEditingUser] = useState(null);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newUser, setNewUser] = useState({
                email: '',
                password: '',
                displayName: '',
                specialty: 'moa',
                role: 'student'
            });
            
            useEffect(() => {
                loadUsers(); // This will also load specialties
            }, []);
            
            const loadSpecialties = async () => {
                const { doc, getDoc } = window.firebaseModules;
                try {
                    const specialtiesDoc = await getDoc(doc(db, 'settings', 'specialties'));
                    if (specialtiesDoc.exists()) {
                        setSpecialties(specialtiesDoc.data().list || []);
                    } else {
                        // Default specialties
                        setSpecialties([
                            { id: 'nurse', name: 'Nurse' },
                            { id: 'moa', name: 'Medical Office Assistant' },
                            { id: 'dietician', name: 'Dietician' },
                            { id: 'physician', name: 'Physician' },
                            { id: 'pharmacist', name: 'Pharmacist' },
                            { id: 'lab_tech', name: 'Lab Technician' }
                        ]);
                    }
                } catch (error) {
                    console.error('Error loading specialties:', error);
                }
            };
            
            const loadUsers = async () => {
                const { collection, getDocs } = window.firebaseModules;
                const querySnapshot = await getDocs(collection(db, 'users'));
                const userData = querySnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                setUsers(userData);
                
                // Also reload specialties to ensure names are up-to-date
                await loadSpecialties();
                
                setLoading(false);
            };
            
            // Helper to get specialty display name from ID
            const getSpecialtyName = (specialtyId) => {
                const specialty = specialties.find(s => s.id === specialtyId);
                return specialty ? specialty.name : specialtyId;
            };
            
            const handleEditUser = (user) => {
                setEditingUser({...user});
                setShowEditModal(true);
            };
            
            const handleSaveUser = async () => {
                if (!editingUser) return;
                
                const { doc, updateDoc } = window.firebaseModules;
                
                try {
                    await updateDoc(doc(db, 'users', editingUser.id), {
                        displayName: editingUser.displayName,
                        specialty: editingUser.specialty,
                        role: editingUser.role
                    });
                    
                    showToast('User updated successfully!');
                    setShowEditModal(false);
                    setEditingUser(null);
                    loadUsers();
                } catch (error) {
                    console.error('Error updating user:', error);
                    showToast('Error updating user: ' + error.message, 'error');
                }
            };
            
            const handleDeleteUser = async (userId, userName) => {
                if (!confirm(`Are you sure you want to delete ${userName}?\n\nWARNING: This will delete their account and all progress data. This action cannot be undone.`)) return;
                
                const { doc, deleteDoc, collection, query, where, getDocs } = window.firebaseModules;
                
                try {
                    // Delete user progress
                    const progressQuery = query(collection(db, 'userProgress'), where('userId', '==', userId));
                    const progressSnapshot = await getDocs(progressQuery);
                    for (const progressDoc of progressSnapshot.docs) {
                        await deleteDoc(progressDoc.ref);
                    }
                    
                    // Delete user document
                    await deleteDoc(doc(db, 'users', userId));
                    
                    showToast('User deleted successfully');
                    loadUsers();
                } catch (error) {
                    console.error('Error deleting user:', error);
                    showToast('Error deleting user: ' + error.message, 'error');
                }
            };
            
            const handleCreateUser = async () => {
                if (!newUser.email || !newUser.password || !newUser.displayName) {
                    showToast('Please fill in all required fields', 'error');
                    return;
                }
                
                // Validation
                if (newUser.password.length < 6) {
                    showToast('Password must be at least 6 characters', 'error');
                    return;
                }
                
                // Check if trainer role - show warning
                if (newUser.role === 'trainer') {
                    if (!confirm('⚠️ WARNING: You are creating a TRAINER account.\n\nTrainers have full admin access to:\n• Create/edit journeys\n• Manage all users\n• View analytics\n• Manage settings\n\nAre you sure you want to continue?')) {
                        return;
                    }
                }
                
                const { createUserWithEmailAndPassword } = window.firebaseModules;
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                
                try {
                    // Create auth account
                    const userCredential = await createUserWithEmailAndPassword(auth, newUser.email, newUser.password);
                    const userId = userCredential.user.uid;
                    
                    // Create user profile in Firestore
                    await setDoc(doc(db, 'users', userId), {
                        email: newUser.email,
                        displayName: newUser.displayName,
                        specialty: newUser.specialty,
                        role: newUser.role,
                        createdAt: serverTimestamp()
                    });
                    
                    showToast(`${newUser.role === 'trainer' ? '👨‍🏫 Trainer' : '👨‍🎓 Student'} account created successfully!`);
                    
                    // Reset form
                    setNewUser({
                        email: '',
                        password: '',
                        displayName: '',
                        specialty: 'moa',
                        role: 'student'
                    });
                    
                    setShowCreateModal(false);
                    loadUsers();
                } catch (error) {
                    console.error('Error creating user:', error);
                    let errorMsg = 'Error creating user: ';
                    if (error.code === 'auth/email-already-in-use') {
                        errorMsg += 'Email already in use';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMsg += 'Invalid email address';
                    } else if (error.code === 'auth/weak-password') {
                        errorMsg += 'Password is too weak';
                    } else {
                        errorMsg += error.message;
                    }
                    showToast(errorMsg, 'error');
                }
            };
            
            if (loading) return <div className="p-8">Loading users...</div>;
            
            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">👥 User Management</h1>
                        <button
                            onClick={() => setShowCreateModal(true)}
                            className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg transition shadow-lg"
                        >
                            <span className="text-xl">+</span>
                            Create New User
                        </button>
                    </div>
                    
                    <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Name</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Email</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Specialty</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Role</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Joined</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {users.map(user => (
                                    <tr key={user.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4 text-sm font-medium text-gray-800">{user.displayName}</td>
                                        <td className="px-6 py-4 text-sm text-gray-600">{user.email}</td>
                                        <td className="px-6 py-4">
                                            <span className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">
                                                {getSpecialtyName(user.specialty)}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                                                user.role === 'trainer' 
                                                    ? 'bg-purple-100 text-purple-700' 
                                                    : 'bg-green-100 text-green-700'
                                            }`}>
                                                {user.role}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 text-sm text-gray-600">
                                            {user.createdAt?.toDate ? user.createdAt.toDate().toLocaleDateString() : 'N/A'}
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={() => handleEditUser(user)}
                                                    className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                                    title="Edit user"
                                                >
                                                    <Icons.Edit className="w-4 h-4" />
                                                </button>
                                                <button
                                                    onClick={() => handleDeleteUser(user.id, user.displayName)}
                                                    className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"
                                                    title="Delete user"
                                                >
                                                    <Icons.Trash className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    
                    {users.length === 0 && (
                        <div className="text-center py-12 bg-white rounded-xl">
                            <div className="text-6xl mb-4">👥</div>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">No Users Yet</h3>
                            <p className="text-gray-600">Users will appear here once they sign up.</p>
                        </div>
                    )}
                    
                    {/* Edit User Modal */}

        // ============================================

        // ============================================
        function SpecialtyManagement({ showToast }) {
            const [specialties, setSpecialties] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newSpecialty, setNewSpecialty] = useState('');
            const [editingSpecialty, setEditingSpecialty] = useState(null);
            
            useEffect(() => {
                loadSpecialties();
            }, []);
            
            const loadSpecialties = async () => {
                const { doc, getDoc } = window.firebaseModules;
                
                try {
                    const specialtiesDoc = await getDoc(doc(db, 'settings', 'specialties'));
                    
                    if (specialtiesDoc.exists()) {
                        setSpecialties(specialtiesDoc.data().list || []);
                    } else {
                        // Initialize with default specialties
                        const defaultSpecialties = [
                            { id: 'nurse', name: 'Nurse' },
                            { id: 'moa', name: 'Medical Office Assistant' },
                            { id: 'dietician', name: 'Dietician' },
                            { id: 'physician', name: 'Physician' },
                            { id: 'pharmacist', name: 'Pharmacist' },
                            { id: 'lab_tech', name: 'Lab Technician' }
                        ];
                        setSpecialties(defaultSpecialties);
                        
                        // Save defaults to Firestore
                        const { setDoc } = window.firebaseModules;
                        await setDoc(doc(db, 'settings', 'specialties'), { list: defaultSpecialties });
                    }
                } catch (error) {
                    console.error('Error loading specialties:', error);
                    showToast('Error loading specialties', 'error');
                }
                
                setLoading(false);
            };
            
            const addSpecialty = async () => {
                if (!newSpecialty.trim()) {
                    showToast('Please enter a specialty name', 'error');
                    return;
                }
                
                const id = newSpecialty.toLowerCase().replace(/\s+/g, '_');
                
                // Check if already exists
                if (specialties.some(s => s.id === id)) {
                    showToast('This specialty already exists', 'error');
                    return;
                }
                
                const { doc, setDoc } = window.firebaseModules;
                const newSpec = { id, name: newSpecialty.trim() };
                const updated = [...specialties, newSpec];
                
                try {
                    await setDoc(doc(db, 'settings', 'specialties'), { list: updated });
                    setSpecialties(updated);
                    setNewSpecialty('');
                    showToast('Specialty added successfully!');
                } catch (error) {
                    console.error('Error adding specialty:', error);
                    showToast('Error adding specialty', 'error');
                }
            };
            
            const updateSpecialty = async (oldId, newName, originalName) => {
                // If name hasn't changed, just close editor (no toast)
                if (newName.trim() === originalName.trim()) {
                    setEditingSpecialty(null);
                    return;
                }
                
                if (!newName.trim()) {
                    showToast('Specialty name cannot be empty', 'error');
                    setEditingSpecialty(null);
                    return;
                }
                
                const { doc, setDoc } = window.firebaseModules;
                const updated = specialties.map(s => 
                    s.id === oldId ? { ...s, name: newName.trim() } : s
                );
                
                try {
                    await setDoc(doc(db, 'settings', 'specialties'), { list: updated });
                    setSpecialties(updated);
                    setEditingSpecialty(null);
                    showToast('Specialty updated successfully!');
                } catch (error) {
                    console.error('Error updating specialty:', error);
                    showToast('Error updating specialty', 'error');
                }
            };
            
            const deleteSpecialty = async (id) => {
                if (!confirm('Delete this specialty? Users with this specialty will need to be reassigned.')) return;
                
                const { doc, setDoc } = window.firebaseModules;
                const updated = specialties.filter(s => s.id !== id);
                
                try {
                    await setDoc(doc(db, 'settings', 'specialties'), { list: updated });
                    setSpecialties(updated);
                    showToast('Specialty deleted successfully');
                } catch (error) {
                    console.error('Error deleting specialty:', error);
                    showToast('Error deleting specialty', 'error');
                }
            };
            
            if (loading) {
                return (
                    <div className="p-8 max-w-4xl mx-auto">
                        <div className="text-center text-gray-500">Loading specialties...</div>
                    </div>
                );
            }
            
            return (
                <div className="p-8 max-w-4xl mx-auto">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Specialty Management</h1>
                        <p className="text-gray-600">Manage available specialties for users</p>
                    </div>
                    
                    {/* Add New Specialty */}
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">Add New Specialty</h2>
                        <div className="flex gap-3">
                            <input
                                type="text"
                                value={newSpecialty}
                                onChange={(e) => setNewSpecialty(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && addSpecialty()}
                                placeholder="e.g., Radiologist, Chiropractor"
                                className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none"
                            />
                            <button
                                onClick={addSpecialty}
                                className="px-6 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold rounded-lg hover:from-blue-600 hover:to-indigo-700 transition"
                            >
                                + Add Specialty
                            </button>
                        </div>
                    </div>
                    
                    {/* Specialties List */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">Current Specialties ({specialties.length})</h2>
                        
                        {specialties.length === 0 ? (
                            <p className="text-gray-500 text-center py-8">No specialties yet. Add one above!</p>
                        ) : (
                            <div className="space-y-3">
                                {specialties.map((specialty) => (
                                    <div key={specialty.id} className="flex items-center gap-3 p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                                        {editingSpecialty === specialty.id ? (
                                            <>
                                                <input
                                                    type="text"
                                                    defaultValue={specialty.name}
                                                    onKeyPress={(e) => {
                                                        if (e.key === 'Enter') {
                                                            updateSpecialty(specialty.id, e.target.value, specialty.name);
                                                        }
                                                    }}
                                                    className="flex-1 px-3 py-2 border-2 border-blue-500 rounded-lg focus:outline-none"
                                                    autoFocus
                                                    onBlur={(e) => updateSpecialty(specialty.id, e.target.value, specialty.name)}
                                                />
                                                <button
                                                    onClick={() => setEditingSpecialty(null)}
                                                    className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition"
                                                >
                                                    Cancel
                                                </button>
                                            </>
                                        ) : (
                                            <>
                                                <div className="flex-1">
                                                    <div className="font-semibold text-gray-800">{specialty.name}</div>
                                                    <div className="text-xs text-gray-500">ID: {specialty.id}</div>
                                                </div>
                                                <button
                                                    onClick={() => setEditingSpecialty(specialty.id)}
                                                    className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition"
                                                    title="Edit"
                                                >
                                                    <Icons.Edit className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => deleteSpecialty(specialty.id)}
                                                    className="p-2 text-red-600 hover:bg-red-50 rounded-lg transition"
                                                    title="Delete"
                                                >
                                                    <Icons.Trash className="w-5 h-5" />
                                                </button>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    
                    <div className="mt-6 p-4 bg-blue-50 border-2 border-blue-200 rounded-lg">
                        <p className="text-sm text-blue-800">
                            <strong>💡 Tip:</strong> Changes to specialties will be reflected immediately in user management. 
                            Existing users keep their specialty even if you delete it from this list.
                        </p>
                    </div>
                </div>
            );
        }
        
        // ============================================
        // ANALYTICS
