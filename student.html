<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accuro Training Platform - Student</title>
    
    <!-- Firebase v9 (modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, query, where, getDocs, onSnapshot, arrayUnion, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Make Firebase available globally
        window.firebaseModules = {
            initializeApp,
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            getFirestore,
            collection,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            query,
            where,
            getDocs,
            onSnapshot,
            arrayUnion,
            serverTimestamp,
            sendPasswordResetEmail
        };
    </script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #root { min-height: 100vh; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDtSuwTZnlvoWSz0E-imfMpV2etikcD7XA",
            authDomain: "accuro-trainer.firebaseapp.com",
            projectId: "accuro-trainer",
            storageBucket: "accuro-trainer.firebasestorage.app",
            messagingSenderId: "774405600835",
            appId: "1:774405600835:web:c3c5d5334c615f113946f6",
            measurementId: "G-2KMSC5WEMM"
        };
        
        // Initialize Firebase
        const { initializeApp, getAuth, getFirestore } = window.firebaseModules;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ============================================
        // ICONS
        // ============================================
        const LogOut = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        );
        
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );
        
        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );
        
        const CheckCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        
        // ============================================
        // LOGIN PAGE
        // ============================================
        function LoginPage() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [showResetPassword, setShowResetPassword] = useState(false);
            const [resetEmail, setResetEmail] = useState('');
            const [resetMessage, setResetMessage] = useState('');

            useEffect(() => {
                const savedEmail = localStorage.getItem('accuro_last_email');
                if (savedEmail) setEmail(savedEmail);
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    const { signInWithEmailAndPassword } = window.firebaseModules;
                    await signInWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('accuro_last_email', email);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            const handlePasswordReset = async (e) => {
                e.preventDefault();
                setResetMessage('');
                setError('');

                try {
                    const { sendPasswordResetEmail } = window.firebaseModules;
                    await sendPasswordResetEmail(auth, resetEmail);
                    setResetMessage('Password reset email sent! Check your inbox.');
                    setTimeout(() => {
                        setShowResetPassword(false);
                        setResetMessage('');
                    }, 3000);
                } catch (err) {
                    setError(err.message);
                }
            };

            if (showResetPassword) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">Reset Password</h2>
                            
                            <form onSubmit={handlePasswordReset} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                    <input
                                        type="email"
                                        value={resetEmail}
                                        onChange={(e) => setResetEmail(e.target.value)}
                                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        required
                                    />
                                </div>

                                {error && (
                                    <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-lg">
                                        {error}
                                    </div>
                                )}

                                {resetMessage && (
                                    <div className="bg-green-50 border-2 border-green-200 text-green-700 px-4 py-3 rounded-lg">
                                        {resetMessage}
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition"
                                >
                                    Send Reset Email
                                </button>

                                <button
                                    type="button"
                                    onClick={() => setShowResetPassword(false)}
                                    className="w-full text-indigo-600 hover:text-indigo-800 font-semibold"
                                >
                                    Back to Login
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black text-gray-800 mb-2">Accuro Training</h1>
                            <p className="text-gray-600">Student Portal</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                    placeholder="your.email@example.com"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                    placeholder="••••••••"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition disabled:opacity-50"
                            >
                                {loading ? 'Signing In...' : 'Sign In'}
                            </button>

                            <button
                                type="button"
                                onClick={() => setShowResetPassword(true)}
                                className="w-full text-sm text-indigo-600 hover:text-indigo-800 font-semibold"
                            >
                                Forgot Password?
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ============================================
        // STUDENT DASHBOARD - New Journey Cards UX
        // ============================================
        function StudentDashboard({ user, userProfile }) {
            const [availableJourneys, setAvailableJourneys] = useState([]);
            const [journeyProgress, setJourneyProgress] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard', 'journey', or 'quizgames'
            const [selectedJourney, setSelectedJourney] = useState(null);
            const [activeTab, setActiveTab] = useState('active'); // 'active', 'completed', or 'all'

            useEffect(() => {
                loadAllJourneys();
            }, []);

            const loadAllJourneys = async () => {
                const { collection, query, where, getDocs, doc, onSnapshot } = window.firebaseModules;

                try {
                    const journeysRef = collection(db, 'journeys');

                    // Query new format (array-contains)
                    const qNew = query(
                        journeysRef,
                        where('specialties', 'array-contains', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const newResults = await getDocs(qNew);

                    // Query old format (single specialty)
                    const qOld = query(
                        journeysRef,
                        where('specialty', '==', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const oldResults = await getDocs(qOld);

                    // Combine and deduplicate
                    const journeyMap = new Map();
                    newResults.docs.forEach(d => journeyMap.set(d.id, { id: d.id, ...d.data() }));
                    oldResults.docs.forEach(d => {
                        if (!journeyMap.has(d.id)) journeyMap.set(d.id, { id: d.id, ...d.data() });
                    });

                    const journeys = Array.from(journeyMap.values());
                    setAvailableJourneys(journeys);

                    // Load progress for each journey
                    for (const journey of journeys) {
                        const progressId = `${user.uid}_${journey.id}`;
                        const progressRef = doc(db, 'userProgress', progressId);

                        onSnapshot(progressRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setJourneyProgress(prev => ({
                                    ...prev,
                                    [journey.id]: docSnap.data()
                                }));
                            } else {
                                // Initialize progress
                                const { setDoc, serverTimestamp } = window.firebaseModules;
                                setDoc(progressRef, {
                                    userId: user.uid,
                                    journeyId: journey.id,
                                    specialty: userProfile.specialty,
                                    totalSteps: journey.stepIds?.length || 0,
                                    startedAt: serverTimestamp(),
                                    completedStepIds: [],
                                    status: 'in_progress',
                                    currentStepIndex: 0
                                });
                            }
                        });
                    }

                    setLoading(false);
                } catch (err) {
                    console.error('Error loading journeys:', err);
                    setLoading(false);
                }
            };

            const selectJourney = (journey) => {
                setSelectedJourney(journey);
                setCurrentView('journey');
            };

            const calculateProgressPercent = (journey) => {
                const progress = journeyProgress[journey.id];
                if (!progress || !journey.stepIds) return 0;
                return Math.round((progress.completedStepIds?.length || 0) / journey.stepIds.length * 100);
            };

            const handleSignOut = async () => {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading your training...</div>
                        </div>
                    </div>
                );
            }

            // Show quiz games view
            if (currentView === 'quizgames') {
                return (
                    <QuizGameView
                        user={user}
                        userProfile={userProfile}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );
            }
            
            // Show journey view
            if (currentView === 'journey' && selectedJourney) {
                return (
                    <JourneyView
                        user={user}
                        userProfile={userProfile}
                        journey={selectedJourney}
                        progress={journeyProgress[selectedJourney.id]}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );
            }

            // No journeys available
            if (availableJourneys.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-lg text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Welcome to Accuro Training!</h2>
                            <p className="text-lg text-indigo-600 font-semibold mb-6">
                                {userProfile.displayName} • {userProfile.specialty.toUpperCase()}
                            </p>

                            <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 mb-6">
                                <div className="text-4xl mb-3">🚧</div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Training Journey Coming Soon</h3>
                                <p className="text-gray-700">
                                    Your trainer is currently preparing training content.
                                </p>
                            </div>

                            <button
                                onClick={handleSignOut}
                                className="w-full px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg transition shadow-lg"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );
            }

            // Dashboard with journey cards
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800">Accuro Training</h1>
                                    <p className="text-sm text-gray-600">{userProfile.displayName} • {userProfile.specialty.toUpperCase()}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setCurrentView('quizgames')}
                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white rounded-lg transition font-semibold"
                                    >
                                        <span>🎮</span>
                                        Quiz Games
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                    >
                                        <LogOut className="w-4 h-4" />
                                        Sign Out
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Dashboard Content */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Welcome Section */}
                        <div className="mb-8">
                            <h2 className="text-3xl font-black text-gray-800 mb-2">
                                Welcome back, {userProfile.displayName.split(' ')[0]}! 👋
                            </h2>
                            <p className="text-gray-600 mb-4">
                                You have {availableJourneys.length} training {availableJourneys.length === 1 ? 'journey' : 'journeys'} available
                            </p>
                            
                            {/* Tabs */}
                            <div className="flex gap-2 border-b border-gray-200">
                                <button
                                    onClick={() => setActiveTab('active')}
                                    className={`px-6 py-3 font-semibold transition-all ${
                                        activeTab === 'active'
                                            ? 'border-b-2 border-indigo-600 text-indigo-600'
                                            : 'text-gray-600 hover:text-gray-800'
                                    }`}
                                >
                                    Active ({availableJourneys.filter(j => {
                                        const percent = calculateProgressPercent(j);
                                        return percent > 0 && percent < 100;
                                    }).length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('not-started')}
                                    className={`px-6 py-3 font-semibold transition-all ${
                                        activeTab === 'not-started'
                                            ? 'border-b-2 border-indigo-600 text-indigo-600'
                                            : 'text-gray-600 hover:text-gray-800'
                                    }`}
                                >
                                    Not Started ({availableJourneys.filter(j => calculateProgressPercent(j) === 0).length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('completed')}
                                    className={`px-6 py-3 font-semibold transition-all ${
                                        activeTab === 'completed'
                                            ? 'border-b-2 border-green-600 text-green-600'
                                            : 'text-gray-600 hover:text-gray-800'
                                    }`}
                                >
                                    Completed ({availableJourneys.filter(j => calculateProgressPercent(j) === 100).length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('all')}
                                    className={`px-6 py-3 font-semibold transition-all ${
                                        activeTab === 'all'
                                            ? 'border-b-2 border-indigo-600 text-indigo-600'
                                            : 'text-gray-600 hover:text-gray-800'
                                    }`}
                                >
                                    All ({availableJourneys.length})
                                </button>
                            </div>
                        </div>

                        {/* Journey Cards Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {availableJourneys
                                .filter(journey => {
                                    const progressPercent = calculateProgressPercent(journey);
                                    if (activeTab === 'active') {
                                        return progressPercent > 0 && progressPercent < 100;
                                    } else if (activeTab === 'not-started') {
                                        return progressPercent === 0;
                                    } else if (activeTab === 'completed') {
                                        return progressPercent === 100;
                                    }
                                    return true; // 'all' tab
                                })
                                .map(journey => {
                                const progress = journeyProgress[journey.id];
                                const progressPercent = calculateProgressPercent(journey);
                                const completedSteps = progress?.completedStepIds?.length || 0;
                                const totalSteps = journey.stepIds?.length || 0;
                                const isComplete = progressPercent === 100;
                                const isStarted = progressPercent > 0;

                                return (
                                    <div
                                        key={journey.id}
                                        className="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer group"
                                        onClick={() => selectJourney(journey)}
                                    >
                                        {/* Journey Header */}
                                        <div className="p-6 pb-4">
                                            <div className="flex items-start justify-between mb-3">
                                                <h3 className="text-xl font-bold text-gray-800 group-hover:text-indigo-600 transition flex-1">
                                                    {journey.title}
                                                </h3>
                                                {isComplete && (
                                                    <div className="text-2xl ml-2">🎉</div>
                                                )}
                                            </div>
                                            <p className="text-sm text-gray-600 mb-4 line-clamp-2">
                                                {journey.description}
                                            </p>

                                            {/* Progress Bar */}
                                            <div className="mb-4">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-semibold text-gray-600">
                                                        {isComplete ? 'Completed' : isStarted ? 'In Progress' : 'Not Started'}
                                                    </span>
                                                    <span className="text-xs font-bold text-indigo-600">
                                                        {progressPercent}%
                                                    </span>
                                                </div>
                                                <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                                    <div
                                                        className={`h-full transition-all duration-500 ${
                                                            isComplete
                                                                ? 'bg-gradient-to-r from-green-400 to-emerald-500'
                                                                : 'bg-gradient-to-r from-indigo-500 to-purple-500'
                                                        }`}
                                                        style={{ width: `${progressPercent}%` }}
                                                    />
                                                </div>
                                            </div>

                                            {/* Stats */}
                                            <div className="flex items-center gap-4 text-xs text-gray-500 mb-4">
                                                <span>📚 {completedSteps}/{totalSteps} steps</span>
                                                {journey.attachments?.length > 0 && (
                                                    <span>📎 {journey.attachments.length} resources</span>
                                                )}
                                            </div>
                                        </div>

                                        {/* Action Button */}
                                        <div className="px-6 pb-6">
                                            <button className={`w-full py-3 rounded-lg font-semibold transition ${
                                                isComplete
                                                    ? 'bg-green-500 hover:bg-green-600 text-white'
                                                    : isStarted
                                                        ? 'bg-indigo-500 hover:bg-indigo-600 text-white'
                                                        : 'bg-gray-100 hover:bg-gray-200 text-gray-800'
                                            }`}>
                                                {isComplete ? '✓ Review Journey' : isStarted ? 'Continue →' : 'Start Journey →'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {/* Empty State */}
                        {availableJourneys.filter(journey => {
                            const progressPercent = calculateProgressPercent(journey);
                            if (activeTab === 'active') {
                                return progressPercent > 0 && progressPercent < 100;
                            } else if (activeTab === 'not-started') {
                                return progressPercent === 0;
                            } else if (activeTab === 'completed') {
                                return progressPercent === 100;
                            }
                            return true;
                        }).length === 0 && (
                            <div className="text-center py-16 bg-white rounded-xl shadow-lg">
                                <div className="text-6xl mb-4">
                                    {activeTab === 'active' && '🚀'}
                                    {activeTab === 'not-started' && '📚'}
                                    {activeTab === 'completed' && '🎉'}
                                    {activeTab === 'all' && '📖'}
                                </div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-2">
                                    {activeTab === 'active' && 'No Active Training'}
                                    {activeTab === 'not-started' && 'All Journeys Started'}
                                    {activeTab === 'completed' && 'No Completed Journeys Yet'}
                                    {activeTab === 'all' && 'No Training Available'}
                                </h3>
                                <p className="text-gray-600">
                                    {activeTab === 'active' && 'Start a new journey or complete your current ones!'}
                                    {activeTab === 'not-started' && 'Great job! You\'ve started all available training.'}
                                    {activeTab === 'completed' && 'Complete your active journeys to see them here.'}
                                    {activeTab === 'all' && 'Your trainer will publish training journeys soon.'}
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // QUIZ GAME VIEW - Student Side
        // ============================================
        function QuizGameView({ user, userProfile, onBack }) {
            const [activeGames, setActiveGames] = useState([]);
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('lobby'); // 'lobby' or 'playing'
            const [selectedGame, setSelectedGame] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [questions, setQuestions] = useState([]);
            const [userAnswers, setUserAnswers] = useState([]);
            const [roundComplete, setRoundComplete] = useState(false);
            
            useEffect(() => {
                loadActiveGames();
            }, []);
            
            const loadActiveGames = async () => {
                const { collection, query, where, getDocs } = window.firebaseModules;
                
                try {
                    const q = query(collection(db, 'quizGames'), where('status', '==', 'active'));
                    const querySnapshot = await getDocs(q);
                    const gamesData = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Filter games where user is a team member
                    const userGames = gamesData.filter(game => 
                        game.teams?.some(team => team.playerIds.includes(user.uid))
                    );
                    
                    setActiveGames(userGames);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading games:', err);
                    setLoading(false);
                }
            };
            
            const getUserTeam = (game) => {
                return game.teams?.find(team => team.playerIds.includes(user.uid));
            };
            
            const startRound = async (game) => {
                // For MVP, generate sample questions
                // In production, these would come from completed journeys
                const sampleQuestions = [
                    {
                        id: 'q1',
                        question: 'What are the TWO pieces of ID required for patient check-in?',
                        options: [
                            'Health card + Driver\'s license',
                            'Health card + Birth certificate',
                            'Passport + Health card',
                            'Any two government IDs'
                        ],
                        correctAnswer: 0
                    },
                    {
                        id: 'q2',
                        question: 'What is the first step when a patient arrives?',
                        options: [
                            'Take vital signs',
                            'Verify identity',
                            'Collect payment',
                            'Update medical history'
                        ],
                        correctAnswer: 1
                    },
                    {
                        id: 'q3',
                        question: 'Where do you find patient appointment history in Accuro?',
                        options: [
                            'Dashboard → History',
                            'Patient Chart → Encounters',
                            'Reports → Appointments',
                            'Tools → Search'
                        ],
                        correctAnswer: 1
                    },
                    {
                        id: 'q4',
                        question: 'What should you do if a patient forgets their health card?',
                        options: [
                            'Refuse service',
                            'Ask for alternate ID and make a note',
                            'Bill them directly',
                            'Call their doctor'
                        ],
                        correctAnswer: 1
                    },
                    {
                        id: 'q5',
                        question: 'How do you book a follow-up appointment in Accuro?',
                        options: [
                            'File → New Appointment',
                            'Right-click patient → Book',
                            'Calendar → Add Appointment',
                            'Schedule → New'
                        ],
                        correctAnswer: 2
                    }
                ];
                
                setSelectedGame(game);
                setQuestions(sampleQuestions.slice(0, game.questionsPerRound || 5));
                setCurrentQuestion(0);
                setUserAnswers([]);
                setRoundComplete(false);
                setCurrentView('playing');
            };
            
            const submitAnswer = (answerIndex) => {
                const isCorrect = questions[currentQuestion].correctAnswer === answerIndex;
                const points = isCorrect ? 50 : 0;
                
                setUserAnswers([...userAnswers, {
                    questionId: questions[currentQuestion].id,
                    answer: answerIndex,
                    correct: isCorrect,
                    points: points
                }]);
                
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setRoundComplete(true);
                }
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading games...</div>
                        </div>
                    </div>
                );
            }
            
            // Playing a round
            if (currentView === 'playing' && selectedGame && !roundComplete) {
                const question = questions[currentQuestion];
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-indigo-50">
                        <div className="bg-white shadow-sm border-b border-gray-200">
                            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-800">{selectedGame.name}</h1>
                                        <p className="text-sm text-gray-600">Question {currentQuestion + 1} of {questions.length}</p>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-sm text-gray-600">Your Team</div>
                                        <div className="font-bold" style={{ color: getUserTeam(selectedGame).color }}>
                                            {getUserTeam(selectedGame).name}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            <div className="bg-white rounded-xl shadow-2xl p-8">
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-sm font-semibold text-gray-600">Progress</span>
                                        <span className="text-sm font-bold text-purple-600">
                                            {Math.round((currentQuestion / questions.length) * 100)}%
                                        </span>
                                    </div>
                                    <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                        <div 
                                            className="h-full bg-gradient-to-r from-purple-500 to-pink-500 transition-all duration-300"
                                            style={{ width: `${(currentQuestion / questions.length) * 100}%` }}
                                        />
                                    </div>
                                </div>
                                
                                <h2 className="text-2xl font-bold text-gray-800 mb-8">
                                    {question.question}
                                </h2>
                                
                                <div className="space-y-3">
                                    {question.options.map((option, index) => (
                                        <button
                                            key={index}
                                            onClick={() => submitAnswer(index)}
                                            className="w-full text-left p-4 border-2 border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition group"
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 rounded-full bg-gray-200 group-hover:bg-purple-500 flex items-center justify-center font-bold text-gray-700 group-hover:text-white transition">
                                                    {String.fromCharCode(65 + index)}
                                                </div>
                                                <span className="text-gray-800 font-medium">{option}</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Round complete
            if (roundComplete && selectedGame) {
                const totalPoints = userAnswers.reduce((sum, a) => sum + a.points, 0);
                const correctCount = userAnswers.filter(a => a.correct).length;
                const accuracy = Math.round((correctCount / userAnswers.length) * 100);
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-indigo-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🎉</div>
                                <h2 className="text-3xl font-bold text-gray-800 mb-2">Round Complete!</h2>
                                <p className="text-gray-600">Great job on this round</p>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-4 mb-8">
                                <div className="bg-gradient-to-br from-purple-50 to-purple-100 rounded-xl p-4 text-center">
                                    <div className="text-3xl font-bold text-purple-600">{totalPoints}</div>
                                    <div className="text-sm text-gray-600">Points Earned</div>
                                </div>
                                <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-4 text-center">
                                    <div className="text-3xl font-bold text-green-600">{correctCount}/{userAnswers.length}</div>
                                    <div className="text-sm text-gray-600">Correct</div>
                                </div>
                                <div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-4 text-center">
                                    <div className="text-3xl font-bold text-blue-600">{accuracy}%</div>
                                    <div className="text-sm text-gray-600">Accuracy</div>
                                </div>
                            </div>
                            
                            <div className="mb-8">
                                <h3 className="font-bold text-gray-800 mb-3">Your Answers:</h3>
                                <div className="space-y-2">
                                    {userAnswers.map((answer, i) => (
                                        <div key={i} className="flex items-center gap-2 text-sm">
                                            <span className={`w-6 h-6 rounded-full flex items-center justify-center text-white ${
                                                answer.correct ? 'bg-green-500' : 'bg-red-500'
                                            }`}>
                                                {answer.correct ? '✓' : '✗'}
                                            </span>
                                            <span className="text-gray-700">
                                                Question {i + 1}: {answer.points} pts
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="flex gap-3">
                                <button
                                    onClick={() => {
                                        setCurrentView('lobby');
                                        setSelectedGame(null);
                                    }}
                                    className="flex-1 px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold rounded-lg hover:from-purple-600 hover:to-pink-700 transition"
                                >
                                    Back to Games
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }
            
            // Game lobby
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800">Quiz Games</h1>
                                    <p className="text-sm text-gray-600">Compete with your team!</p>
                                </div>
                                <button
                                    onClick={onBack}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <ChevronLeft className="w-4 h-4" />
                                    Back to Dashboard
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeGames.length === 0 ? (
                            <div className="bg-white rounded-xl shadow-lg p-12 text-center">
                                <div className="text-6xl mb-4">🎮</div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">No Active Games</h2>
                                <p className="text-gray-600">Your trainer will create quiz games soon!</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {activeGames.map(game => {
                                    const userTeam = getUserTeam(game);
                                    const sortedTeams = [...(game.teams || [])].sort((a, b) => b.totalPoints - a.totalPoints);
                                    
                                    return (
                                        <div key={game.id} className="bg-white rounded-xl shadow-lg overflow-hidden">
                                            <div className="bg-gradient-to-r from-purple-500 to-pink-600 p-6">
                                                <h3 className="text-2xl font-bold text-white mb-2">{game.name}</h3>
                                                <div className="flex items-center gap-2">
                                                    <div className="w-3 h-3 rounded-full" style={{ backgroundColor: userTeam.color }}></div>
                                                    <span className="text-white font-semibold">{userTeam.name}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="p-6">
                                                <div className="mb-6">
                                                    <h4 className="font-bold text-gray-800 mb-3">Leaderboard</h4>
                                                    <div className="space-y-2">
                                                        {sortedTeams.map((team, index) => (
                                                            <div 
                                                                key={team.id}
                                                                className={`flex items-center justify-between p-3 rounded-lg ${
                                                                    team.id === userTeam.id ? 'bg-purple-50 border-2 border-purple-200' : 'bg-gray-50'
                                                                }`}
                                                            >
                                                                <div className="flex items-center gap-3">
                                                                    <span className="text-2xl">
                                                                        {index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : ''}
                                                                    </span>
                                                                    <div className="w-3 h-3 rounded-full" style={{ backgroundColor: team.color }}></div>
                                                                    <span className="font-semibold text-gray-800">{team.name}</span>
                                                                </div>
                                                                <span className="font-bold text-gray-700">{team.totalPoints} pts</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                                
                                                <button
                                                    onClick={() => startRound(game)}
                                                    className="w-full px-6 py-4 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white font-bold rounded-lg transition text-lg"
                                                >
                                                    🎮 Play Round
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        
        // ============================================
        // JOURNEY VIEW
        // ============================================
        function JourneyView({ user, userProfile, journey, progress, onBack }) {
            const [steps, setSteps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeStep, setActiveStep] = useState(0);
            const [showDetails, setShowDetails] = useState(null);

            useEffect(() => {
                loadJourneySteps();
            }, [journey.id]);

            const loadJourneySteps = async () => {
                const { doc, getDoc } = window.firebaseModules;

                try {
                    const stepsPromises = journey.stepIds.map(stepId =>
                        getDoc(doc(db, 'steps', stepId))
                    );
                    const stepsDocs = await Promise.all(stepsPromises);
                    const stepsData = stepsDocs
                        .filter(doc => doc.exists())
                        .map(doc => ({ id: doc.id, ...doc.data() }));

                    // Load tasks for each step
                    for (let step of stepsData) {
                        if (step.taskIds && step.taskIds.length > 0) {
                            const tasksPromises = step.taskIds.map(taskId =>
                                getDoc(doc(db, 'tasks', taskId))
                            );
                            const tasksDocs = await Promise.all(tasksPromises);
                            step.tasks = tasksDocs
                                .filter(doc => doc.exists())
                                .map(doc => ({ id: doc.id, ...doc.data() }))
                                .sort((a, b) => a.order - b.order);
                        } else {
                            step.tasks = [];
                        }
                    }

                    stepsData.sort((a, b) => a.order - b.order);
                    setSteps(stepsData);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading steps:', err);
                    setLoading(false);
                }
            };

            const markComplete = async (stepId, index) => {
                const { doc, updateDoc, arrayUnion, serverTimestamp } = window.firebaseModules;

                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: arrayUnion(stepId),
                        currentStepIndex: index + 1,
                        lastUpdated: serverTimestamp()
                    });

                    if (index < steps.length - 1) {
                        setActiveStep(index + 1);
                        setShowDetails(index + 1);
                    }
                } catch (err) {
                    console.error('Error marking complete:', err);
                }
            };

            const resetJourney = async () => {
                if (!confirm('Are you sure you want to reset your progress?')) return;

                const { doc, updateDoc } = window.firebaseModules;
                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: [],
                        currentStepIndex: 0,
                        status: 'in_progress'
                    });
                    setActiveStep(0);
                    setShowDetails(null);
                } catch (err) {
                    console.error('Error resetting:', err);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading journey...</div>
                        </div>
                    </div>
                );
            }

            const completedStepIds = progress?.completedStepIds || [];
            const progressPercent = Math.round((completedStepIds.length / steps.length) * 100);

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <button
                                    onClick={onBack}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <ChevronLeft className="w-4 h-4" />
                                    Back to Dashboard
                                </button>
                                <div className="text-center flex-1">
                                    <h1 className="text-xl font-bold text-gray-800">{journey.title}</h1>
                                    <p className="text-sm text-gray-600">{completedStepIds.length} of {steps.length} steps completed</p>
                                </div>
                                <button
                                    onClick={resetJourney}
                                    className="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition"
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Progress Bar */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-semibold text-gray-600">Overall Progress</span>
                                <span className="text-2xl font-bold text-indigo-600">{progressPercent}%</span>
                            </div>
                            <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                        </div>

                        {/* Steps */}
                        <div className="space-y-4">
                            {steps.map((step, index) => {
                                const isCompleted = completedStepIds.includes(step.id);
                                const isActive = index === activeStep;
                                const canAccess = index === 0 || completedStepIds.includes(steps[index - 1]?.id);

                                return (
                                    <div
                                        key={step.id}
                                        className={`bg-white rounded-xl shadow-lg overflow-hidden transition-all ${
                                            isActive ? 'ring-2 ring-indigo-500' : ''
                                        }`}
                                    >
                                        <div
                                            className={`p-6 cursor-pointer ${
                                                !canAccess ? 'opacity-50 cursor-not-allowed' : ''
                                            }`}
                                            onClick={() => canAccess && setShowDetails(showDetails === index ? null : index)}
                                        >
                                            <div className="flex items-start justify-between">
                                                <div className="flex items-start gap-4 flex-1">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                                                        isCompleted
                                                            ? 'bg-green-500'
                                                            : isActive
                                                                ? 'bg-indigo-500'
                                                                : 'bg-gray-300'
                                                    }`}>
                                                        {isCompleted ? (
                                                            <CheckCircle className="w-5 h-5 text-white" />
                                                        ) : (
                                                            <span className="text-white font-bold text-sm">{index + 1}</span>
                                                        )}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h3 className="text-lg font-bold text-gray-800 mb-1">{step.title}</h3>
                                                        <p className="text-sm text-gray-600">{step.description}</p>
                                                        <div className="mt-2 text-xs text-gray-500">
                                                            {step.tasks?.length || 0} tasks
                                                        </div>
                                                    </div>
                                                </div>
                                                <ChevronRight className={`w-5 h-5 text-gray-400 transition-transform ${
                                                    showDetails === index ? 'rotate-90' : ''
                                                }`} />
                                            </div>
                                        </div>

                                        {/* Step Details */}
                                        {showDetails === index && canAccess && (
                                            <div className="px-6 pb-6 border-t border-gray-200 pt-4">
                                                {step.tasks && step.tasks.length > 0 ? (
                                                    <div className="space-y-3">
                                                        {step.tasks.map((task, taskIndex) => (
                                                            <div key={task.id} className="bg-gray-50 rounded-lg p-4">
                                                                <div className="flex items-start gap-3">
                                                                    <span className="text-indigo-600 font-bold text-sm">{taskIndex + 1}.</span>
                                                                    <div className="flex-1">
                                                                        <p className="font-semibold text-gray-800 mb-1">{task.action}</p>
                                                                        {task.accuroNavigation && (
                                                                            <p className="text-sm text-gray-600 font-mono bg-white px-2 py-1 rounded mb-2">
                                                                                {task.accuroNavigation}
                                                                            </p>
                                                                        )}
                                                                        {task.estimatedTime && (
                                                                            <p className="text-xs text-gray-500">⏱️ {task.estimatedTime}</p>
                                                                        )}
                                                                        
                                                                        {/* Media URLs (Screenshots & Videos) */}
                                                                        {task.screenshotUrls && task.screenshotUrls.length > 0 && (
                                                                            <div className="mt-3 space-y-3">
                                                                                {task.screenshotUrls.filter(url => url).map((url, i) => {
                                                                                    // Detect if it's a video
                                                                                    const isYouTube = url.includes('youtube.com') || url.includes('youtu.be');
                                                                                    const isVimeo = url.includes('vimeo.com');
                                                                                    const isLoom = url.includes('loom.com');
                                                                                    const isScribe = url.includes('scribehow.com');
                                                                                    const isIframe = url.includes('iframe') || url.includes('<iframe');
                                                                                    const isVideo = isYouTube || isVimeo || isLoom || isScribe || isIframe;
                                                                                    
                                                                                    // Extract embed URL
                                                                                    let embedUrl = url;
                                                                                    
                                                                                    // YouTube
                                                                                    if (isYouTube) {
                                                                                        if (url.includes('youtube.com/watch?v=')) {
                                                                                            const videoId = url.split('v=')[1]?.split('&')[0];
                                                                                            embedUrl = `https://www.youtube.com/embed/${videoId}`;
                                                                                        } else if (url.includes('youtu.be/')) {
                                                                                            const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                                                                                            embedUrl = `https://www.youtube.com/embed/${videoId}`;
                                                                                        }
                                                                                    }
                                                                                    
                                                                                    // Vimeo
                                                                                    if (isVimeo && !url.includes('/video/')) {
                                                                                        const videoId = url.split('vimeo.com/')[1]?.split('?')[0];
                                                                                        embedUrl = `https://player.vimeo.com/video/${videoId}`;
                                                                                    }
                                                                                    
                                                                                    // Loom
                                                                                    if (isLoom && url.includes('/share/')) {
                                                                                        const videoId = url.split('/share/')[1]?.split('?')[0];
                                                                                        embedUrl = `https://www.loom.com/embed/${videoId}`;
                                                                                    }
                                                                                    
                                                                                    // Scribe - extract from iframe if needed
                                                                                    if (isScribe && isIframe) {
                                                                                        const srcMatch = url.match(/src="([^"]+)"/);
                                                                                        if (srcMatch) embedUrl = srcMatch[1];
                                                                                    }
                                                                                    
                                                                                    // Generic iframe extraction
                                                                                    if (isIframe && url.includes('src=')) {
                                                                                        const srcMatch = url.match(/src="([^"]+)"/);
                                                                                        if (srcMatch) embedUrl = srcMatch[1];
                                                                                    }
                                                                                    
                                                                                    return (
                                                                                        <div key={i}>
                                                                                            {isVideo ? (
                                                                                                // Video embed
                                                                                                <div className="bg-white rounded-lg overflow-hidden border-2 border-gray-200">
                                                                                                    <div className="bg-gradient-to-r from-indigo-500 to-purple-500 px-3 py-2 flex items-center gap-2">
                                                                                                        <span className="text-white text-sm">🎬</span>
                                                                                                        <span className="text-white text-xs font-semibold">
                                                                                                            Video Tutorial {task.screenshotUrls.filter(u => u).length > 1 ? `#${i + 1}` : ''}
                                                                                                        </span>
                                                                                                    </div>
                                                                                                    <div className="relative" style={{ paddingBottom: '56.25%', height: 0 }}>
                                                                                                        <iframe
                                                                                                            src={embedUrl}
                                                                                                            className="absolute top-0 left-0 w-full h-full"
                                                                                                            frameBorder="0"
                                                                                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                                                                            allowFullScreen
                                                                                                            title={`Video Tutorial ${i + 1}`}
                                                                                                        />
                                                                                                    </div>
                                                                                                </div>
                                                                                            ) : (
                                                                                                // Regular screenshot link
                                                                                                <a
                                                                                                    href={url}
                                                                                                    target="_blank"
                                                                                                    rel="noopener noreferrer"
                                                                                                    className="flex items-center gap-2 text-xs text-blue-600 hover:underline bg-blue-50 px-3 py-2 rounded"
                                                                                                >
                                                                                                    <span>📸</span>
                                                                                                    <span>Screenshot {task.screenshotUrls.filter(u => u).length > 1 ? `#${i + 1}` : ''} - Click to view</span>
                                                                                                </a>
                                                                                            )}
                                                                                        </div>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                        
                                                                        {/* Backward compatibility for single URL */}
                                                                        {task.screenshotUrl && !task.screenshotUrls && (
                                                                            <a
                                                                                href={task.screenshotUrl}
                                                                                target="_blank"
                                                                                rel="noopener noreferrer"
                                                                                className="block text-xs text-blue-600 hover:underline mt-2"
                                                                            >
                                                                                🔗 Screenshot
                                                                            </a>
