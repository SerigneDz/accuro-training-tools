<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accuro Training Platform - Student</title>
    
    <!-- Firebase v9 (modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, query, where, getDocs, onSnapshot, arrayUnion, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Make Firebase available globally
        window.firebaseModules = {
            initializeApp,
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            getFirestore,
            collection,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            query,
            where,
            getDocs,
            onSnapshot,
            arrayUnion,
            serverTimestamp,
            sendPasswordResetEmail
        };
    </script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #root { min-height: 100vh; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDtSuwTZnlvoWSz0E-imfMpV2etikcD7XA",
            authDomain: "accuro-trainer.firebaseapp.com",
            projectId: "accuro-trainer",
            storageBucket: "accuro-trainer.firebasestorage.app",
            messagingSenderId: "774405600835",
            appId: "1:774405600835:web:c3c5d5334c615f113946f6",
            measurementId: "G-2KMSC5WEMM"
        };
        
        // Initialize Firebase
        const { initializeApp, getAuth, getFirestore } = window.firebaseModules;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ============================================
        // ICONS
        // ============================================
        const LogOut = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        );
        
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );
        
        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );
        
        const CheckCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        
        // ============================================
        // LOGIN PAGE
        // ============================================
        function LoginPage() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [showResetPassword, setShowResetPassword] = useState(false);
            const [resetEmail, setResetEmail] = useState('');
            const [resetMessage, setResetMessage] = useState('');

            useEffect(() => {
                const savedEmail = localStorage.getItem('accuro_last_email');
                if (savedEmail) setEmail(savedEmail);
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                try {
                    const { signInWithEmailAndPassword } = window.firebaseModules;
                    await signInWithEmailAndPassword(auth, email, password);
                    localStorage.setItem('accuro_last_email', email);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            const handlePasswordReset = async (e) => {
                e.preventDefault();
                setResetMessage('');
                setError('');

                try {
                    const { sendPasswordResetEmail } = window.firebaseModules;
                    await sendPasswordResetEmail(auth, resetEmail);
                    setResetMessage('Password reset email sent! Check your inbox.');
                    setTimeout(() => {
                        setShowResetPassword(false);
                        setResetMessage('');
                    }, 3000);
                } catch (err) {
                    setError(err.message);
                }
            };

            if (showResetPassword) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">Reset Password</h2>
                            
                            <form onSubmit={handlePasswordReset} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                    <input
                                        type="email"
                                        value={resetEmail}
                                        onChange={(e) => setResetEmail(e.target.value)}
                                        className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        required
                                    />
                                </div>

                                {error && (
                                    <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-lg">
                                        {error}
                                    </div>
                                )}

                                {resetMessage && (
                                    <div className="bg-green-50 border-2 border-green-200 text-green-700 px-4 py-3 rounded-lg">
                                        {resetMessage}
                                    </div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition"
                                >
                                    Send Reset Email
                                </button>

                                <button
                                    type="button"
                                    onClick={() => setShowResetPassword(false)}
                                    className="w-full text-indigo-600 hover:text-indigo-800 font-semibold"
                                >
                                    Back to Login
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black text-gray-800 mb-2">Accuro Training</h1>
                            <p className="text-gray-600">Student Portal</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                    placeholder="your.email@example.com"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                    placeholder="••••••••"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 border-2 border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-4 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition disabled:opacity-50"
                            >
                                {loading ? 'Signing In...' : 'Sign In'}
                            </button>

                            <button
                                type="button"
                                onClick={() => setShowResetPassword(true)}
                                className="w-full text-sm text-indigo-600 hover:text-indigo-800 font-semibold"
                            >
                                Forgot Password?
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ============================================
        // STUDENT DASHBOARD - New Journey Cards UX
        // ============================================
        function StudentDashboard({ user, userProfile }) {
            const [availableJourneys, setAvailableJourneys] = useState([]);
            const [journeyProgress, setJourneyProgress] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard' or 'journey'
            const [selectedJourney, setSelectedJourney] = useState(null);

            useEffect(() => {
                loadAllJourneys();
            }, []);

            const loadAllJourneys = async () => {
                const { collection, query, where, getDocs, doc, onSnapshot } = window.firebaseModules;

                try {
                    const journeysRef = collection(db, 'journeys');

                    // Query new format (array-contains)
                    const qNew = query(
                        journeysRef,
                        where('specialties', 'array-contains', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const newResults = await getDocs(qNew);

                    // Query old format (single specialty)
                    const qOld = query(
                        journeysRef,
                        where('specialty', '==', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const oldResults = await getDocs(qOld);

                    // Combine and deduplicate
                    const journeyMap = new Map();
                    newResults.docs.forEach(d => journeyMap.set(d.id, { id: d.id, ...d.data() }));
                    oldResults.docs.forEach(d => {
                        if (!journeyMap.has(d.id)) journeyMap.set(d.id, { id: d.id, ...d.data() });
                    });

                    const journeys = Array.from(journeyMap.values());
                    setAvailableJourneys(journeys);

                    // Load progress for each journey
                    for (const journey of journeys) {
                        const progressId = `${user.uid}_${journey.id}`;
                        const progressRef = doc(db, 'userProgress', progressId);

                        onSnapshot(progressRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setJourneyProgress(prev => ({
                                    ...prev,
                                    [journey.id]: docSnap.data()
                                }));
                            } else {
                                // Initialize progress
                                const { setDoc, serverTimestamp } = window.firebaseModules;
                                setDoc(progressRef, {
                                    userId: user.uid,
                                    journeyId: journey.id,
                                    specialty: userProfile.specialty,
                                    totalSteps: journey.stepIds?.length || 0,
                                    startedAt: serverTimestamp(),
                                    completedStepIds: [],
                                    status: 'in_progress',
                                    currentStepIndex: 0
                                });
                            }
                        });
                    }

                    setLoading(false);
                } catch (err) {
                    console.error('Error loading journeys:', err);
                    setLoading(false);
                }
            };

            const selectJourney = (journey) => {
                setSelectedJourney(journey);
                setCurrentView('journey');
            };

            const calculateProgressPercent = (journey) => {
                const progress = journeyProgress[journey.id];
                if (!progress || !journey.stepIds) return 0;
                return Math.round((progress.completedStepIds?.length || 0) / journey.stepIds.length * 100);
            };

            const handleSignOut = async () => {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading your training...</div>
                        </div>
                    </div>
                );
            }

            // Show journey view
            if (currentView === 'journey' && selectedJourney) {
                return (
                    <JourneyView
                        user={user}
                        userProfile={userProfile}
                        journey={selectedJourney}
                        progress={journeyProgress[selectedJourney.id]}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );
            }

            // No journeys available
            if (availableJourneys.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-4">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-lg text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Welcome to Accuro Training!</h2>
                            <p className="text-lg text-indigo-600 font-semibold mb-6">
                                {userProfile.displayName} • {userProfile.specialty.toUpperCase()}
                            </p>

                            <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 mb-6">
                                <div className="text-4xl mb-3">🚧</div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Training Journey Coming Soon</h3>
                                <p className="text-gray-700">
                                    Your trainer is currently preparing training content.
                                </p>
                            </div>

                            <button
                                onClick={handleSignOut}
                                className="w-full px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg transition shadow-lg"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );
            }

            // Dashboard with journey cards
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800">Accuro Training</h1>
                                    <p className="text-sm text-gray-600">{userProfile.displayName} • {userProfile.specialty.toUpperCase()}</p>
                                </div>
                                <button
                                    onClick={handleSignOut}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <LogOut className="w-4 h-4" />
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Dashboard Content */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Welcome Section */}
                        <div className="mb-8">
                            <h2 className="text-3xl font-black text-gray-800 mb-2">
                                Welcome back, {userProfile.displayName.split(' ')[0]}! 👋
                            </h2>
                            <p className="text-gray-600">
                                You have {availableJourneys.length} training {availableJourneys.length === 1 ? 'journey' : 'journeys'} available
                            </p>
                        </div>

                        {/* Journey Cards Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {availableJourneys.map(journey => {
                                const progress = journeyProgress[journey.id];
                                const progressPercent = calculateProgressPercent(journey);
                                const completedSteps = progress?.completedStepIds?.length || 0;
                                const totalSteps = journey.stepIds?.length || 0;
                                const isComplete = progressPercent === 100;
                                const isStarted = progressPercent > 0;

                                return (
                                    <div
                                        key={journey.id}
                                        className="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer group"
                                        onClick={() => selectJourney(journey)}
                                    >
                                        {/* Journey Header */}
                                        <div className="p-6 pb-4">
                                            <div className="flex items-start justify-between mb-3">
                                                <h3 className="text-xl font-bold text-gray-800 group-hover:text-indigo-600 transition flex-1">
                                                    {journey.title}
                                                </h3>
                                                {isComplete && (
                                                    <div className="text-2xl ml-2">🎉</div>
                                                )}
                                            </div>
                                            <p className="text-sm text-gray-600 mb-4 line-clamp-2">
                                                {journey.description}
                                            </p>

                                            {/* Progress Bar */}
                                            <div className="mb-4">
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-xs font-semibold text-gray-600">
                                                        {isComplete ? 'Completed' : isStarted ? 'In Progress' : 'Not Started'}
                                                    </span>
                                                    <span className="text-xs font-bold text-indigo-600">
                                                        {progressPercent}%
                                                    </span>
                                                </div>
                                                <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                                    <div
                                                        className={`h-full transition-all duration-500 ${
                                                            isComplete
                                                                ? 'bg-gradient-to-r from-green-400 to-emerald-500'
                                                                : 'bg-gradient-to-r from-indigo-500 to-purple-500'
                                                        }`}
                                                        style={{ width: `${progressPercent}%` }}
                                                    />
                                                </div>
                                            </div>

                                            {/* Stats */}
                                            <div className="flex items-center gap-4 text-xs text-gray-500 mb-4">
                                                <span>📚 {completedSteps}/{totalSteps} steps</span>
                                                {journey.attachments?.length > 0 && (
                                                    <span>📎 {journey.attachments.length} resources</span>
                                                )}
                                            </div>
                                        </div>

                                        {/* Action Button */}
                                        <div className="px-6 pb-6">
                                            <button className={`w-full py-3 rounded-lg font-semibold transition ${
                                                isComplete
                                                    ? 'bg-green-500 hover:bg-green-600 text-white'
                                                    : isStarted
                                                        ? 'bg-indigo-500 hover:bg-indigo-600 text-white'
                                                        : 'bg-gray-100 hover:bg-gray-200 text-gray-800'
                                            }`}>
                                                {isComplete ? '✓ Review Journey' : isStarted ? 'Continue →' : 'Start Journey →'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // JOURNEY VIEW
        // ============================================
        function JourneyView({ user, userProfile, journey, progress, onBack }) {
            const [steps, setSteps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeStep, setActiveStep] = useState(0);
            const [showDetails, setShowDetails] = useState(null);

            useEffect(() => {
                loadJourneySteps();
            }, [journey.id]);

            const loadJourneySteps = async () => {
                const { doc, getDoc } = window.firebaseModules;

                try {
                    const stepsPromises = journey.stepIds.map(stepId =>
                        getDoc(doc(db, 'steps', stepId))
                    );
                    const stepsDocs = await Promise.all(stepsPromises);
                    const stepsData = stepsDocs
                        .filter(doc => doc.exists())
                        .map(doc => ({ id: doc.id, ...doc.data() }));

                    // Load tasks for each step
                    for (let step of stepsData) {
                        if (step.taskIds && step.taskIds.length > 0) {
                            const tasksPromises = step.taskIds.map(taskId =>
                                getDoc(doc(db, 'tasks', taskId))
                            );
                            const tasksDocs = await Promise.all(tasksPromises);
                            step.tasks = tasksDocs
                                .filter(doc => doc.exists())
                                .map(doc => ({ id: doc.id, ...doc.data() }))
                                .sort((a, b) => a.order - b.order);
                        } else {
                            step.tasks = [];
                        }
                    }

                    stepsData.sort((a, b) => a.order - b.order);
                    setSteps(stepsData);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading steps:', err);
                    setLoading(false);
                }
            };

            const markComplete = async (stepId, index) => {
                const { doc, updateDoc, arrayUnion, serverTimestamp } = window.firebaseModules;

                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: arrayUnion(stepId),
                        currentStepIndex: index + 1,
                        lastUpdated: serverTimestamp()
                    });

                    if (index < steps.length - 1) {
                        setActiveStep(index + 1);
                        setShowDetails(index + 1);
                    }
                } catch (err) {
                    console.error('Error marking complete:', err);
                }
            };

            const resetJourney = async () => {
                if (!confirm('Are you sure you want to reset your progress?')) return;

                const { doc, updateDoc } = window.firebaseModules;
                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: [],
                        currentStepIndex: 0,
                        status: 'in_progress'
                    });
                    setActiveStep(0);
                    setShowDetails(null);
                } catch (err) {
                    console.error('Error resetting:', err);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading journey...</div>
                        </div>
                    </div>
                );
            }

            const completedStepIds = progress?.completedStepIds || [];
            const progressPercent = Math.round((completedStepIds.length / steps.length) * 100);

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <button
                                    onClick={onBack}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <ChevronLeft className="w-4 h-4" />
                                    Back to Dashboard
                                </button>
                                <div className="text-center flex-1">
                                    <h1 className="text-xl font-bold text-gray-800">{journey.title}</h1>
                                    <p className="text-sm text-gray-600">{completedStepIds.length} of {steps.length} steps completed</p>
                                </div>
                                <button
                                    onClick={resetJourney}
                                    className="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition"
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Progress Bar */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-semibold text-gray-600">Overall Progress</span>
                                <span className="text-2xl font-bold text-indigo-600">{progressPercent}%</span>
                            </div>
                            <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                        </div>

                        {/* Steps */}
                        <div className="space-y-4">
                            {steps.map((step, index) => {
                                const isCompleted = completedStepIds.includes(step.id);
                                const isActive = index === activeStep;
                                const canAccess = index === 0 || completedStepIds.includes(steps[index - 1]?.id);

                                return (
                                    <div
                                        key={step.id}
                                        className={`bg-white rounded-xl shadow-lg overflow-hidden transition-all ${
                                            isActive ? 'ring-2 ring-indigo-500' : ''
                                        }`}
                                    >
                                        <div
                                            className={`p-6 cursor-pointer ${
                                                !canAccess ? 'opacity-50 cursor-not-allowed' : ''
                                            }`}
                                            onClick={() => canAccess && setShowDetails(showDetails === index ? null : index)}
                                        >
                                            <div className="flex items-start justify-between">
                                                <div className="flex items-start gap-4 flex-1">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                                                        isCompleted
                                                            ? 'bg-green-500'
                                                            : isActive
                                                                ? 'bg-indigo-500'
                                                                : 'bg-gray-300'
                                                    }`}>
                                                        {isCompleted ? (
                                                            <CheckCircle className="w-5 h-5 text-white" />
                                                        ) : (
                                                            <span className="text-white font-bold text-sm">{index + 1}</span>
                                                        )}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h3 className="text-lg font-bold text-gray-800 mb-1">{step.title}</h3>
                                                        <p className="text-sm text-gray-600">{step.description}</p>
                                                        <div className="mt-2 text-xs text-gray-500">
                                                            {step.tasks?.length || 0} tasks
                                                        </div>
                                                    </div>
                                                </div>
                                                <ChevronRight className={`w-5 h-5 text-gray-400 transition-transform ${
                                                    showDetails === index ? 'rotate-90' : ''
                                                }`} />
                                            </div>
                                        </div>

                                        {/* Step Details */}
                                        {showDetails === index && canAccess && (
                                            <div className="px-6 pb-6 border-t border-gray-200 pt-4">
                                                {step.tasks && step.tasks.length > 0 ? (
                                                    <div className="space-y-3">
                                                        {step.tasks.map((task, taskIndex) => (
                                                            <div key={task.id} className="bg-gray-50 rounded-lg p-4">
                                                                <div className="flex items-start gap-3">
                                                                    <span className="text-indigo-600 font-bold text-sm">{taskIndex + 1}.</span>
                                                                    <div className="flex-1">
                                                                        <p className="font-semibold text-gray-800 mb-1">{task.action}</p>
                                                                        {task.accuroNavigation && (
                                                                            <p className="text-sm text-gray-600 font-mono bg-white px-2 py-1 rounded mb-2">
                                                                                {task.accuroNavigation}
                                                                            </p>
                                                                        )}
                                                                        {task.estimatedTime && (
                                                                            <p className="text-xs text-gray-500">⏱️ {task.estimatedTime}</p>
                                                                        )}
                                                                        {/* Multiple Screenshot URLs */}
                                                                        {task.screenshotUrls && task.screenshotUrls.length > 0 && (
                                                                            <div className="mt-2 space-y-1">
                                                                                {task.screenshotUrls.filter(url => url).map((url, i) => (
                                                                                    <a
                                                                                        key={i}
                                                                                        href={url}
                                                                                        target="_blank"
                                                                                        rel="noopener noreferrer"
                                                                                        className="block text-xs text-blue-600 hover:underline"
                                                                                    >
                                                                                        🔗 Screenshot {task.screenshotUrls.filter(u => u).length > 1 ? `#${i + 1}` : ''}
                                                                                    </a>
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                        {/* Backward compatibility for single URL */}
                                                                        {task.screenshotUrl && !task.screenshotUrls && (
                                                                            <a
                                                                                href={task.screenshotUrl}
                                                                                target="_blank"
                                                                                rel="noopener noreferrer"
                                                                                className="block text-xs text-blue-600 hover:underline mt-2"
                                                                            >
                                                                                🔗 Screenshot
                                                                            </a>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <p className="text-sm text-gray-500">No tasks for this step</p>
                                                )}

                                                {/* Mark Complete Button */}
                                                {!isCompleted && (
                                                    <button
                                                        onClick={() => markComplete(step.id, index)}
                                                        className="mt-4 w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-lg transition"
                                                    >
                                                        Mark as Complete
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Reference Materials */}
                        {journey.attachments && journey.attachments.length > 0 && (
                            <div className="mt-8 bg-white rounded-xl shadow-lg p-6">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">📎 Reference Materials</h3>
                                <div className="space-y-2">
                                    {journey.attachments.map((link, index) => (
                                        <a
                                            key={index}
                                            href={link.url}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-800 hover:underline p-2 hover:bg-indigo-50 rounded transition"
                                        >
                                            <span>🔗</span>
                                            <span className="flex-1">{link.name}</span>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Completion Message */}
                        {progressPercent === 100 && (
                            <div className="mt-8 bg-gradient-to-r from-green-400 to-emerald-500 rounded-xl shadow-lg p-8 text-center text-white">
                                <div className="text-6xl mb-4">🏆</div>
                                <h3 className="text-3xl font-black mb-2">Journey Complete!</h3>
                                <p className="text-xl mb-6">
                                    Congratulations! You've completed the {journey.title}
                                </p>
                                <div className="flex gap-4 justify-center">
                                    <button
                                        onClick={onBack}
                                        className="bg-white text-green-600 px-8 py-4 rounded-xl font-bold text-lg hover:bg-green-50 transition-colors shadow-lg"
                                    >
                                        Back to Dashboard
                                    </button>
                                    <button
                                        onClick={resetJourney}
                                        className="bg-green-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition-colors shadow-lg"
                                    >
                                        Practice Again
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const { onAuthStateChanged } = window.firebaseModules;

                const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);

                        const { doc, getDoc } = window.firebaseModules;
                        const userDoc = await getDoc(doc(db, 'users', firebaseUser.uid));

                        if (userDoc.exists()) {
                            const userData = userDoc.data();
                            // Only allow students
                            if (userData.role === 'student') {
                                setUserProfile(userData);
                            } else {
                                alert('Access denied. This is the student portal.');
                                const { signOut } = window.firebaseModules;
                                await signOut(auth);
                            }
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                    }
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Loading...</div>
                    </div>
                );
            }

            if (!user || !userProfile) {
                return <LoginPage />;
            }

            return <StudentDashboard user={user} userProfile={userProfile} />;
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
