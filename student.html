    <!-- Firebase v9 (modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, query, where, getDocs, onSnapshot, arrayUnion, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Make Firebase available globally
        window.firebaseModules = {
            initializeApp,
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            getFirestore,
            collection,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            query,
            where,
            getDocs,
            onSnapshot,
            arrayUnion,
            serverTimestamp,
            sendPasswordResetEmail
        };
        window.firebaseModulesReady = true;
        window.dispatchEvent(new Event('firebase-modules-ready'));
    </script>
    
    <script>
        // Global error catcher - shows JS errors directly on page instead of a blank white screen
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root && !root.hasChildNodes()) {
                root.innerHTML = 
                    '<div style="padding:40px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px;">' +
                    '<h2 style="margin-top:0;">Page Error</h2>' +
                    '<p><strong>' + (e.message || 'Unknown error') + '</strong></p>' +
                    '<p style="font-size:13px;">' + (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + '</p>' +
                    '</div>';
            }
        });
    </script>

        // ============================================
        // SHARED HELPERS - CALENDAR & EDUCATION

        const EDUCATION_STATUS = {
            not_started: { label: 'Not Started', color: 'bg-gray-100 text-gray-600', icon: '○' },
            in_progress: { label: 'In Progress', color: 'bg-yellow-100 text-yellow-700', icon: '⏳' },
            completed: { label: 'Completed', color: 'bg-green-100 text-green-700', icon: '✅' },
            overdue: { label: 'Overdue', color: 'bg-red-100 text-red-700', icon: '⚠️' }
        };
        
        function formatDateDisplay(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }
        
        function formatTime12hr(timeStr) {
            if (!timeStr) return '';
            const [hourStr, minStr] = timeStr.split(':');
            let hour = parseInt(hourStr, 10);
            const period = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour}:${minStr} ${period}`;
        }
        
        function sortTasksByTime(tasks) {
            if (!tasks) return [];
            const withTime = tasks.filter(t => t.time);
            const withoutTime = tasks.filter(t => !t.time);
            withTime.sort((a, b) => a.time.localeCompare(b.time));
            return [...withTime, ...withoutTime];
        }
        
        function getEducationStatus(course, progress) {
            if (!progress || progress.status === 'not_started' || !progress.status) {
                return 'not_started';
            }
            if (progress.status === 'in_progress') return 'in_progress';
            
            if (course.recurringAnnual && progress.completedDate) {
                const completed = new Date(progress.completedDate + '-01');
                const now = new Date();
                const oneYearLater = new Date(completed);
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                if (now > oneYearLater) return 'overdue';
            }
            return 'completed';
        }
        
        // ============================================

        // ============================================

        // ============================================
        // STUDENT DASHBOARD - New Journey Cards UX

        // ============================================
        // TRAINING SCHEDULE VIEW (Onboarding Calendar)
        // ============================================
        function TrainingScheduleView({ user, userProfile, onBack, availableJourneys, onOpenJourney }) {
            const [allSchedules, setAllSchedules] = useState([]);
            const [schedule, setSchedule] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedDayIndex, setSelectedDayIndex] = useState(null);
            const [viewMode, setViewMode] = useState('list'); // list | week
            
            useEffect(() => {
                loadSchedule();
            }, []);
            
            const loadSchedule = async () => {
                try {
                    const { collection, getDocs, query, where } = window.firebaseModules;
                    const snapshot = await getDocs(
                        query(collection(db, 'healthcare_schedules'), where('employeeId', '==', user.uid))
                    );
                    if (!snapshot.empty) {
                        const schedules = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        // Show active schedules first, most recently started first
                        schedules.sort((a, b) => {
                            if (a.status === 'active' && b.status !== 'active') return -1;
                            if (b.status === 'active' && a.status !== 'active') return 1;
                            return (b.startDate || '').localeCompare(a.startDate || '');
                        });
                        setAllSchedules(schedules);
                        selectSchedule(schedules[0]);
                    }
                } catch (err) {
                    console.error('Error loading training schedule:', err);
                } finally {
                    setLoading(false);
                }
            };
            
            const selectSchedule = (sched) => {
                setSchedule(sched);
                // Auto-select today's item, or first incomplete one
                const todayStr = new Date().toISOString().split('T')[0];
                const todayIdx = sched.items.findIndex(item => item.date === todayStr);
                if (todayIdx >= 0) {
                    setSelectedDayIndex(todayIdx);
                } else {
                    const firstIncomplete = sched.items.findIndex(item => item.scheduleItemStatus !== 'completed');
                    setSelectedDayIndex(firstIncomplete >= 0 ? firstIncomplete : 0);
                }
            };
            
            const calculateProgress = () => {
                if (!schedule) return 0;
                let totalTasks = 0;
                let completedTasks = 0;
                let daysWithNoTasks = 0;
                let daysWithNoTasksCompleted = 0;
                
                schedule.items.forEach(item => {
                    const tasks = item.tasks || [];
                    if (tasks.length === 0) {
                        daysWithNoTasks++;
                        if (item.scheduleItemStatus === 'completed') daysWithNoTasksCompleted++;
                    } else {
                        totalTasks += tasks.length;
                        completedTasks += tasks.filter(t => t.status === 'completed').length;
                    }
                });
                
                const combinedTotal = totalTasks + daysWithNoTasks;
                const combinedCompleted = completedTasks + daysWithNoTasksCompleted;
                
                return combinedTotal > 0 ? Math.round((combinedCompleted / combinedTotal) * 100) : 0;
            };
            
            const toggleTaskComplete = async (dayIndex, taskIndex) => {
                const { doc, updateDoc } = window.firebaseModules;
                const updatedItems = schedule.items.map((item, i) => {
                    if (i !== dayIndex) return item;
                    const updatedTasks = item.tasks.map((t, ti) => 
                        ti === taskIndex ? { ...t, status: t.status === 'completed' ? 'pending' : 'completed' } : t
                    );
                    // Auto-update day status based on task completion
                    const allDone = updatedTasks.length > 0 && updatedTasks.every(t => t.status === 'completed');
                    const anyDone = updatedTasks.some(t => t.status === 'completed');
                    const dayStatus = allDone ? 'completed' : (anyDone ? 'in_progress' : 'pending');
                    return { ...item, tasks: updatedTasks, scheduleItemStatus: dayStatus };
                });
                
                try {
                    await updateDoc(doc(db, 'healthcare_schedules', schedule.id), { items: updatedItems });
                    setSchedule(prev => ({ ...prev, items: updatedItems }));
                    setAllSchedules(prev => prev.map(s => s.id === schedule.id ? { ...s, items: updatedItems } : s));
                } catch (err) {
                    console.error('Error updating task:', err);
                }
            };
            
            const markDayComplete = async (dayIndex) => {
                const { doc, updateDoc } = window.firebaseModules;
                const updatedItems = schedule.items.map((item, i) => {
                    if (i !== dayIndex) return item;
                    return {
                        ...item,
                        scheduleItemStatus: 'completed',
                        tasks: (item.tasks || []).map(t => ({ ...t, status: 'completed' }))
                    };
                });
                
                try {
                    await updateDoc(doc(db, 'healthcare_schedules', schedule.id), { items: updatedItems });
                    setSchedule(prev => ({ ...prev, items: updatedItems }));
                    setAllSchedules(prev => prev.map(s => s.id === schedule.id ? { ...s, items: updatedItems } : s));
                } catch (err) {
                    console.error('Error marking day complete:', err);
                }
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">📅</div>
                            <div className="text-xl font-semibold text-gray-600">Loading your training schedule...</div>
                        </div>
                    </div>
                );
            }
            
            if (!schedule) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <Header title="Training Schedule" onBack={onBack} userProfile={userProfile} />
                        <div className="max-w-3xl mx-auto px-4 py-12">
                            <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                                <div className="text-6xl mb-4">📅</div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">No Active Onboarding Schedule</h2>
                                <p className="text-gray-600">You don't have an onboarding schedule assigned right now. Check back later or ask your manager.</p>
                            </div>
                        </div>
                    </div>
                );
            }
            
            const progress = calculateProgress();
            const todayStr = new Date().toISOString().split('T')[0];
            const selectedItem = selectedDayIndex !== null ? schedule.items[selectedDayIndex] : null;
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    <Header title="📅 Training Schedule" onBack={onBack} userProfile={userProfile} />
                    
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {/* Schedule Switcher (only shown if multiple schedules assigned) */}
                        {allSchedules.length > 1 && (
                            <div className="mb-4 flex items-center gap-3">
                                <label className="text-sm font-semibold text-gray-600">Viewing:</label>
                                <select
                                    value={schedule.id}
                                    onChange={e => selectSchedule(allSchedules.find(s => s.id === e.target.value))}
                                    className="px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                >
                                    {allSchedules.map(s => (
                                        <option key={s.id} value={s.id}>
                                            {s.templateName} ({formatDateDisplay(s.startDate)}) {s.status !== 'active' ? `- ${s.status}` : ''}
                                        </option>
                                    ))}
                                </select>
                            </div>
                        )}
                        
                        {/* Progress Overview */}
                        <div className="bg-white rounded-2xl shadow-sm p-6 mb-6">
                            <div className="flex flex-wrap justify-between items-center gap-4 mb-3">
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800">{schedule.templateName}</h2>
                                    <p className="text-sm text-gray-500">
                                        {formatDateDisplay(schedule.startDate)} → {formatDateDisplay(schedule.endDate)}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <div className="text-2xl font-bold text-indigo-600">{progress}%</div>
                                    <div className="text-xs text-gray-400">Complete</div>
                                </div>
                            </div>
                            <div className="w-full bg-gray-100 rounded-full h-3">
                                <div className="bg-gradient-to-r from-indigo-500 to-purple-600 h-3 rounded-full transition-all" style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Day List */}
                            <div className="lg:col-span-1">
                                <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
                                    <div className="px-4 py-3 border-b border-gray-100 font-semibold text-gray-700">
                                        Schedule
                                    </div>
                                    <div className="max-h-[600px] overflow-y-auto">
                                        {schedule.items.map((item, i) => {
                                            const isToday = item.date === todayStr;
                                            const isSelected = i === selectedDayIndex;
                                            const statusIcon = item.scheduleItemStatus === 'completed' ? '✅' 
                                                : item.scheduleItemStatus === 'in_progress' ? '⏳' : '○';
                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => setSelectedDayIndex(i)}
                                                    className={`w-full text-left px-4 py-3 border-b border-gray-50 last:border-b-0 transition ${
                                                        isSelected ? 'bg-indigo-50' : 'hover:bg-gray-50'
                                                    }`}
                                                >
                                                    <div className="flex items-center justify-between">
                                                        <div>
                                                            <div className="flex items-center gap-2">
                                                                <span>{statusIcon}</span>
                                                                <span className="text-sm font-medium text-gray-800">Day {item.dayNumber}</span>
                                                                {isToday && (

        // ============================================
        // MY EDUCATION VIEW (Continuing Education)
        // ============================================
        function MyEducationView({ user, userProfile, onBack }) {
            const [courses, setCourses] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [progress, setProgress] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filterStatus, setFilterStatus] = useState('all');
            
            useEffect(() => {
                loadAll();
            }, []);
            
            const loadAll = async () => {
                setLoading(true);
                try {
                    const { collection, getDocs, query, where } = window.firebaseModules;
                    
                    const [coursesSnap, posAssignSnap, indivAssignSnap, progressSnap] = await Promise.all([
                        getDocs(collection(db, 'education_courses')),
                        getDocs(query(collection(db, 'education_assignments'), where('assignType', '==', 'position'))),
                        getDocs(query(collection(db, 'education_assignments'), where('assignType', '==', 'individual'), where('userId', '==', user.uid))),
                        getDocs(query(collection(db, 'education_progress'), where('userId', '==', user.uid)))
                    ]);
                    
                    setCourses(coursesSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                    
                    // Match position-based assignments against the student's specialties array
                    // (supports both the new multi-specialty array and legacy single specialty/position field)
                    const myStudentSpecialties = (userProfile.specialties && userProfile.specialties.length > 0)
                        ? userProfile.specialties
                        : [userProfile.specialty || userProfile.position].filter(Boolean);
                    const mySpecialtiesLower = myStudentSpecialties.map(s => s.toLowerCase());
                    
                    const posAssignments = posAssignSnap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(a => (a.specialties || []).some(s => mySpecialtiesLower.includes(s.toLowerCase())));
                    
                    const allAssignments = [
                        ...posAssignments,
                        ...indivAssignSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                    ];
                    // Dedupe by courseId
                    const seen = new Set();
                    const deduped = allAssignments.filter(a => {
                        if (seen.has(a.courseId)) return false;
                        seen.add(a.courseId);
                        return true;
                    });
                    setAssignments(deduped);
                    
                    setProgress(progressSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch (err) {
                    console.error('Error loading education data:', err);
                } finally {
                    setLoading(false);
                }
            };
            
            const updateStatus = async (courseId, courseName, newStatus) => {
                const { doc, setDoc, serverTimestamp } = window.firebaseModules;
                try {
                    const id = `${user.uid}_${courseId}`;
                    const data = {
                        userId: user.uid,
                        userName: userProfile.displayName,
                        courseId, courseName,
                        status: newStatus,
                        updatedAt: serverTimestamp()
                    };
                    if (newStatus === 'completed') {
                        const now = new Date();
                        data.completedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                    }
                    await setDoc(doc(db, 'education_progress', id), data, { merge: true });
                    loadAll();
                } catch (err) {
                    console.error('Error updating progress:', err);
                }
            };
            
            const getProgressRecord = (courseId) => progress.find(p => p.courseId === courseId);
            
            const rows = assignments
                .map(a => {
                    const course = courses.find(c => c.id === a.courseId);
                    if (!course) return null;
                    const progressRecord = getProgressRecord(a.courseId);
                    const status = getEducationStatus(course, progressRecord);
                    return { course, assignment: a, progressRecord, status };
                })
                .filter(Boolean);
            
            const filteredRows = filterStatus === 'all' ? rows : rows.filter(r => r.status === filterStatus);
            
            const summary = {
                total: rows.length,
                completed: rows.filter(r => r.status === 'completed').length,
                overdue: rows.filter(r => r.status === 'overdue').length
            };
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">📚</div>
                            <div className="text-xl font-semibold text-gray-600">Loading your courses...</div>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    <Header title="📚 My Education" onBack={onBack} userProfile={userProfile} />
                    
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        {rows.length === 0 ? (
                            <div className="bg-white rounded-2xl shadow-xl p-8 text-center">
                                <div className="text-6xl mb-4">📚</div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">No Required Courses Yet</h2>
                                <p className="text-gray-600">You don't have any required continuing education courses assigned right now.</p>
                            </div>
                        ) : (
                            <>
                                {/* Summary */}
                                <div className="grid grid-cols-3 gap-4 mb-6">
                                    <div className="bg-white rounded-xl shadow-sm p-4 text-center">
                                        <div className="text-2xl font-bold text-gray-800">{summary.total}</div>
                                        <div className="text-sm text-gray-500">Required</div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm p-4 text-center">
                                        <div className="text-2xl font-bold text-green-600">{summary.completed}</div>
                                        <div className="text-sm text-gray-500">Completed</div>
                                    </div>
                                    <div className="bg-white rounded-xl shadow-sm p-4 text-center">
                                        <div className="text-2xl font-bold text-red-600">{summary.overdue}</div>
                                        <div className="text-sm text-gray-500">Overdue</div>
                                    </div>
                                </div>
                                
                                {/* Filter */}
                                <div className="flex gap-2 mb-4 flex-wrap">
                                    {['all', 'not_started', 'in_progress', 'completed', 'overdue'].map(s => (
                                        <button
                                            key={s}
                                            onClick={() => setFilterStatus(s)}
                                            className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${
                                                filterStatus === s ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'
                                            }`}
                                        >
                                            {s === 'all' ? 'All' : EDUCATION_STATUS[s].label}
                                        </button>
                                    ))}
                                </div>
                                
                                {/* Course List */}
                                <div className="space-y-3">
                                    {filteredRows.map((row, i) => {
                                        const statusInfo = EDUCATION_STATUS[row.status];
                                        return (
                                            <div key={i} className="bg-white rounded-xl shadow-sm p-4">
                                                <div className="flex justify-between items-start gap-4">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-1">
                                                            <h3 className="font-semibold text-gray-800">{row.course.title}</h3>
                                                            {row.assignment.recurringAnnual && (
                                                                <span title="Required annually"><RefreshCw className="w-4 h-4 text-purple-500" /></span>
                                                            )}
                                                        </div>
                                                        <div className="text-sm text-gray-500 flex flex-wrap gap-3">
                                                            {row.course.host && <span>{row.course.host}</span>}
                                                            {row.course.estTimeToComplete && <span>⏱ {row.course.estTimeToComplete}</span>}
                                                            {row.progressRecord?.completedDate && <span>Completed: {row.progressRecord.completedDate}</span>}
                                                        </div>
                                                        {row.course.websiteLink && (
                                                            <a 
                                                                href={row.course.websiteLink} 
                                                                target="_blank" 
                                                                rel="noopener noreferrer"
                                                                className="inline-flex items-center gap-1 text-indigo-600 hover:text-indigo-800 text-sm mt-2"
                                                            >
                                                                Go to course <ExternalLink className="w-3 h-3" />
                                                            </a>
                                                        )}
                                                    </div>
                                                    <div className="text-right flex flex-col items-end gap-2">
                                                        <span className={`text-xs px-2 py-1 rounded-full font-medium ${statusInfo.color}`}>
                                                            {statusInfo.icon} {statusInfo.label}
                                                        </span>
                                                        <select
                                                            value={row.progressRecord?.status || 'not_started'}
                                                            onChange={e => updateStatus(row.course.id, row.course.title, e.target.value)}
                                                            className="px-2 py-1 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                                        >
                                                            <option value="not_started">Not Started</option>
                                                            <option value="in_progress">In Progress</option>
                                                            <option value="completed">Completed</option>
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }
        
        function StudentDashboard({ user, userProfile }) {
            const [availableJourneys, setAvailableJourneys] = useState([]);
            const [journeyProgress, setJourneyProgress] = useState({});
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard', 'journey', 'quizgames', 'schedule', or 'education'
            const [selectedJourney, setSelectedJourney] = useState(null);
            const [activeTab, setActiveTab] = useState('active'); // 'active', 'completed', or 'all'

            useEffect(() => {
                loadAllJourneys();
            }, []);

            const loadAllJourneys = async () => {
                const { collection, query, where, getDocs, doc, onSnapshot } = window.firebaseModules;

                try {
                    const journeysRef = collection(db, 'journeys');

                    // Query new format (array-contains)
                    const qNew = query(
                        journeysRef,
                        where('specialties', 'array-contains', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const newResults = await getDocs(qNew);

                    // Query old format (single specialty)
                    const qOld = query(
                        journeysRef,
                        where('specialty', '==', userProfile.specialty),
                        where('status', '==', 'published')
                    );
                    const oldResults = await getDocs(qOld);

                    // Combine and deduplicate
                    const journeyMap = new Map();
                    newResults.docs.forEach(d => journeyMap.set(d.id, { id: d.id, ...d.data() }));
                    oldResults.docs.forEach(d => {
                        if (!journeyMap.has(d.id)) journeyMap.set(d.id, { id: d.id, ...d.data() });
                    });

                    const journeys = Array.from(journeyMap.values());
                    setAvailableJourneys(journeys);

                    // Load progress for each journey
                    for (const journey of journeys) {
                        const progressId = `${user.uid}_${journey.id}`;
                        const progressRef = doc(db, 'userProgress', progressId);

                        onSnapshot(progressRef, (docSnap) => {
                            if (docSnap.exists()) {
                                setJourneyProgress(prev => ({
                                    ...prev,
                                    [journey.id]: docSnap.data()
                                }));
                            } else {
                                // Initialize progress
                                const { setDoc, serverTimestamp } = window.firebaseModules;
                                setDoc(progressRef, {
                                    userId: user.uid,
                                    journeyId: journey.id,
                                    specialty: userProfile.specialty,
                                    totalSteps: journey.stepIds?.length || 0,
                                    startedAt: serverTimestamp(),
                                    completedStepIds: [],
                                    status: 'in_progress',
                                    currentStepIndex: 0
                                });
                            }
                        });
                    }

                    setLoading(false);
                } catch (err) {
                    console.error('Error loading journeys:', err);
                    setLoading(false);
                }
            };

            const selectJourney = (journey) => {
                setSelectedJourney(journey);
                setCurrentView('journey');
            };

            const calculateProgressPercent = (journey) => {
                const progress = journeyProgress[journey.id];
                if (!progress || !journey.stepIds) return 0;
                return Math.round((progress.completedStepIds?.length || 0) / journey.stepIds.length * 100);
            };

            const handleSignOut = async () => {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading your training...</div>
                        </div>
                    </div>
                );
            }

            // Show quiz games view
            if (currentView === 'quizgames') {
                return (
                    <QuizGameView
                        user={user}
                        userProfile={userProfile}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );
            }
            
            // Show training schedule view
            if (currentView === 'schedule') {
                return (
                    <TrainingScheduleView
                        user={user}
                        userProfile={userProfile}
                        onBack={() => setCurrentView('dashboard')}
                        availableJourneys={availableJourneys}
                        onOpenJourney={(journeyId) => {
                            const journey = availableJourneys.find(j => j.id === journeyId);
                            if (journey) {
                                selectJourney(journey);
                            } else {
                                // Journey not visible to this student (e.g. specialty mismatch) - fall back to dashboard
                                setCurrentView('dashboard');
                            }
                        }}
                    />
                );
            }
            
            // Show continuing education view
            if (currentView === 'education') {
                return (
                    <MyEducationView
                        user={user}
                        userProfile={userProfile}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );
            }
            
            // Show journey view
            if (currentView === 'journey' && selectedJourney) {
                return (
                    <JourneyView
                        user={user}
                        userProfile={userProfile}
                        journey={selectedJourney}
                        progress={journeyProgress[selectedJourney.id]}
                        onBack={() => setCurrentView('dashboard')}
                    />
                );

                                <div className="text-4xl mb-3">🚧</div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Training Journey Coming Soon</h3>
                                <p className="text-gray-700">
                                    Your trainer is currently preparing training content.
                                </p>
                            </div>

                            <button
                                onClick={handleSignOut}
                                className="w-full px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-lg transition shadow-lg"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>
                );

            // Dashboard with journey cards
            return (

                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-800">Accuro Training</h1>
                                    <p className="text-sm text-gray-600">{userProfile.displayName} • {userProfile.specialty.toUpperCase()}</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setCurrentView('schedule')}
                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white rounded-lg transition font-semibold"
                                    >
                                        <Calendar className="w-4 h-4" />
                                        Training Schedule
                                    </button>
                                    <button
                                        onClick={() => setCurrentView('education')}
                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white rounded-lg transition font-semibold"
                                    >
                                        <BookOpen className="w-4 h-4" />
                                        My Education
                                    </button>
                                    <button
                                        onClick={() => setCurrentView('quizgames')}
                                        className="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 text-white rounded-lg transition font-semibold"
                                    >
                                        <span>🎮</span>
                                        Quiz Games

                                        onClick={handleSignOut}
                                        className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"

                                        Sign Out

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            const loadActiveGames = async () => {
                const { collection, query, where, getDocs } = window.firebaseModules;
                
                try {
                    const q = query(collection(db, 'quizGames'), where('status', '==', 'active'));
                    const querySnapshot = await getDocs(q);
                    const gamesData = querySnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Filter games where user is a team member
                    const userGames = gamesData.filter(game => 
                        game.teams?.some(team => team.playerIds.includes(user.uid))
                    );

                    setLoading(false);

        // ============================================
        // JOURNEY VIEW
        // ============================================
        function JourneyView({ user, userProfile, journey, progress, onBack }) {
            const [steps, setSteps] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeStep, setActiveStep] = useState(0);
            const [showDetails, setShowDetails] = useState(null);

            useEffect(() => {
                loadJourneySteps();
            }, [journey.id]);

            const loadJourneySteps = async () => {
                const { doc, getDoc } = window.firebaseModules;

                try {
                    const stepsPromises = journey.stepIds.map(stepId =>
                        getDoc(doc(db, 'steps', stepId))
                    );
                    const stepsDocs = await Promise.all(stepsPromises);
                    const stepsData = stepsDocs
                        .filter(doc => doc.exists())
                        .map(doc => ({ id: doc.id, ...doc.data() }));

                    // Load tasks for each step
                    for (let step of stepsData) {
                        if (step.taskIds && step.taskIds.length > 0) {
                            const tasksPromises = step.taskIds.map(taskId =>
                                getDoc(doc(db, 'tasks', taskId))
                            );
                            const tasksDocs = await Promise.all(tasksPromises);
                            step.tasks = tasksDocs
                                .filter(doc => doc.exists())
                                .map(doc => ({ id: doc.id, ...doc.data() }))
                                .sort((a, b) => a.order - b.order);
                        } else {
                            step.tasks = [];
                        }
                    }

                    stepsData.sort((a, b) => a.order - b.order);
                    setSteps(stepsData);
                    setLoading(false);
                } catch (err) {
                    console.error('Error loading steps:', err);
                    setLoading(false);
                }
            };

            const markComplete = async (stepId, index) => {
                const { doc, updateDoc, arrayUnion, serverTimestamp } = window.firebaseModules;

                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: arrayUnion(stepId),
                        currentStepIndex: index + 1,
                        lastUpdated: serverTimestamp()
                    });

                    if (index < steps.length - 1) {
                        setActiveStep(index + 1);
                        setShowDetails(index + 1);
                    }
                } catch (err) {
                    console.error('Error marking complete:', err);
                }
            };

            const resetJourney = async () => {
                if (!confirm('Are you sure you want to reset your progress?')) return;

                const { doc, updateDoc } = window.firebaseModules;
                const progressId = `${user.uid}_${journey.id}`;
                const progressRef = doc(db, 'userProgress', progressId);

                try {
                    await updateDoc(progressRef, {
                        completedStepIds: [],
                        currentStepIndex: 0,
                        status: 'in_progress'
                    });
                    setActiveStep(0);
                    setShowDetails(null);
                } catch (err) {
                    console.error('Error resetting:', err);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-xl font-semibold text-gray-600">Loading journey...</div>
                        </div>
                    </div>
                );
            }

            const completedStepIds = progress?.completedStepIds || [];
            const progressPercent = Math.round((completedStepIds.length / steps.length) * 100);

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
                    {/* Header */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <button
                                    onClick={onBack}
                                    className="flex items-center gap-2 px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition"
                                >
                                    <ChevronLeft className="w-4 h-4" />
                                    Back to Dashboard
                                </button>
                                <div className="text-center flex-1">
                                    <h1 className="text-xl font-bold text-gray-800">{journey.title}</h1>
                                    <p className="text-sm text-gray-600">{completedStepIds.length} of {steps.length} steps completed</p>
                                </div>
                                <button
                                    onClick={resetJourney}
                                    className="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition"
                                >
                                    Reset
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Progress Bar */}
                        <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-semibold text-gray-600">Overall Progress</span>
                                <span className="text-2xl font-bold text-indigo-600">{progressPercent}%</span>
                            </div>
                            <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
                                <div
                                    className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                        </div>

                        {/* Steps */}
                        <div className="space-y-4">
                            {steps.map((step, index) => {
                                const isCompleted = completedStepIds.includes(step.id);
                                const isActive = index === activeStep;
                                const canAccess = index === 0 || completedStepIds.includes(steps[index - 1]?.id);

                                return (
                                    <div
                                        key={step.id}
                                        className={`bg-white rounded-xl shadow-lg overflow-hidden transition-all ${
                                            isActive ? 'ring-2 ring-indigo-500' : ''
                                        }`}
                                    >
                                        <div
                                            className={`p-6 cursor-pointer ${
                                                !canAccess ? 'opacity-50 cursor-not-allowed' : ''
                                            }`}
                                            onClick={() => canAccess && setShowDetails(showDetails === index ? null : index)}
                                        >
                                            <div className="flex items-start justify-between">
                                                <div className="flex items-start gap-4 flex-1">
                                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                                                        isCompleted
                                                            ? 'bg-green-500'
                                                            : isActive
                                                                ? 'bg-indigo-500'
                                                                : 'bg-gray-300'
                                                    }`}>
                                                        {isCompleted ? (
                                                            <CheckCircle className="w-5 h-5 text-white" />
                                                        ) : (
                                                            <span className="text-white font-bold text-sm">{index + 1}</span>
                                                        )}
                                                    </div>
                                                    <div className="flex-1">
                                                        <h3 className="text-lg font-bold text-gray-800 mb-1">{step.title}</h3>
                                                        <p className="text-sm text-gray-600">{step.description}</p>
                                                        <div className="mt-2 text-xs text-gray-500">
                                                            {step.tasks?.length || 0} tasks
                                                        </div>
                                                    </div>
                                                </div>
                                                <ChevronRight className={`w-5 h-5 text-gray-400 transition-transform ${
                                                    showDetails === index ? 'rotate-90' : ''
                                                }`} />
                                            </div>
                                        </div>

                                        {/* Step Details */}
                                        {showDetails === index && canAccess && (
                                            <div className="px-6 pb-6 border-t border-gray-200 pt-4">
                                                {step.tasks && step.tasks.length > 0 ? (
                                                    <div className="space-y-3">
                                                        {step.tasks.map((task, taskIndex) => (
                                                            <div key={task.id} className="bg-gray-50 rounded-lg p-4">
                                                                <div className="flex items-start gap-3">
                                                                    <span className="text-indigo-600 font-bold text-sm">{taskIndex + 1}.</span>
                                                                    <div className="flex-1">
                                                                        <p className="font-semibold text-gray-800 mb-1">{task.action}</p>
                                                                        {task.accuroNavigation && (
                                                                            <p className="text-sm text-gray-600 font-mono bg-white px-2 py-1 rounded mb-2">
                                                                                {task.accuroNavigation}
                                                                            </p>
                                                                        )}
                                                                        {task.estimatedTime && (
                                                                            <p className="text-xs text-gray-500">⏱️ {task.estimatedTime}</p>
                                                                        )}
                                                                        
                                                                        {/* Media URLs (Screenshots & Videos) */}
                                                                        {task.screenshotUrls && task.screenshotUrls.length > 0 && (
                                                                            <div className="mt-3 space-y-3">
                                                                                {task.screenshotUrls.filter(url => url).map((url, i) => {
                                                                                    // Detect if it's a video
                                                                                    const isYouTube = url.includes('youtube.com') || url.includes('youtu.be');
                                                                                    const isVimeo = url.includes('vimeo.com');
                                                                                    const isLoom = url.includes('loom.com');
                                                                                    const isScribe = url.includes('scribehow.com');
                                                                                    const isIframe = url.includes('iframe') || url.includes('<iframe');
                                                                                    const isVideo = isYouTube || isVimeo || isLoom || isScribe || isIframe;
                                                                                    
                                                                                    // Extract embed URL
                                                                                    let embedUrl = url;
                                                                                    
                                                                                    // YouTube
                                                                                    if (isYouTube) {
                                                                                        if (url.includes('youtube.com/watch?v=')) {
                                                                                            const videoId = url.split('v=')[1]?.split('&')[0];
                                                                                            embedUrl = `https://www.youtube.com/embed/${videoId}`;
                                                                                        } else if (url.includes('youtu.be/')) {
                                                                                            const videoId = url.split('youtu.be/')[1]?.split('?')[0];
                                                                                            embedUrl = `https://www.youtube.com/embed/${videoId}`;
                                                                                        }
                                                                                    }
                                                                                    
                                                                                    // Vimeo
                                                                                    if (isVimeo && !url.includes('/video/')) {
                                                                                        const videoId = url.split('vimeo.com/')[1]?.split('?')[0];
                                                                                        embedUrl = `https://player.vimeo.com/video/${videoId}`;
                                                                                    }
                                                                                    
                                                                                    // Loom
                                                                                    if (isLoom && url.includes('/share/')) {
                                                                                        const videoId = url.split('/share/')[1]?.split('?')[0];
                                                                                        embedUrl = `https://www.loom.com/embed/${videoId}`;
                                                                                    }
                                                                                    
                                                                                    // Scribe - extract from iframe if needed
                                                                                    if (isScribe && isIframe) {
                                                                                        const srcMatch = url.match(/src="([^"]+)"/);
                                                                                        if (srcMatch) embedUrl = srcMatch[1];
                                                                                    }
                                                                                    
                                                                                    // Generic iframe extraction
                                                                                    if (isIframe && url.includes('src=')) {
                                                                                        const srcMatch = url.match(/src="([^"]+)"/);
                                                                                        if (srcMatch) embedUrl = srcMatch[1];
                                                                                    }
                                                                                    
                                                                                    return (
                                                                                        <div key={i}>
                                                                                            {isVideo ? (
                                                                                                // Video embed
                                                                                                <div className="bg-white rounded-lg overflow-hidden border-2 border-gray-200">
                                                                                                    <div className="bg-gradient-to-r from-indigo-500 to-purple-500 px-3 py-2 flex items-center gap-2">
                                                                                                        <span className="text-white text-sm">🎬</span>
                                                                                                        <span className="text-white text-xs font-semibold">
                                                                                                            Video Tutorial {task.screenshotUrls.filter(u => u).length > 1 ? `#${i + 1}` : ''}
                                                                                                        </span>
                                                                                                    </div>
                                                                                                    <div className="relative" style={{ paddingBottom: '56.25%', height: 0 }}>
                                                                                                        <iframe
                                                                                                            src={embedUrl}
                                                                                                            className="absolute top-0 left-0 w-full h-full"
                                                                                                            frameBorder="0"
                                                                                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                                                                            allowFullScreen
                                                                                                            title={`Video Tutorial ${i + 1}`}
                                                                                                        />
                                                                                                    </div>
                                                                                                </div>
                                                                                            ) : (
                                                                                                // Regular screenshot link
                                                                                                <a
                                                                                                    href={url}
                                                                                                    target="_blank"
                                                                                                    rel="noopener noreferrer"
                                                                                                    className="flex items-center gap-2 text-xs text-blue-600 hover:underline bg-blue-50 px-3 py-2 rounded"
                                                                                                >
                                                                                                    <span>📸</span>
                                                                                                    <span>Screenshot {task.screenshotUrls.filter(u => u).length > 1 ? `#${i + 1}` : ''} - Click to view</span>
                                                                                                </a>
                                                                                            )}
                                                                                        </div>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                        
                                                                        {/* Backward compatibility for single URL */}
                                                                        {task.screenshotUrl && !task.screenshotUrls && (
                                                                            <a
                                                                                href={task.screenshotUrl}
                                                                                target="_blank"
                                                                                rel="noopener noreferrer"
                                                                                className="block text-xs text-blue-600 hover:underline mt-2"
                                                                            >
                                                                                🔗 Screenshot
                                                                            </a>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <p className="text-sm text-gray-500">No tasks for this step</p>
                                                )}

                                                {/* Mark Complete Button */}
                                                {!isCompleted && (
                                                    <button
                                                        onClick={() => markComplete(step.id, index)}
                                                        className="mt-4 w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-3 rounded-lg transition"
                                                    >
                                                        Mark as Complete
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* Reference Materials */}
                        {journey.attachments && journey.attachments.length > 0 && (
                            <div className="mt-8 bg-white rounded-xl shadow-lg p-6">
                                <h3 className="text-lg font-bold text-gray-800 mb-4">📎 Reference Materials</h3>
                                <div className="space-y-2">
                                    {journey.attachments.map((link, index) => (
                                        <a
                                            key={index}
                                            href={link.url}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-800 hover:underline p-2 hover:bg-indigo-50 rounded transition"
                                        >
                                            <span>🔗</span>
                                            <span className="flex-1">{link.name}</span>
                                        </a>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Completion Message */}
                        {progressPercent === 100 && (
                            <div className="mt-8 bg-gradient-to-r from-green-400 to-emerald-500 rounded-xl shadow-lg p-8 text-center text-white">
                                <div className="text-6xl mb-4">🏆</div>
                                <h3 className="text-3xl font-black mb-2">Journey Complete!</h3>
                                <p className="text-xl mb-6">
                                    Congratulations! You've completed the {journey.title}
                                </p>
                                <div className="flex gap-4 justify-center">
                                    <button
                                        onClick={onBack}
                                        className="bg-white text-green-600 px-8 py-4 rounded-xl font-bold text-lg hover:bg-green-50 transition-colors shadow-lg"
                                    >
                                        Back to Dashboard
                                    </button>
                                    <button
                                        onClick={resetJourney}
                                        className="bg-green-600 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition-colors shadow-lg"
                                    >
                                        Practice Again
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const { onAuthStateChanged } = window.firebaseModules;

                const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);

                        const { doc, getDoc } = window.firebaseModules;
                        const userDoc = await getDoc(doc(db, 'users', firebaseUser.uid));

                        if (userDoc.exists()) {
                            const userData = userDoc.data();
                            // Only allow students
                            if (userData.role === 'student') {
                                setUserProfile(userData);
                            } else {
                                alert('Access denied. This is the student portal.');
                                const { signOut } = window.firebaseModules;
                                await signOut(auth);
                            }
                        }
                    } else {
                        setUser(null);
                        setUserProfile(null);
                    }
                    setLoading(false);
                });

                return () => unsubscribe();
            }, []);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
                        <div className="text-white text-2xl font-bold">Loading...</div>
                    </div>
                );
            }

            if (!user || !userProfile) {
                return <LoginPage />;
            }

            return <StudentDashboard user={user} userProfile={userProfile} />;
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
